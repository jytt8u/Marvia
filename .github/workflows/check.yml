# Проверка каждого изменения — до того, как оно доедет до тега.
#
# Сборка в release.yml бежит только на метку v* и на кнопку. Значит, сломанный
# коммит спокойно доезжал до релиза и выяснялся там: сорок с лишним файлов
# тестов между релизами не запускались вовсе, и зелёный список был ложным
# спокойствием. Здесь то же самое, что делают руками перед PR — gofmt, vet,
# тесты, сборка под три цели, — но на каждый PR и на каждый коммит в main.
#
# Ничего не выкладывается: это проверка, а не релиз.

name: Проверка

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Тесты и сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Версию берём из go.mod, чтобы она не разъехалась с той, на которой
          # проект собирают руками.
          go-version-file: go.mod
          cache: true

      # gofmt молчит на чистом коде, а на грязном печатает имена файлов —
      # их и показываем, чтобы не гадать.
      - name: Форматирование
        run: |
          dirty="$(gofmt -l .)"
          if [ -n "$dirty" ]; then
            echo "не отформатировано gofmt:"
            echo "$dirty"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Тема и интерфейсы
        run: node --test internal/look/look.test.cjs internal/panel/web.test.cjs

      # Те же цели, что в релизе. Файлы под Windows собираются только под
      # Windows, и без этого шага ошибка в них жила бы до первого тега.
      - name: Сборка под три цели
        run: |
          set -eu
          for os_arch in linux/amd64 linux/arm64; do
            for cmd in marvia-panel marvia-node marvia-keygen; do
              CGO_ENABLED=0 GOOS="${os_arch%/*}" GOARCH="${os_arch#*/}" \
                go build -trimpath -o /dev/null "./cmd/$cmd"
            done
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-H windowsgui" -o /dev/null ./cmd/marvia-windows

  android:
    name: Android — ядро, тесты и приложение
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # SDK есть в образе GitHub, но sdkmanager в PATH не лежит — зовём его по
      # пути. Версии совпадают с локальной сборкой. Ядро всегда собирается из
      # этого commit, готовый AAR не кешируем: старый бинарник может не
      # содержать методы текущего Kotlin.
      - name: Android SDK и NDK
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null 2>&1 || true
          "$sdk" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Go-мост для Android
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          mkdir -p android/app/libs
          "$(go env GOPATH)/bin/gomobile" bind \
            -target=android/arm64,android/arm -androidapi 24 -trimpath -ldflags="-s -w" \
            -javapkg=io.marvia -o android/app/libs/marvia.aar ./mobile

      - name: Kotlin-тесты и отладочное приложение
        working-directory: android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Отчёт Android-тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
