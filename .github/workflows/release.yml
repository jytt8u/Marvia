# Сборка готовых бинарников.
#
# Без неё продавец не может начать: установщик панели требует три бинарника
# рядом с собой, а взять их можно только собрав из исходников. Человек, который
# «не касается кода», на этом и останавливается — на нулевом шаге.
#
# Собираем на метку вида v0.1.0 и на кнопку «запустить» — второе нужно, чтобы
# проверить сборку, не выпуская релиз.

name: Сборка

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Собрать и выложить
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Версию берём из go.mod, чтобы она не разъехалась с той, на которой
          # проект собирают руками.
          go-version-file: go.mod
          cache: true

      - name: Тесты
        run: go test ./...

      - name: Собрать
        run: |
          set -eu

          # Версия попадает внутрь бинарника: без неё на вопрос «что у тебя
          # стоит» продавец ответить не сможет, а поддержка — тем более.
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="dev-${GITHUB_SHA::7}" ;; esac
          echo "Версия: $VERSION"

          mkdir -p dist

          # Панель, нода и генератор ключей — всё, что стоит на сервере
          # продавца. Бота он пишет сам: у каждого свои тарифы, свой приём
          # денег и своя ответственность за них. Наше дело — API.
          for os_arch in linux/amd64 linux/arm64; do
            os="${os_arch%/*}"
            arch="${os_arch#*/}"
            out="build/${os}_${arch}"
            mkdir -p "$out"

            for cmd in marvia-panel marvia-node marvia-keygen; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath \
                  -ldflags "-s -w -X main.version=${VERSION}" \
                  -o "$out/$cmd" "./cmd/$cmd"
            done

            # Установщик кладём в тот же архив: распаковал — и всё на месте,
            # ничего больше качать не надо.
            cp scripts/install-panel.sh "$out/install-panel.sh"
            cp scripts/upgrade.sh "$out/upgrade.sh"
            chmod +x "$out/install-panel.sh" "$out/upgrade.sh"

            tar -czf "dist/marvia_${os}_${arch}.tar.gz" -C "$out" .
          done

          # Клиент под Windows. Отдельным файлом, а не в архиве: ссылку на него
          # продавец вставляет в бота, а покупатель нажимает на телефоне или на
          # компьютере — распаковывать он ничего не будет.
          #
          # -H windowsgui убирает чёрное окно консоли за окном приложения.
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath \
              -ldflags "-H windowsgui -s -w -X main.version=${VERSION}" \
              -o dist/marvia-windows.exe ./cmd/marvia-windows

          # Установщик выкладываем и отдельным файлом: с него всё начинается,
          # а качать ради него архив — лишний шаг на самом первом шаге.
          cp scripts/install-panel.sh dist/install-panel.sh
          # Служба обновления на серверах берёт сценарий отсюда, из релиза, и
          # сверяет с SHA256SUMS — а не из ветки, которая меняется в любой миг.
          cp scripts/upgrade.sh dist/upgrade.sh

          cd dist && sha256sum *.tar.gz install-panel.sh upgrade.sh marvia-windows.exe > SHA256SUMS && cat SHA256SUMS

      - name: Подписать контрольные суммы сборки
        id: attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: dist/SHA256SUMS

      - name: Сохранить подпись рядом с релизом
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/SHA256SUMS.sigstore.json

      # Релиз выкладывается сюда же.
      #
      # Раньше сборки уезжали в отдельный публичный репозиторий: исходники были
      # закрыты, а у закрытого репозитория файлы релиза по ссылке не отдаются —
      # «скачай и запусти» там не работает в принципе. Теперь репозиторий один
      # и он публичный, поэтому чужой токен больше не нужен: GITHUB_TOKEN
      # действует ровно на тот репозиторий, где идёт сборка.
      - name: Выложить релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/marvia_linux_amd64.tar.gz
            dist/marvia_linux_arm64.tar.gz
            dist/install-panel.sh
            dist/upgrade.sh
            dist/marvia-windows.exe
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          body: |
            Установка панели на чистый сервер:

            ```
            curl -fsSL https://github.com/jytt8u/marvia/releases/latest/download/install-panel.sh -o install-panel.sh
            sh install-panel.sh --domain панель.твой-домен --email ты@почта
            ```

            Ноды скачивать не надо: панель выдаёт для них готовую строку.

            **Приложения покупателям раздаёт сама панель** — с домена продавца, а
            не отсюда. Установщик кладёт их на место; ссылки бот берёт у панели
            запросом `GET /api/v1/apps`.

            Это не удобство, а работоспособность: провайдеры уже рубят загрузку
            из Google Play и App Store, объясняя это блокировкой международных
            CDN. GitHub раздаётся через такой же CDN.

            Контрольные суммы — в `SHA256SUMS`, установщик сверяет их сам.

      - name: Сохранить сборку
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: marvia-dist
          path: dist/
          retention-days: 14
