name: Проверка безопасности

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Зависимости — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Установить сканер известной версии
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # Текстовый режим возвращает ошибку при достижимой уязвимости.
      # JSON сам по себе возвращает 0 даже при находках, для запрета он не годится.
      - name: Проверить достижимые известные уязвимости
        run: govulncheck ./...

  # Фаззинг всего, что приходит снаружи: кадры VP1, первые байты на ноде
  # (VLESS, Trojan), ссылки и подписки чужих панелей, заголовки продавца.
  #
  # Длительность задана числом прогонов, а не временем. С -fuzztime=60s Go
  # иногда срывается на остановке по таймеру — «context deadline exceeded»
  # без единого найденного входа, — и красный значок ничего не значил.
  fuzz:
    name: Фаззинг — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: internal/vp1, target: FuzzReadFrame }
          - { pkg: internal/vp1, target: FuzzUnpackPadded }
          - { pkg: internal/vp1, target: FuzzReadRequest }
          - { pkg: internal/vp1, target: FuzzReadDatagram }
          - { pkg: internal/inbound, target: FuzzReadVLESSRequest }
          - { pkg: internal/inbound, target: FuzzReadTrojanRequest }
          - { pkg: internal/foreign, target: FuzzParseLink }
          - { pkg: internal/foreign, target: FuzzParseList }
          - { pkg: internal/foreign, target: FuzzParseUserinfo }
          - { pkg: internal/client, target: FuzzParseAccountLink }
          - { pkg: internal/seller, target: FuzzSellerHeaders }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Разобрать миллион случайных входов
        shell: bash
        run: |
          set -euo pipefail
          go test "./${{ matrix.pkg }}" -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=1000000x -parallel=2
      - name: Сохранить входные данные найденного сбоя
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  protocol-attacks:
    name: VP1 — подмена, повторы и гонки
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить атаки и передачу данных с детектором гонок
        run: go test -race -count=1 -timeout=10m -v ./internal/vp1 ./internal/users ./internal/inbound ./internal/transport ./internal/tunnel ./internal/mux ./internal/relay

  # Ядро телефона: смена сети, отмена дозвона и туннель подписки ходят
  # из нескольких горутин сразу — ровно то, что ловит детектор гонок.
  client-core-races:
    name: Ядро клиента и телефона — гонки
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить смену сети, отмену и подписку с детектором гонок
        run: go test -race -count=1 -timeout=10m ./mobile ./internal/tunbridge ./internal/seller ./internal/netpath

  access-and-updates:
    name: Панель, снимки доступа и обновления — безопасность
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить права, снимки, обновления и защиту токенов подписки
        run: go test -race -count=1 -timeout=10m -v ./internal/panel ./internal/nodesync ./internal/updater ./internal/client ./internal/foreign ./internal/httpguard

  sigstore-root:
    name: Корень доверия Sigstore в службе обновления не устарел
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Служба проверяет подпись этим корнем, когда сервер Sigstore с хостинга
      # недоступен (internal/updater/updater.go, trustedRoot). Устаревший
      # корень пропуска не даст, но и обновить такой сервер не позволит:
      # заменять файл надо раньше, чем Sigstore сменит ключи.
      - name: Сравнить с корнем, который сейчас раздаёт Sigstore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation trusted-root > fresh.jsonl
          if ! diff -q fresh.jsonl internal/updater/sigstore-root.jsonl; then
            echo '::error::корень Sigstore сменился: gh attestation trusted-root > internal/updater/sigstore-root.jsonl'
            exit 1
          fi
