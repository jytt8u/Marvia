name: Проверка безопасности

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Зависимости — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Установить сканер известной версии
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # Текстовый режим возвращает ошибку при достижимой уязвимости.
      # JSON сам по себе возвращает 0 даже при находках, для запрета он не годится.
      - name: Проверить достижимые известные уязвимости
        run: govulncheck ./...

  fuzz:
    name: Фаззинг — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzReadFrame, FuzzUnpackPadded, FuzzReadRequest, FuzzReadDatagram]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить границы кадров, запросов и датаграмм
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/vp1 -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=60s -parallel=2
      - name: Сохранить входные данные найденного сбоя
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vp1-fuzz-failures-${{ matrix.target }}
          path: internal/vp1/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  protocol-attacks:
    name: VP1 — подмена, повторы и гонки
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить атаки и передачу данных с детектором гонок
        run: go test -race -count=1 -timeout=5m -v ./internal/vp1 ./internal/users

  access-and-updates:
    name: Панель, снимки доступа и обновления — безопасность
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить права, шифрование снимков и доверие к обновлениям
        run: go test -race -count=1 -timeout=10m -v ./internal/panel ./internal/nodesync ./internal/updater
