// el — короткий конструктор элемента: тег, класс, содержимое.
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

// pills рисует ряд таблеток: активная — акцентом. Все ручки темы, кроме
// цветов, выбираются так.
function pills(id, keys, current, names, onPick) {
  const box = $(id);
  box.replaceChildren();
  for (const k of keys) {
    const b = el("button", "pillb", names[k] || k);
    b.type = "button";
    b.dataset.focus = id + "-" + k;
    b.setAttribute("aria-pressed", String(current === k));
    b.addEventListener("click", () => onPick(k));
    box.append(b);
  }
}

function swatches(id, colors, current, paint, onPick) {
  const box = $(id);
  box.replaceChildren();
  for (const c of colors) {
    const b = el("button", "swatch");
    b.type = "button";
    b.dataset.focus = id + "-" + c;
    b.setAttribute("aria-label", c == null ? L().themeTintAuto : (id === "accents" ? L().themeAccent : id === "bases" ? L().themeBase : L().themeTint) + " " + c);
    b.style.background = paint(c);
    b.setAttribute("aria-pressed", String(current === c));
    b.addEventListener("click", () => onPick(c));
    box.append(b);
  }
}

// paintTheme рисует вкладку «Тема». Заново при каждой смене: у карточек
// подсветка выбранного, а у плиток — цвет активной, и всё это от темы.
// Прокрутка колонки ручек при этом остаётся: перерисовываются дети, а не
// сама колонка.
function paintTheme() {
  const focusKey = document.activeElement && document.activeElement.dataset.focus;
  const d = L();
  const t = Look.theme(look);
  $("theme-copy-status").textContent = "";

  // Основа — фон и текст палитры. Готовых видов больше нет: их место заняли
  // образы, а здесь остаётся только то, чего образ сам не решает.
  swatches("bases", Object.keys(Look.PRESETS), look.preset,
    (k) => "linear-gradient(135deg," + Look.PRESETS[k].bg + " 55%," + Look.PRESETS[k].acc + " 55%)",
    (k) => setLook({ preset: k }));

  swatches("accents", Look.ACCENTS, t.acc, (c) => c, (c) => setLook({ acc: c }));
  swatches("tints", [null].concat(Look.ACCENTS), look.tint,
    (c) => "linear-gradient(135deg," + (c || t.acc) + "," + Look.mix(c || t.acc, "#000000", 0.6) + ")",
    (c) => setLook({ tint: c }));
  // Пипетки: любой цвет, а не только из кружков.
  $("acc-pick").value = t.acc;
  $("tint-pick").value = look.tint || t.acc;

  // Лампа: экран, залитый настоящим фоном; нажатие в угол переносит свет.
  const litBg = (kind, dir) => Look.theme(Object.assign({}, look, { kind, dir })).bgcss;
  const lamp = $("lamp");
  lamp.replaceChildren();
  lamp.style.background = litBg(look.kind === "flat" ? "linear" : look.kind, look.dir);
  for (const k of ["nw", "n", "ne", "w", "c", "e", "sw", "s", "se"]) {
    const b = el("button");
    b.type = "button";
    b.dataset.focus = "lamp-" + k;
    b.setAttribute("aria-label", d.dirs[k]);
    b.setAttribute("aria-pressed", String(look.dir === k));
    b.append(el("i"));
    b.addEventListener("click", () => setLook({ dir: k, kind: look.kind === "flat" ? "linear" : look.kind }));
    lamp.append(b);
  }
  lamp.append(el("span", "hint", d.themeLampHint));
  $("light-note").textContent = look.kind === "flat" ? d.themeLightOff : d.dirs[look.dir];

  const kinds = $("kinds");
  kinds.replaceChildren();
  for (const k of Look.KINDS) {
    const b = el("button", "kind");
    b.type = "button";
    b.dataset.focus = "kind-" + k;
    b.setAttribute("aria-pressed", String(look.kind === k));
    const i = el("i");
    i.style.background = litBg(k, look.dir);
    b.append(i, el("span", null, d.kinds[k]));
    b.addEventListener("click", () => setLook({ kind: k }));
    kinds.append(b);
  }

  const depth = $("depth");
  depth.setAttribute("aria-label", d.themeDepth);
  depth.value = Math.round(look.depth * 100);
  $("depth-note").textContent = d.depths[look.depth <= 0.3 ? 0 : look.depth <= 0.5 ? 1 : look.depth <= 0.7 ? 2 : look.depth <= 0.85 ? 3 : 4];

  pills("cardKinds", Look.CARDS, look.card, d.cardKinds, (k) => setLook({ card: k }));
  pills("buttons", Look.BUTTONS, look.btn, d.buttons, (k) => setLook({ btn: k }));

  // Профили — три слота с кодами. Пустой слот занимается кнопкой «сохранить
  // сюда», занятый по нажатию применяется.
  const slots = Look.loadProfiles();
  const profiles = $("profiles");
  profiles.replaceChildren();
  slots.forEach((code, i) => {
    const b = el("button", "pillb", (code ? d.themeSlotFull : d.themeSlotEmpty) + " " + (i + 1));
    b.type = "button";
    b.dataset.focus = "profile-" + i;
    b.setAttribute("aria-pressed", String(profileSlot === i));
    b.addEventListener("click", () => {
      profileSlot = i;
      if (!code || !applyCode(code)) paintTheme();
    });
    profiles.append(b);
  });

  paintBackdropKnobs();
  $("theme-code").textContent = fullCode();
  $("theme-code").title = d.themeCopy;
  $("code-in").placeholder = d.themeCodePlaceholder;
  $("code-in").setAttribute("aria-label", d.themeCodePlaceholder);
  if (focusKey) {
    const next = Array.from(document.querySelectorAll("[data-focus]")).find((e) => e.dataset.focus === focusKey);
    if (next) next.focus({ preventScroll: true });
  }
}

/* ------------------------------------------------------------- прокси */

/*
  Предупреждение о системном прокси.

  Показываем только при поднятом туннеле, и вот почему: пока туннель выключен,
  прокси никому не мешает и говорить не о чем. А вот когда окно написало «весь
  трафик компьютера идёт через туннель», это обещание должно быть верным — или
  рядом должно стоять честное «кроме вот этого».

  Кнопка снимает только настройку системы. Переменные окружения живут в уже
  запущенных программах, наша правка до них не дойдёт, и обещать обратное
  нечестно — так и пишем.
*/
function showProxy(s) {
  const box = $("proxy-warn");
  const show = s.state === "connected" && !!s.proxy;

  box.hidden = !show;
  if (!show) return;

  $("proxy-text").textContent = s.proxy;

  // Переменные окружения снять из реестра нельзя, поэтому и кнопку не
  // показываем: кнопка, которая не помогает, хуже её отсутствия.
  const button = $("proxy-off");
  button.hidden = s.proxy_env;
  $("proxy-care").hidden = s.proxy_env;
  $("proxy-msg").textContent = s.proxy_env
    ? L().proxyEnv
    : "";
}

async function dropProxy() {
  const button = $("proxy-off");
  const said = $("proxy-msg");

  button.disabled = true;
  said.textContent = L().proxyRemoving;
  try {
    const after = await api("POST", "api/proxy/off");
    render(after);
    if (!after.proxy) {
      said.textContent = L().proxyGone;
    }
  } catch (e) {
    said.textContent = e.message;
  } finally {
    button.disabled = false;
  }
}

/* ----------------------------------------------------------------- обмен */

// Всё лежит под одноразовым ключом в адресе: /<ключ>/. Запросы поэтому
// относительные — они сами попадают куда надо, а ключ нигде не дублируется.
const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";

async function api(method, path, body) {
  const res = await fetch(base + path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : {};
  if (!res.ok) throw new Error(data.error || (L().err + res.status));
  return data;
}

/* ----------------------------------------------------------- выбор ноды */

// Список стран рисуем сами, без шаблонов: строк единицы, а каждая новая
// зависимость в окне — это то, что придётся вшивать и обновлять.
//
// Текст не вставляем разметкой: имя и страну пишет продавец, и одна кавычка
// в названии сервера превратилась бы в сломанную страницу, а то и хуже.
function paintNodes(list) {
  const box = $("nodes-list");
  box.replaceChildren();

  const d = L();
  if (!list || list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = d.nodesNone;
    box.append(empty);
    return;
  }

  const row = (opts) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "row-node";
    if (opts.alive) b.setAttribute("data-alive", "");
    if (opts.current) b.setAttribute("data-current", "");
    if (opts.chosen) b.setAttribute("data-chosen", "");

    const dot = document.createElement("span");
    dot.className = "dot";

    const grow = document.createElement("div");
    grow.className = "grow";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = opts.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = opts.sub;
    grow.append(name, sub);

    // Полоска качества: замер в миллисекундах на глаз не сравнить, а длина —
    // сравнивается. Триста миллисекунд и хуже — пусто.
    const bar = document.createElement("span");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = opts.ms > 0 ? Math.max(0, Math.min(100, Math.round((1 - opts.ms / 300) * 100))) + "%" : "0";
    bar.append(fill);

    const ms = document.createElement("div");
    ms.className = "ms";
    ms.textContent = opts.ms > 0 ? opts.ms + d.ms : d.pingUnknown;

    b.append(dot, grow, bar, ms);
    b.addEventListener("click", () => chooseNode(opts.id));
    return b;
  };

  // Автовыбор — первой строкой: это состояние по умолчанию, и вернуться к
  // нему человек должен уметь так же легко, как уйти.
  const chosenAny = list.some((n) => n.chosen);
  const fastest = list.filter((n) => n.alive && n.ms > 0).sort((a, b) => a.ms - b.ms)[0];
  box.append(row({
    id: 0,
    name: d.nodesAuto,
    sub: fastest ? d.nodesAutoSub + " — " + (fastest.country || fastest.name) : d.nodesAutoSub,
    ms: 0,
    alive: true,
    chosen: !chosenAny,
    current: false,
  }));

  for (const n of list) {
    // Что показываем под именем: сначала то, где трафик, потом выбор.
    // Это разные вещи: выбранная нода могла замолчать, и ядро уехало на живую.
    let sub = n.country && n.country !== n.name ? n.name : "";
    const marks = [];
    if (n.current) marks.push(d.nodesCurrent);
    if (n.setup_ms > 0) marks.push(d.setupLabel + ": " + n.setup_ms + d.ms);
    if (n.chosen) marks.push(d.nodesChosen);
    if (!n.alive && !n.current) marks.push(n.ms > 0 ? d.nodesDead : d.nodesUnknown);
    if (marks.length) sub = sub ? sub + " · " + marks.join(" · ") : marks.join(" · ");

    box.append(row({
      id: n.id,
      name: n.country || n.name,
      sub,
      ms: n.ms > 0 ? n.ms : 0,
      alive: n.alive,
      current: n.current,
      chosen: n.chosen,
    }));
  }
}

/* -------------------------------------------------------------- величины */

function bytes(n) {
  const units = L().bytes;
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? Math.round(n) : n.toFixed(1)) + " " + units[i];
}

function clock(seconds) {
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  const two = (n) => String(n).padStart(2, "0");
  return two(h) + ":" + two(m) + ":" + two(s);
}

// keyParts достаёт из ссылки то, что можно показать: хост подписки и метку.
// Сам ключ — между «//» и «@» — на экран не выводится: он и так в поле ниже.
function keyParts(link) {
  const m = /^marvia:\/\/[^@]*@([^/#?]+)[^#]*(?:#(.*))?$/.exec((link || "").trim());
  if (!m) return null;
  let label = "";
  try { label = decodeURIComponent(m[2] || ""); } catch (_) { label = m[2] || ""; }
  return { host: m[1], label };
}

/* ------------------------------------------------------------- отрисовка */

// Названия состояний живут в словаре: их видит человек, а не программа.


/*
  Последняя ошибка, показанная в ответ на нажатие.

  Опрос состояния приходит раз в секунду и переписывает ту же строку, поэтому
  всё, что программа отвечает сразу — «не задана ссылка доступа», «нужны права
  администратора», — вспыхивало и пропадало быстрее, чем человек успевал
  прочитать. Он видел красный проблеск и нажимал снова.
*/
let complaint = null;

function complain(text) {
  complaint = { text, until: Date.now() + 12000 };
  $("detail").textContent = text;
}

function complaintNow() {
  if (complaint && Date.now() < complaint.until) return complaint.text;
  complaint = null;
  return null;
}

// Скорость — в мегабитах, как на телефоне и как её пишут провайдеры:
// «7,8 МБ/с» рядом с тарифом «100 Мбит/с» читается как втрое меньше.
function mbit(bytesPerSecond) {
  const v = Math.max(0, bytesPerSecond || 0) * 8 / 1e6;
  return v.toLocaleString(lang === "en" ? "en-US" : "ru-RU", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + " " + L().mbps;
}

// Бегущая линия скорости — та же, что на телефоне (SpeedSpark). Замер раз в
// секунду; перерисуй его скачком — и линия дёргается на шаг, как старый
// осциллограф. Поэтому новый кадр рисуется сдвинутым на шаг вправо и плавно
// съезжает на место. Слева — нули: до подключения скорость и была нулевой.
const SPARK = 30;
const sparkSeen = {down: [], up: []};
function paintSpark(svg, key, value, live) {
  const seen = sparkSeen[key];
  if (live) { seen.push(Math.max(0, value || 0)); while (seen.length > SPARK + 1) seen.shift(); }
  else seen.length = 0;
  const list = Array(SPARK + 1 - seen.length).fill(0).concat(seen);
  const W = 300, H = 40, top = 4, bottom = H - 2, step = W / (SPARK - 1);
  // Шкала не ниже 0,5 Мбит/с: иначе фоновый шорох рисовался бы горами.
  const max = Math.max(0.5e6 / 8, ...list);
  const n = list.length;
  const pts = list.map((v, i) => [W - (n - 1 - i) * step, bottom - (bottom - top) * v / max]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  svg.querySelector(".line").setAttribute("d", line);
  svg.querySelector(".area").setAttribute("d", line + " L" + W + "," + H + " L" + pts[0][0].toFixed(1) + "," + H + " Z");
  svg.classList.toggle("live", live && seen.some(v => v > 0));
  const g = svg.querySelector("g");
  if (!live || matchMedia("(prefers-reduced-motion: reduce)").matches) { g.style.transition = "none"; g.style.transform = ""; return; }
  g.style.transition = "none";
  g.style.transform = "translateX(" + step + "px)";
  void g.getBoundingClientRect();
  g.style.transition = "transform .95s linear";
  g.style.transform = "translateX(0)";
}

function render(s) {
  const d = L();
  if (window.vibeState) window.vibeState(s.state);
  document.body.dataset.state = s.state;
  $("status").textContent = d.state[s.state] || s.state;
  $("power").dataset.state = s.state;
  // Во время подключения кнопка была заблокирована, а обработчик отмену умел:
  // человек полторы минуты смотрел на замершее окно и не мог ничего сделать.
  $("power").disabled = !s.elevated;
  $("power").title =
    s.state === "connecting" ? d.power.cancel
    : s.state === "connected" || s.state === "stalled" ? d.power.off
    : d.power.on;
  $("elev-warn").hidden = s.elevated;
  $("version").textContent = formatVersion(s.version);
  $("update-card").hidden = !s.update;
  if (s.update) $("update-title").textContent = d.updateTitle(s.update);
  // Точка на вкладке — чтобы заметили, не заходя в настройки.
  document.querySelector('.tab[data-tab="settings"]').classList.toggle("news", !!s.update);

  const detail = $("detail");

  // Пока подключаемся или подключились, жалоба уже неактуальна.
  if (s.state === "connecting" || s.state === "connected") complaint = null;

  const said = complaintNow();
  detail.classList.toggle("bad", s.state === "failed" || s.state === "stalled" || said !== null);
  if (said !== null) detail.textContent = said;
  else if (s.state === "failed") detail.textContent = s.reason || d.detail.unknown;
  else if (s.state === "stalled") detail.textContent = s.reason || d.detail.stalled;
  else if (s.state === "connecting") detail.textContent = d.detail.connecting;
  else if (s.state === "connected") detail.textContent = s.since ? d.sessionLine(clock(Math.max(0, Math.floor(Date.now() / 1000) - s.since))) : d.detail.connected;
  else if (!s.has_account) detail.textContent = d.detail.noKey;
  else detail.textContent = d.detail.idle;

  // Поле ключа на первом экране — только пока ключа нет.
  $("first-key").hidden = s.has_account;

  // Подписка: до какого числа и сколько осталось — в боковой и на вкладке ключа.
  const parts = [];
  if (s.until) parts.push(d.until + s.until);
  if (s.limit_bytes > 0) parts.push(d.left + bytes(s.left_bytes || 0));
  $("sub-title").textContent = s.has_account ? d.subOn : d.subOff;
  $("subscription").textContent = parts.length ? parts.join(" · ") : (s.has_account ? d.subAfter : d.subNoKey);

  const up = s.state === "connected" || s.state === "stalled";
  $("key-state").textContent = s.has_account ? d.keyOn : d.keyOff;
  $("key-state").classList.toggle("on", s.has_account);
  $("f-until").textContent = s.until ? s.until : (up ? d.keyNoUntil : "—");
  $("f-traffic").textContent = s.limit_bytes > 0 ? bytes(s.left_bytes || 0) + " / " + bytes(s.limit_bytes) : (up ? d.keyNoLimit : "—");
  $("f-fill").style.width = s.limit_bytes > 0 ? Math.round(100 * Math.max(0, s.left_bytes || 0) / s.limit_bytes) + "%" : "0";
  $("key-note").textContent = up ? "" : d.keyNote;

  if (s.node) {
    $("node-name").textContent = s.node;
    $("node-addr").textContent = s.address;
    $("node-ping").textContent = s.ping_ms ? s.ping_ms + d.ms : d.pingUnknown;
    $("rule-now").textContent = s.node;
    $("k-ping").textContent = s.ping_ms ? s.ping_ms + d.ms : d.pingUnknown;
  } else {
    $("node-name").textContent = d.noNode;
    $("node-addr").textContent = d.noNodeSub;
    $("node-ping").textContent = "";
    $("rule-now").textContent = "—";
    $("k-ping").textContent = "—";
  }

  // Сессия считается здесь, по моменту подъёма: секунды тикают сами, и
  // программе незачем слать готовую строку раз в секунду.
  $("k-session").textContent = up && s.since ? clock(Math.max(0, Math.floor(Date.now() / 1000) - s.since)) : "—";

  showProxy(s);
  paintSeller(s.seller);

  // Снятия делает ядро: скорость и пик не теряются, пока окно спрятано.
  const traffic = s.traffic || {};
  $("s-down").textContent = mbit(up ? traffic.rate_down : 0);
  $("s-up").textContent = mbit(up ? traffic.rate_up : 0);
  paintSpark($("spark-down"), "down", traffic.rate_down, up);
  paintSpark($("spark-up"), "up", traffic.rate_up, up);

  $("t-down").textContent = bytes(s.down || 0);
  $("t-up").textContent = bytes(s.up || 0);
  const today = bytes((traffic.today_up || 0) + (traffic.today_down || 0));
  $("today-total").textContent = today;
  $("w-today").textContent = today;
  $("peak-down").textContent = mbit(traffic.peak_down);
  $("peak-up").textContent = mbit(traffic.peak_up);
  const seconds = s.since ? Math.max(1, Date.now() / 1000 - s.since) : 0;
  $("average-down").textContent = seconds ? mbit((s.down || 0) / seconds) : "—";
  $("average-up").textContent = seconds ? mbit((s.up || 0) / seconds) : "—";
  paintDaily($("day-bars"), traffic.hours);
  paintDaily($("w-day-bars"), traffic.hours);
  paintWeek(traffic.week);


  // Виджет — тот же экран в другой шкуре: кнопка, состояние, сессия и
  // скорость, нода. Красится тем же, чем окно, только короче.
  $("w-power").dataset.state = s.state;
  $("w-power").dataset.btn = $("power").dataset.btn || "";
  $("w-power").disabled = !s.elevated;
  $("w-power").title = $("power").title;
  $("w-status").textContent = $("status").textContent;
  const wmeta = [];
  if (up && s.since) wmeta.push(clock(Math.max(0, Math.floor(Date.now() / 1000) - s.since)));
  if (up) wmeta.push($("s-down").textContent);
  $("w-meta").textContent = wmeta.length ? wmeta.join(" · ") : (!s.has_account ? d.wNoKey : $("detail").textContent);
  $("w-node").textContent = $("node-name").textContent;
  $("w-ping").textContent = $("node-ping").textContent;
  $("w-session").textContent = $("k-session").textContent;
  $("w-down").textContent = $("s-down").textContent;
  $("w-up").textContent = $("s-up").textContent;
  $("w-t-down").textContent = $("t-down").textContent;
  $("w-t-up").textContent = $("t-up").textContent;
  $("w-kping").textContent = $("k-ping").textContent;
  // Точечные цифры — после виджета: он берёт из этих полей обычный текст.
  if (window.paintDotNums) window.paintDotNums();
}

function paintDaily(box, hours) {
  const values = Array.from({length: 24}, (_, i) => Math.max(0, Number(hours && hours[i]) || 0));
  const current = new Date().getHours();
  const signature = current + ":" + values.join(",");
  if (box.dataset.values === signature) return;
  box.dataset.values = signature;
  if (box.children.length !== 24) {
    box.replaceChildren(...values.map(() => document.createElement("i")));
  }
  const highest = Math.max(1, ...values);
  [...box.children].forEach((bar, i) => {
    bar.style.height = Math.max(4, values[i] / highest * 100) + "%";
    bar.title = String(i).padStart(2, "0") + ":00 · " + bytes(values[i]);
    bar.toggleAttribute("data-current", i === current);
  });
}

// paintWeek — семь суток столбиками, от старых к сегодняшним. Дни программа
// присылает уже с нулями там, где туннеля не было, — пропуск читался бы как
// «этого дня не было».
function paintWeek(week) {
  const days = (week || []).map((w) => ({ day: w.day, total: Math.max(0, (w.up || 0) + (w.down || 0)) }));
  const box = $("week-bars");
  const signature = lang + ":" + days.map((w) => w.day + "=" + w.total).join(",");
  if (box.dataset.values === signature) return;
  box.dataset.values = signature;
  const highest = Math.max(1, ...days.map((w) => w.total));
  // Название дня недели — по местному календарю, на языке окна: дату
  // разбираем как местную полночь, а не как UTC, иначе вечером на западе
  // от Гринвича подпись съехала бы на день назад.
  const label = (iso) => {
    const [y, m, dd] = iso.split("-").map(Number);
    return new Date(y, m - 1, dd).toLocaleDateString(lang === "ru" ? "ru-RU" : "en-GB", { weekday: "short" });
  };
  box.replaceChildren(...days.map((w, i) => {
    const bar = document.createElement("i");
    bar.style.height = Math.max(4, w.total / highest * 100) + "%";
    bar.title = label(w.day) + " · " + bytes(w.total);
    bar.toggleAttribute("data-current", i === days.length - 1);
    return bar;
  }));
  $("week-axis").replaceChildren(...days.map((w) => {
    const s = document.createElement("span");
    s.textContent = label(w.day);
    return s;
  }));
  const total = days.reduce((a, w) => a + w.total, 0);
  $("week-total").textContent = days.length ? bytes(total) : "—";
  $("week-average").textContent = days.length ? bytes(total / days.length) : "—";
  const peak = days.reduce((a, w) => (w.total > a.total ? w : a), { total: 0 });
  $("week-peak").textContent = peak.total ? label(peak.day) + " · " + bytes(peak.total) : "—";
}

// paintLog раскладывает строки журнала: время отдельно, текст отдельно.
// Строка приходит как «ЧЧ:ММ:СС  текст» — программа так их и пишет.
function paintLog(lines) {
  const box = $("log");
  const list = lines || [];
  if (list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = L().logEmpty;
    box.replaceChildren(empty);
    return;
  }
  // Перерисовываем только когда число строк изменилось: журнал опрашивается
  // каждую секунду, а прокрутку человек ставит руками.
  if (box.dataset.count === String(list.length)) return;
  box.dataset.count = String(list.length);

  const stuck = box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
  box.replaceChildren(...list.map((line) => {
    const ln = document.createElement("div");
    ln.className = "ln";
    const tm = document.createElement("span");
    tm.className = "tm";
    const tx = document.createElement("span");
    tx.className = "msg";
    const m = /^(\d\d:\d\d:\d\d)\s+(.*)$/s.exec(line);
    tm.textContent = m ? m[1] : "";
    tx.textContent = m ? m[2] : line;
    ln.append(tm, tx);
    return ln;
  }));
  if (stuck) box.scrollTop = box.scrollHeight;
}

// Настройки подключения: состояние берём у программы, а не помним сами —
// под переключателем нужна правда о списке, а она есть только там.
let conn = null;
function paintConn() {
  if (!conn) return;
  const d = L();
  const ru = $("bypass-ru");
  ru.textContent = conn.bypass_russian ? d.toggleOn : d.toggleOff;
  ru.setAttribute("aria-pressed", String(!!conn.bypass_russian));
  // Включённый переключатель без списка ничего не уводит — человек должен
  // это видеть, а не гадать, почему банк всё ещё видит заграницу.
  $("bypass-ru-msg").textContent = !conn.bypass_russian ? ""
    : conn.ru_error ? d.bypassRuFailed(conn.ru_error)
    : conn.ru_count ? d.bypassRuCount(conn.ru_count)
    : d.bypassRuNone;
  const lan = $("lan");
  lan.textContent = conn.lan_outside ? d.toggleOn : d.toggleOff;
  lan.setAttribute("aria-pressed", String(!!conn.lan_outside));

  const rep = $("reports");
  rep.textContent = conn.reports ? d.reportsOn : d.reportsOff;
  rep.setAttribute("aria-pressed", String(!!conn.reports));

  const v6 = $("ipv6");
  v6.textContent = conn.ipv6 ? d.toggleOn : d.toggleOff;
  v6.setAttribute("aria-pressed", String(!!conn.ipv6));
  $("ipv6-msg").textContent = conn.ipv6_in_use !== undefined && conn.ipv6_in_use !== conn.ipv6 ? d.fragmentNext : "";

  const frag = $("fragment");
  frag.textContent = conn.fragment ? d.toggleOn : d.toggleOff;
  frag.setAttribute("aria-pressed", String(!!conn.fragment));
  $("fragment-msg").textContent = conn.fragment_in_use !== undefined && conn.fragment_in_use !== conn.fragment ? d.fragmentNext : "";

  // Свой адрес, которого нет среди четырёх, показываем в поле: иначе
  // человек не увидел бы, что выбрано.
  let known = false;
  for (const b of document.querySelectorAll("#dns-pick [data-dns]")) {
    const mine = b.dataset.dns === conn.dns;
    known = known || mine;
    b.setAttribute("aria-pressed", String(mine));
  }
  const custom = $("dns-custom");
  custom.placeholder = d.dnsCustom;
  if (document.activeElement !== custom) custom.value = known ? "" : conn.dns || "";
  $("dns-save").setAttribute("aria-pressed", String(!known));
  $("dns-msg").textContent = conn.dns_in_use && conn.dns_in_use !== conn.dns ? d.dnsNext : "";

  const sec = $("dns-secure");
  sec.textContent = conn.dns_secure ? d.toggleOn : d.toggleOff;
  sec.setAttribute("aria-pressed", String(!!conn.dns_secure));
  // Свой адрес шифровать нечем — говорим прямо, а не держим включённый
  // переключатель, за которым ничего не происходит.
  $("dns-secure-msg").textContent = conn.dns_secure && !conn.dns_secure_now ? d.dnsSecureOwn
    : conn.dns_secure_in_use !== undefined && conn.dns_secure_in_use !== conn.dns_secure_now ? d.dnsNext
    : "";
}

let keys = [];
function paintKeys() {
  const d = L();
  $("key-name").placeholder = d.keyNameHint;
  const box = $("keys-list");
  box.replaceChildren(...keys.map((k) => {
    const row = document.createElement("div");
    row.className = "key";
    if (k.active) row.setAttribute("data-active", "");
    const grow = document.createElement("div");
    grow.className = "grow";
    const name = document.createElement("b");
    name.textContent = k.name;
    const kind = document.createElement("small");
    kind.textContent = (k.active ? d.keyActive + " · " : "") + (k.foreign ? d.keyForeign : d.keyMarvia);
    grow.append(name, kind);
    row.append(grow);
    if (!k.active) {
      const use = document.createElement("button");
      use.type = "button";
      use.className = "chip";
      use.textContent = d.keyUse;
      use.addEventListener("click", () => keyAction(use, "api/keys/use", k.id));
      row.append(use);
    }
    // Убрать — в два нажатия: ссылки может уже не быть под рукой, и
    // промах мышью не должен стоить ключа.
    const drop = document.createElement("button");
    drop.type = "button";
    drop.className = "chip";
    drop.textContent = d.keyRemove;

        drop.textContent = d.keyRemoveSure;
        setTimeout(() => { drop.dataset.sure = ""; drop.textContent = L().keyRemove; }, 4000);
        return;
      }
      keyAction(drop, "api/keys/remove", k.id);
    });
    row.append(drop);
    return row;
  }));
}

// Поля точной настройки и их значения по умолчанию. Цвета null — «из темы».
const O_DEFAULTS = {
  bg: null, surf: null, fg: null, dim: null, line: null,
  r: null, pad: null, gap: null, glow: null, blur: 0, calpha: 100,
  font: "onest", sfont: "same", nums: "mono", caps: false, statusSize: 32,
  pattern: "grid", pcolor: null, amount: 60, pstep: 0, psize: 100, pspeed: 100,
  logo: "metal",
};
const O_CHOICES = {
  font: ["onest", "manrope", "unbounded", "mono", "system", "serif"],
  sfont: ["same", "onest", "manrope", "unbounded", "mono", "system", "serif"],
  nums: ["mono", "text", "status", "dot"],
  pattern: ["none", "grid", "matrix", "tiles", "stripes", "mesh", "scan"],
  logo: ["metal", "tint"],
};
const O_RANGES = {
  r: [0, 32], pad: [8, 28], gap: [4, 24], glow: [0, 100], blur: [0, 32], calpha: [30, 100],
  statusSize: [20, 46], amount: [0, 100], pstep: [0, 64], psize: [40, 220], pspeed: [0, 300],
};
const O_COLORS = ["bg", "surf", "fg", "dim", "line", "pcolor"];
const FONTS = {
  onest: 'Onest, "Segoe UI", system-ui, sans-serif',
  manrope: 'Manrope, Onest, "Segoe UI", sans-serif',
  unbounded: 'Unbounded, Onest, sans-serif',
  mono: '"JetBrains Mono", ui-monospace, Consolas, monospace',
  system: '"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif',
  serif: 'Spectral, Georgia, "Times New Roman", serif',
};
const VIBE_KEY = "marvia-vibe";
const MOTIONS = ["off", "calm", "lively"];
const isHexColor = (v) => typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v);
const has = (t, k) => Object.prototype.hasOwnProperty.call(t, k);

// normO отбрасывает из своих настроек всё чужое: код темы приходит от
// других людей, а битое поле не должно уронить окно или протащить в CSS
// что-то, кроме цвета и числа.
function normO(raw) {
  const out = {};
  const v = raw && typeof raw === "object" ? raw : {};
  for (const k of Object.keys(O_DEFAULTS)) {
    const x = v[k];
    if (x === undefined || x === null) continue;
    if (O_COLORS.includes(k)) { if (isHexColor(x)) out[k] = x.toLowerCase(); }
    else if (has(O_CHOICES, k)) { if (O_CHOICES[k].includes(x)) out[k] = x; }
    else if (k === "caps") { if (typeof x === "boolean") out[k] = x; }
    else if (has(O_RANGES, k)) {
      const [lo, hi] = O_RANGES[k];
      if (typeof x === "number" && isFinite(x)) out[k] = Math.round(Math.min(hi, Math.max(lo, x)));
    }
  }
  return out;
}

function loadVibe() {
  let v = {};
  try { v = JSON.parse(localStorage.getItem(VIBE_KEY)) || {}; } catch (_) { /* испорченное — с нуля */ }
  return {
    id: has(VIBES, v.id) ? v.id : "graphite",
    motion: MOTIONS.includes(v.motion) ? v.motion : "calm",
    splash: v.splash !== false,
    sound: v.sound === true,
    // Отклик на руку: кнопка тянется за курсором, карточки наклоняются,
    // клик по пустому фону пускает волну. По умолчанию включено — ради этого
    // окно и хочется трогать.
    fx: v.fx !== false,
    clickWave: v.clickWave !== false,
    o: normO(v.o),
  };
}
// var, а не let: вкладку «Тема» страница рисует при запуске раньше, чем
// доходит до этого места, и обращение к let до объявления роняло весь скрипт.
var vibe = loadVibe();
function saveVibe() {
  try { localStorage.setItem(VIBE_KEY, JSON.stringify(vibe)); } catch (_) { /* не запомнится — не беда */ }
}

// eff — действующее значение поля: своё, иначе образа, иначе общее.
function eff(k) {
  if (has(vibe.o, k)) return vibe.o[k];
  const own = VIBES[vibe.id].o;
  return has(own, k) ? own[k] : O_DEFAULTS[k];
}

// Движение выключено системой — значит, выключено и у нас, что бы ни стояло
// в настройке: человеку от него плохо, а не скучно.
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const motion = () => (reducedMotion() ? "off" : vibe.motion);

// Код окна: общий код темы (его понимают панель и телефон) и после «~» —
// образ и все поля точной настройки. Друг вставляет код и получает то же
// окно, а не только те же цвета.
function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unb64url(s) { return decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))); }
function fullCode() { if (!vibe) return Look.encode(look); return Look.encode(look) + "~" + b64url(JSON.stringify({ i: vibe.id, o: vibe.o })); }
function applyCode(code) {
  const st = Look.decode(code);
  if (!st) return false;
  const tail = String(code).trim().split("~")[1];
  if (tail) {
    let extra = null;
    try { extra = JSON.parse(unb64url(tail)); } catch (_) { return false; }
    if (!extra || !has(VIBES, extra.i)) return false;
    vibe.id = extra.i;
    vibe.o = normO(extra.o);
    saveVibe();
  }
  setLook(st);
  applyVibe();
  return true;
}

// ── свои значения поверх темы ──
//
// Тема (look.js) считает цвета и контраст. Точная настройка позволяет
// заменить любой из них руками — тогда ответственность за читаемость на
// человеке, и мы не спорим. Пустые поля темы не трогают.
function rgbOf(hex) {
  const v = hex.replace("#", "");
  return [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16));
}
function alphaOf(hex, a) { return "rgba(" + rgbOf(hex).join(",") + "," + a + ")"; }
function overrideCss(t) {
  const o = vibe.o, out = [];
  const acc = t.acc;
  const surf = o.surf || t.surf;
  if (o.bg) {
    out.push("--bg:" + o.bg, "--shade:" + Look.mix(o.bg, "#000000", 0.45));
    if (!backdropURL) out.push("--bgcss:radial-gradient(130% 100% at top left," + Look.mix(o.bg, "#ffffff", 0.07) + " 0%," + o.bg + " 48%," + Look.mix(o.bg, "#000000", 0.45) + " 100%)");
  }
  if (o.surf) out.push("--surf:" + o.surf, "--surf2:" + Look.mix(o.surf, o.fg || t.fg, 0.08));
  if (o.fg) out.push("--fg:" + o.fg);
  if (o.dim) out.push("--dim:" + o.dim);
  if (o.line) out.push("--line:" + o.line, "--cardLine:" + (t.card === "flat" ? "transparent" : o.line));
  // Карточка: тот же отлив, что у темы, но от своей поверхности и со своей
  // непрозрачностью — полупрозрачная пускает под себя узор и стекло.
  const ca = eff("calpha") / 100;
  if (o.surf || ca < 1) {
    const paint = (c) => (ca < 1 ? alphaOf(c, ca) : c);
    const a = t.card === "flat" ? surf : Look.mix(surf, acc, t.dark ? 0.065 : 0.025);
    out.push("--cardBg:linear-gradient(135deg," + paint(a) + "," + paint(surf) + ")");
    out.push("--featureBg:linear-gradient(135deg," + paint(Look.mix(surf, acc, t.dark ? 0.18 : 0.10)) + "," + paint(surf) + ")");
  }
  // Размеры — свои или образа: у образа свой силуэт, а не только цвет.
  for (const k of ["r", "pad", "gap"]) if (eff(k) != null) out.push("--" + k + ":" + eff(k) + "px");
  if (eff("glow") != null) {
    const g = eff("glow") / 100;
    out.push("--glow:" + (g <= 0 ? "none" : "0 0 " + Math.round(36 * g) + "px " + alphaOf(acc, (0.25 + g * 0.55).toFixed(2))));
  }
  const blur = eff("blur");
  out.push("--glassFilter:" + (blur > 0 ? "blur(" + blur + "px) saturate(1.25)" : "none"));
  const font = FONTS[eff("font")], sfont = eff("sfont") === "same" ? font : FONTS[eff("sfont")];
  const nums = eff("nums");
  out.push("--uiFont:" + font, "--statusFont:" + sfont,
    "--numFont:" + (nums === "text" ? font : nums === "status" ? sfont : FONTS.mono),
    "--statusSize:" + eff("statusSize") + "px",
    "--statusCase:" + (eff("caps") ? "uppercase" : "none"),
    "--statusTrack:" + (eff("caps") ? ".1em" : "-.015em"));

}

// paintOverrides переписывает переменные страницы без похода в окно: ползунок
// шлёт десятки изменений в секунду, а заголовку окна они не нужны.
function paintOverrides() {
  const t = Look.theme(look);
  document.documentElement.style.cssText = Look.vars(t) + (backdropURL ? ";--bgcss:transparent" : "") + overrideCss(t);
}

function applyVibe() {
  document.body.dataset.vibe = vibe.id;
  document.body.dataset.motion = motion();
  document.body.dataset.logo = eff("logo");
  document.body.dataset.caps = String(eff("caps"));
  paintOverrides();
  Field.restyle();
  paintDotNums();
  paintVibeControls();
}

function setO(k, v) {
  if (v === null || v === undefined) delete vibe.o[k];
  else vibe.o[k] = v;
  vibe.o = normO(vibe.o);
  saveVibe();
  applyVibe();
}

function chooseVibe(id) {
  vibe.id = id;
  // Образ — это характер целиком: свои поля точной настройки уходят, иначе
  // остатки прошлого образа смешали бы два характера в один невнятный.
  vibe.o = {};
  saveVibe();
  setLook(Object.assign(Look.normalize({}), VIBES[id].look));
  applyVibe();
  Field.wave(0.9);
}

// ── живой фон ──

// Узор рисуется на холсте под интерфейсом. Отвечает на курсор, расходится
// волной при подключении и дышит, пока туннель работает. Кадров не больше

const Field = (() => {

  let mx = -9999, my = -9999;

  const MOVING = ["tiles", "stripes", "mesh", "scan"];

    const k = eff("amount") / 60;

    if (k <= 0 || pat === "none") {
      // Узора нет, но волна подключения остаётся: без неё кнопка нажимается в тишину.
      for (const w of waves) {
        const age = (now - w.at) / 1000;
        ctx.strokeStyle = rgba(ink, 0.35 * w.s * (1 - age / 1.8));

    else if (pat === "tiles") tiles(now, step(44), k, size, speed, live);
    else if (pat === "stripes") {
      const gap = step(30), off = live ? (time * 14 * speed) % gap : 0;
      ctx.lineWidth = 1.2 * size;
      for (let x0 = -H; x0 < W + H; x0 += gap) {
        const x = x0 + off, mid = x + H / 2;
        const w = waves.length ? waveAt(mid, H / 2, now) : 0;

      }

      // три одинаковых оттенка акцента.
      const second = look.tint ? rgbOf(look.tint) : [64, 200, 255];
      const blobs = [[0.22, 0.28, ink], [0.8, 0.7, second], [0.6, 0.15, [255, 120, 200]]];
      blobs.forEach(([bx, by, c], i) => {

// ── точечные цифры ──
//
// Цифры можно набрать матрицей 5×7, как на табло («Точка», «Бумага» или
// «Цифры: точки» в точной настройке).
// Шрифт свой, из точек, — не чужой фирменный. Единица измерения остаётся
// обычным текстом: «Мбит/с» точками читается хуже, чем выглядит.
const DOT_GLYPHS = {
  "0": ["01110", "10001", "10011", "10101", "11001", "10001", "01110"],
  "1": ["00100", "01100", "00100", "00100", "00100", "00100", "01110"],
  "2": ["01110", "10001", "00001", "00010", "00100", "01000", "11111"],
  "3": ["11110", "00001", "00001", "01110", "00001", "00001", "11110"],
  "4": ["00010", "00110", "01010", "10010", "11111", "00010", "00010"],
  "5": ["11111", "10000", "11110", "00001", "00001", "10001", "01110"],
  "6": ["00110", "01000", "10000", "11110", "10001", "10001", "01110"],
  "7": ["11111", "00001", "00010", "00100", "01000", "01000", "01000"],
  "8": ["01110", "10001", "10001", "01110", "10001", "10001", "01110"],
  "9": ["01110", "10001", "10001", "01111", "00001", "00010", "01100"],
  ",": ["000", "000", "000", "000", "000", "010", "100"],
  ".": ["000", "000", "000", "000", "000", "000", "010"],
  ":": ["0", "0", "1", "0", "1", "0", "0"],
  "-": ["0000", "0000", "0000", "1111", "0000", "0000", "0000"],
  "—": ["00000", "00000", "00000", "11111", "00000", "00000", "00000"],
  " ": ["00", "00", "00", "00", "00", "00", "00"],
};
function dotSvg(text) {
  let x = 0, circles = "";
  for (const ch of text) {
    const g = DOT_GLYPHS[ch];
    if (!g) continue;
    g.forEach((row, y) => {
      for (let i = 0; i < row.length; i++) {
        if (row[i] === "1") circles += '<circle cx="' + (x + i + 0.5) + '" cy="' + (y + 0.5) + '" r=".42"/>';
      }
    });
    x += g[0].length + 1;
  }
  return '<svg class="dotnum" viewBox="0 0 ' + Math.max(1, x - 1) + ' 7" aria-hidden="true">' + circles + "</svg>";
}
const DOT_TARGETS = ["s-down", "s-up", "k-session", "k-ping", "today-total"];
function paintDotNums() {
  const on = eff("nums") === "dot";
  for (const id of DOT_TARGETS) {
    const el = $(id);
    if (!el) continue;
    const text = el.dataset.raw !== undefined && el.querySelector("svg.dotnum") ? el.dataset.raw : el.textContent;
    if (!on) {
      if (el.querySelector("svg.dotnum")) el.textContent = text;
      delete el.dataset.raw;
      el.removeAttribute("aria-label");
      continue;
    }
    const m = text.match(/^([0-9.,:\s—-]+)(.*)$/);
    if (!m) continue;
    el.dataset.raw = text;
    el.setAttribute("aria-label", text);
    el.innerHTML = dotSvg(m[1].trim()) + (m[2] ? '<span class="dotunit">' + m[2].replace(/[<>&]/g, "") + "</span>" : "");
  }
}

// ── звук ──
//
// Два коротких тона из самого браузера, без файлов: вверх — туннель поднялся,
// вниз — опустился. По умолчанию выключено: окно, которое щёлкает без
// спроса, раздражает в первый же вечер.
let audio = null;
function chirp(up) {
  if (!vibe.sound) return;
  try {
    audio = audio || new AudioContext();
    const now = audio.currentTime;
    (up ? [660, 990] : [880, 523]).forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + i * 0.09);
      g.gain.linearRampToValueAtTime(0.06, now + i * 0.09 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.16);
      o.connect(g).connect(audio.destination);
      o.start(now + i * 0.09); o.stop(now + i * 0.09 + 0.18);
    });
  } catch (_) { /* без звука — значит без звука */ }
}

// Переходы состояния — повод для волны и щелчка. Первый опрос после запуска
// переходом не считается: окно открылось, а не подключилось.
let vibePrev = null, connectingPulse = 0;
function vibeState(state) {
  const prev = vibePrev;
  vibePrev = state;
  if (prev === null || prev === state) return;
  clearInterval(connectingPulse);
  if (state === "connecting") connectingPulse = setInterval(() => Field.wave(0.25), 1200);
  if (state === "connected") { Field.wave(1); chirp(true); }
  if ((state === "idle" || state === "failed") && (prev === "connected" || prev === "stalled")) { Field.wave(0.5); chirp(false); }
}


// ── вкладка «Тема»: лента образов ──
//
// Образов больше, чем помещается в ширину, поэтому они идут лентой в два
// ряда и листаются слева направо: стрелками, колесом мыши или перетаскиванием
// полосы прокрутки.
// fitLabel ужимает надпись миниатюры, пока она не влезет: широкий гротеск
// заглавными на другом языке иначе обрезался бы троеточием. Пока вкладка
// скрыта, ширины нет — подгонка случится при открытии.
function fitLabel(el) {
  if (!el || !el.clientWidth) return;
  el.style.fontSize = "";
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 1 && size > 6) { size -= 0.5; el.style.fontSize = size + "px"; }
}

function buildVibes() {
  const box = $("vibes");
  if (box.children.length) return;
  // Карточка — как обои в выборе темы на телефоне: фон образа во всю
  // карточку, его кнопка, надпись его шрифтом и маленькая карточка с
  // настоящей цифрой. Серые полоски «вместо интерфейса» выглядели заготовкой.
  for (const id of Object.keys(VIBES)) {
    const v = VIBES[id], p = v.preview;
    const t = Look.theme(Object.assign(Look.normalize({}), v.look));
    const font = FONTS[v.o.font || "onest"], sfont = !v.o.sfont || v.o.sfont === "same" ? font : FONTS[v.o.sfont];
    const nums = v.o.nums === "text" ? font : v.o.nums === "status" ? sfont : FONTS.mono;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "vibe";
    b.dataset.vibe = id;
    const num = v.o.nums === "dot" ? dotSvg("48,0") : "48,0";
    b.innerHTML = '<span class="vibe-art"><span class="mv-btn"><i></i></span><b class="mini-status"></b>'
      + '<span class="mv-card"><small>↓</small><span class="mv-num">' + num + '</span>'
      + '<svg viewBox="0 0 60 18" preserveAspectRatio="none" aria-hidden="true"><path d="M0 16 L7 14 L13 15 L20 10 L27 12 L34 7 L41 9 L48 4 L54 5 L60 2"/></svg></span></span>'
      + '<span class="vibe-name"></span><span class="vibe-line"></span>';
    const art = b.firstElementChild;
    art.dataset.btn = v.look.btn || "ring";
    art.style.background = p.pat + "," + p.bg;
    const r = Math.round((v.o.r != null ? v.o.r : t.r) * 0.5);
    art.style.cssText += ";--vfg:" + t.fg + ";--vdim:" + t.dim + ";--vacc:" + t.acc + ";--vaccFg:" + t.accFg
      + ";--vsurf:" + t.surf + ";--vline:" + t.cardLine + ";--vr:" + r + "px;--vfont:" + sfont + ";--vnum:" + nums
      + ";--vcase:" + (v.o.caps ? "uppercase" : "none") + ";--vtrack:" + (v.o.caps ? ".04em" : "-.01em");
    b.addEventListener("click", () => chooseVibe(id));
    box.append(b);
  }
  // Ленту листают рукой: зажал и тянешь, отпустил — она докатывается по
  // инерции. Стрелки заставляли целиться в маленькую кнопку ради каждого
  // шага; перетаскивание — привычный жест для того, что «едет вбок».
  let down = null, moved = false, glide = 0;
  box.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    cancelAnimationFrame(glide);
    down = { x: e.clientX, left: box.scrollLeft, t: performance.now(), v: 0, lastX: e.clientX };
    moved = false;
  });
  addEventListener("pointermove", (e) => {
    if (!down) return;
    const dx = e.clientX - down.x;
    if (!moved && Math.abs(dx) < 5) return;
    if (!moved) { moved = true; box.classList.add("dragging"); box.setPointerCapture?.(e.pointerId); }
    const now = performance.now();
    down.v = (e.clientX - down.lastX) / Math.max(1, now - down.t);
    down.lastX = e.clientX; down.t = now;
    box.scrollLeft = down.left - dx;
  });
  addEventListener("pointerup", () => {
    if (!down) return;
    let v = -down.v * 16;
    down = null;
    box.classList.remove("dragging");
    if (!moved) return;
    rememberSwiped();
    // Докат: скорость тает на восьмую часть за кадр — как у прокрутки на тачпаде.
    const step = () => {
      if (Math.abs(v) < 0.5) return;
      box.scrollLeft += v; v *= 0.92;
      glide = requestAnimationFrame(step);
    };
    glide = requestAnimationFrame(step);
  });
  // Перетаскивание не должно заодно выбрать образ, на котором отпустили.
  box.addEventListener("click", (e) => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
  // Колесо листает ленту вбок: вертикальной прокрутки у неё нет.
  box.addEventListener("wheel", (e) => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    box.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });

  // Края растворяются там, где лента продолжается, а полоска снизу показывает,
  // где мы сейчас: так видно, что листать можно и туда, и обратно.
  const bar = $("vibes-bar"), thumb = bar.firstElementChild;
  const edges = () => {
    const max = box.scrollWidth - box.clientWidth;
    box.classList.toggle("more-left", box.scrollLeft > 2);
    box.classList.toggle("more-right", box.scrollLeft < max - 2);
    bar.hidden = max <= 2;
    thumb.style.width = (100 * box.clientWidth / box.scrollWidth) + "%";
    thumb.style.transform = "translateX(" + (max > 0 ? (box.scrollLeft / max) * (bar.clientWidth - thumb.offsetWidth) : 0) + "px)";
  };
  box.addEventListener("scroll", edges, { passive: true });
  addEventListener("resize", edges);
  // Полоска тоже ведёт: нажатие переносит ленту в это место.
  bar.addEventListener("pointerdown", (e) => {
    const r = bar.getBoundingClientRect();
    box.scrollTo({ left: ((e.clientX - r.left) / r.width) * (box.scrollWidth - box.clientWidth), behavior: "smooth" });
  });
  requestAnimationFrame(edges);
}

// Подсказка жестом: пока человек ни разу не листал ленту, при открытии
// вкладки она чуть съезжает вбок и возвращается — видно, что она живая.
const SWIPED_KEY = "marvia-vibes-swiped";
function rememberSwiped() { try { localStorage.setItem(SWIPED_KEY, "1"); } catch (_) { /* не запомнится */ } }
function hintSwipe() {
  let seen = false;
  try { seen = localStorage.getItem(SWIPED_KEY) === "1"; } catch (_) { /* покажем ещё раз */ }
  const box = $("vibes");
  if (seen || motion() === "off" || box.scrollWidth <= box.clientWidth + 2 || box.scrollLeft > 2) return;
  box.scrollTo({ left: 90, behavior: "smooth" });
  setTimeout(() => box.scrollTo({ left: 0, behavior: "smooth" }), 650);
}
// Края и полоска считаются от ширины ленты, а пока вкладка скрыта, ширина
// нулевая: пересчитываем при каждом открытии.
document.querySelector('.tab[data-tab="theme"]').addEventListener("click", () => {
  requestAnimationFrame(() => { $("vibes").dispatchEvent(new Event("scroll")); for (const s of document.querySelectorAll(".vibe .mini-status")) fitLabel(s); });
  // Шрифт образа мог ещё грузиться — подгоняем и после него, иначе мерили запасной.
  document.fonts.ready.then(() => { for (const s of document.querySelectorAll(".vibe .mini-status")) fitLabel(s); });
  setTimeout(hintSwipe, 450);
});

// ── точная настройка ──
//
// Каждое поле образа — своей ручкой: цвета пипеткой, размеры в пикселях,
// узор до скорости и шага. Ручки строятся один раз, дальше только сверяются
// с состоянием: перестроенный ползунок вырвался бы из руки посреди движения.
const FINE = {
  "fine-colors": [["bg", "color"], ["surf", "color"], ["fg", "color"], ["dim", "color"], ["line", "color"]],
  "fine-pattern": [["pattern", "pills"], ["amount", "range", "%"], ["pstep", "range", "px"], ["psize", "range", "%"], ["pspeed", "range", "%"], ["pcolor", "color"]],
  "fine-shape": [["r", "range", "px"], ["pad", "range", "px"], ["gap", "range", "px"], ["glow", "range", "%"], ["blur", "range", "px"], ["calpha", "range", "%"]],
  "fine-type": [["font", "pills"], ["sfont", "pills"], ["nums", "pills"], ["statusSize", "range", "px"], ["caps", "bool"], ["logo", "pills"]],
};
const fineInputs = {};

// themeValue — что сейчас стоит в поле, если человек его не трогал: цвет
// или размер темы. Ползунок и пипетка показывают правду, а не ноль.
function themeValue(k) {
  const t = Look.theme(look);
  if (has(VIBES[vibe.id].o, k)) return VIBES[vibe.id].o[k];
  switch (k) {
    case "bg": return t.bg;
    case "surf": return t.surf;
    case "fg": return t.fg;
    case "dim": return t.dim;
    case "line": return t.line;
    case "pcolor": return t.acc;
    case "r": return t.r;
    case "pad": return t.pad;
    case "gap": return t.gap;
    case "glow": return Math.round(t.glowA * 100);
  }
  return eff(k);
}

function buildFine() {
  if (Object.keys(fineInputs).length) return;
  for (const [box, rows] of Object.entries(FINE)) {
    const host = $(box);
    for (const [k, type, unit] of rows) {
      const row = el("div", "fine-item");
      row.dataset.k = k;
      const head = el("div", "fine-head");
      const name = el("span", "fine-name");
      const val = el("span", "fine-val");
      const reset = el("button", "fine-reset", "↺");
      reset.type = "button";
      reset.addEventListener("click", () => setO(k, null));
      head.append(name, val, reset);
      row.append(head);
      const ctl = { row, name, val, reset, type, unit };
      if (type === "color") {
        const input = document.createElement("input");
        input.type = "color";
        input.addEventListener("input", () => setO(k, input.value));
        ctl.input = input;
        row.append(input);
      } else if (type === "range") {
        const input = document.createElement("input");
        input.type = "range";
        input.className = "range";
        [input.min, input.max] = O_RANGES[k];
        input.addEventListener("input", () => setO(k, Number(input.value)));
        ctl.input = input;
        row.append(input);
      } else {
        const pills = el("div", "pills");
        const opts = type === "bool" ? [false, true] : O_CHOICES[k];
        ctl.buttons = opts.map((v) => {
          const b = el("button", "pillb");
          b.type = "button";
          b.dataset.v = String(v);
          b.addEventListener("click", () => setO(k, v));
          pills.append(b);
          return b;
        });
        row.append(pills);
      }
      fineInputs[k] = ctl;
      host.append(row);
    }
  }
}

function syncFine() {
  const d = L();
  for (const [k, c] of Object.entries(fineInputs)) {
    const own = has(vibe.o, k);
    c.name.textContent = d.fine[k];
    c.reset.hidden = !own;
    c.reset.title = d.fine.reset;
    c.row.classList.toggle("own", own);
    if (c.type === "color") {
      const v = own ? vibe.o[k] : themeValue(k);
      if (document.activeElement !== c.input) c.input.value = v;
      c.val.textContent = own ? v.toUpperCase() : d.fine.auto;
    } else if (c.type === "range") {
      const v = own ? vibe.o[k] : themeValue(k);
      if (document.activeElement !== c.input) c.input.value = v;
      c.val.textContent = k === "pstep" && !v ? d.fine.byVibe : v + " " + (c.unit === "%" ? "%" : d.fine.px);
    } else {
      const cur = String(eff(k));
      for (const b of c.buttons) {
        b.textContent = c.type === "bool" ? (b.dataset.v === "true" ? d.fine.yes : d.fine.no) : d.fine.opts[k][b.dataset.v];
        b.setAttribute("aria-pressed", String(b.dataset.v === cur));
      }
      c.val.textContent = "";
    }
  }
}

function paintVibeControls() {
  const d = L();
  buildVibes();
  for (const b of $("vibes").children) {
    b.setAttribute("aria-pressed", String(b.dataset.vibe === vibe.id));
    b.querySelector(".vibe-name").textContent = d.vibes[b.dataset.vibe][0];
    b.querySelector(".vibe-line").textContent = d.vibes[b.dataset.vibe][1];
    b.querySelector(".mini-status").textContent = d.state.connected;
    fitLabel(b.querySelector(".mini-status"));
  }
  const page = document.querySelector('.page[data-tab="theme"]');
  $("fine-toggle").textContent = page.classList.contains("fine-open") ? d.fineHide : d.fineShow;
  buildFine();
  syncFine();

  const toggle = (id, on) => { $(id).setAttribute("aria-pressed", String(on)); $(id).textContent = on ? d.toggleOn : d.toggleOff; };
  toggle("vibe-splash", vibe.splash);
  toggle("vibe-sound", vibe.sound);
  toggle("vibe-fx", vibe.fx);
  toggle("vibe-click", vibe.clickWave);
  for (const b of $("vibe-motion").querySelectorAll("[data-motion]")) {
    b.setAttribute("aria-pressed", String(b.dataset.motion === vibe.motion));
    b.textContent = d.motions[b.dataset.motion];
  }
  $("vibe-motion-note").textContent = reducedMotion() ? d.motionSystem : "";
}

$("fine-toggle").addEventListener("click", () => {
  const page = document.querySelector('.page[data-tab="theme"]');
  page.classList.toggle("fine-open");
  paintVibeControls();
  if (page.classList.contains("fine-open")) $("fine-anchor").scrollIntoView({ behavior: "smooth", block: "start" });
});
$("fine-reset-all").addEventListener("click", () => { vibe.o = {}; saveVibe(); setLook(Object.assign(Look.normalize({}), VIBES[vibe.id].look)); applyVibe(); });
const flip = (key) => () => { vibe[key] = !vibe[key]; saveVibe(); paintVibeControls(); };
$("vibe-splash").addEventListener("click", flip("splash"));
$("vibe-sound").addEventListener("click", () => { flip("sound")(); if (vibe.sound) chirp(true); });
$("vibe-fx").addEventListener("click", () => { flip("fx")(); if (!vibe.fx) resetTilt(); });
$("vibe-click").addEventListener("click", flip("clickWave"));
for (const b of $("vibe-motion").querySelectorAll("[data-motion]")) {
  b.addEventListener("click", () => { vibe.motion = b.dataset.motion; saveVibe(); applyVibe(); Field.wave(0.6); });
}

// ── отклик на руку ──
//
// Кнопка питания чуть тянется за курсором и наклоняется к нему, карточки
// поворачиваются в объёме, клик по пустому фону пускает волну. Всё — через
// transform, без перерисовки страницы, и всё выключается одной строкой в
// настройках или системным «уменьшением движения».
const fxOn = () => vibe.fx && motion() !== "off";
const ring = document.querySelector(".hero .ring");
function resetTilt() {
  if (ring) ring.style.transform = "";
  for (const c of document.querySelectorAll(".tilt")) { c.style.transform = ""; c.classList.remove("tilt"); }
}
if (ring) {
  const zone = ring.closest(".hero");
  zone.addEventListener("pointermove", (e) => {
    if (!fxOn()) return;
    const r = ring.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) / r.width, dy = (e.clientY - (r.top + r.height / 2)) / r.height;
    const pull = Math.max(0, 1 - Math.hypot(dx, dy) / 1.6);
    ring.style.transform = "translate(" + (dx * 14 * pull).toFixed(1) + "px," + (dy * 14 * pull).toFixed(1) + "px) "
      + "rotateX(" + (-dy * 10 * pull).toFixed(1) + "deg) rotateY(" + (dx * 10 * pull).toFixed(1) + "deg)";
  });
  zone.addEventListener("pointerleave", () => { ring.style.transform = ""; });
}
document.addEventListener("pointermove", (e) => {
  if (!fxOn()) return;
  const card = e.target.closest && e.target.closest(".page .card, .page .kpi, .vibe");
  for (const c of document.querySelectorAll(".tilt")) if (c !== card) { c.style.transform = ""; c.classList.remove("tilt"); }
  if (!card || card.closest(".fine-grid")) return;
  const r = card.getBoundingClientRect();
  const dx = (e.clientX - r.left) / r.width - 0.5, dy = (e.clientY - r.top) / r.height - 0.5;
  card.classList.add("tilt");
  card.style.transform = "perspective(900px) rotateX(" + (-dy * 4).toFixed(2) + "deg) rotateY(" + (dx * 5).toFixed(2) + "deg) translateY(-2px)";
});
document.addEventListener("pointerdown", (e) => {
  if (!vibe.clickWave || e.button !== 0) return;
  // Волна — только от пустого фона: клик по кнопке или полю — это дело, а не игра.
  if (e.target.closest("button, a, input, textarea, select, label, .card, .kpi, .node, .seller, .leak, aside, header")) return;
  Field.waveFrom(e.clientX, e.clientY, 0.7);
});

// Кнопка питания при нажатии расходится кольцом от точки касания.
$("power").addEventListener("pointerdown", (e) => {
  if (!fxOn()) return;
  const r = $("power").getBoundingClientRect();
  const dot = el("i", "press-ring");
  dot.style.left = e.clientX - r.left + "px";
  dot.style.top = e.clientY - r.top + "px";
  $("power").append(dot);
  setTimeout(() => dot.remove(), 700);
});

// ── заставка ──
//
// Знак собирается из точек, слово проявляется, интерфейс поднимается
// каскадом. Полторы секунды — столько окно WebView и так открывается; дольше
// — уже ожидание. Клик пропускает.
const Splash = (() => {
  const el = $("splash");
  function finish() {
    if (el.hidden || el.classList.contains("gone")) return;
    el.classList.add("gone");
    document.body.classList.add("arrive");
    setTimeout(() => { el.hidden = true; document.body.classList.remove("arrive"); Field.wave(0.7); }, 520);
  }
  function play() {
    if (!vibe.splash || reducedMotion()) { el.hidden = true; return; }
    el.hidden = false;
    const cv = $("splash-dots"), c = cv.getContext("2d");
    const dpr = Math.min(2, devicePixelRatio || 1);
    const W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const col = getComputedStyle(document.documentElement).getPropertyValue("--accRgb").trim() || "195,204,214";
    const start = performance.now();
    (function frame(now) {
      if (el.classList.contains("gone")) return;
      const t = (now - start) / 1000, R = t * 900;
      c.clearRect(0, 0, W, H);
      const step = 18;
      for (let y = (H % step) / 2; y < H; y += step) {
        for (let x = (W % step) / 2; x < W; x += step) {
          const d = Math.hypot(x - W / 2, y - H / 2);
          if (d > R) continue;
          const edge = Math.max(0, 1 - Math.abs(d - R) / 140);
          c.fillStyle = "rgba(" + col + "," + (0.08 + edge * 0.55) + ")";
          c.beginPath(); c.arc(x, y, 1 + edge * 1.4, 0, Math.PI * 2); c.fill();
        }
      }
      if (t < 1.6) requestAnimationFrame(frame);
    })(start);
    el.addEventListener("click", finish, { once: true });
    setTimeout(finish, 1500);
  }
  return { play };
})();


// Общая тема и точная настройка меняют переменные — фон и цифры узнают сразу.
window.onLookApplied = () => { paintOverrides(); Field.restyle(); paintDotNums(); };
applyVibe();
paintTheme();
Splash.play();

// ── настройки: разделы ──
//
// Слева список разделов, справа открыт один. Выбор запоминается: кто зашёл
// поменять DNS, в следующий раз попадёт туда же, а не в ключ доступа.
const SEC_KEY = "marvia-settings-sec";
function openSec(sec) {
  const groups = document.querySelectorAll(".set-panes .group[data-sec]");
  if (![...groups].some((g) => g.dataset.sec === sec)) sec = "key";
  for (const g of groups) g.classList.toggle("on", g.dataset.sec === sec);
  let current = null;
  for (const b of document.querySelectorAll("#set-nav button[data-sec]")) {
    const on = b.dataset.sec === sec;
    b.setAttribute("aria-current", String(on));
    if (on) current = b;
  }
  // Подложка выбранного раздела переезжает пружиной, а не возникает на месте.
  const pill = $("set-pill");
  if (current && pill) {
    pill.style.height = current.offsetHeight + "px";
    pill.style.transform = "translateY(" + current.offsetTop + "px)";
  }
  $("set-panes").scrollTop = 0;
  try { localStorage.setItem("marvia-settings-sec", sec); } catch (_) { /* не запомнится */ }
}
for (const b of document.querySelectorAll("#set-nav button[data-sec]")) b.addEventListener("click", () => openSec(b.dataset.sec));
{
  let saved = null;
  try { saved = localStorage.getItem(SEC_KEY); } catch (_) { /* с начала */ }
  if (!document.querySelector(".set-panes .group.on")) openSec(saved || "key");
}
// Подложку надо переставить, когда вкладка впервые становится видимой:
// пока она скрыта, у кнопок нет размеров.
document.querySelector('.tab[data-tab="settings"]').addEventListener("click", () => {
  requestAnimationFrame(() => {
    const on = document.querySelector("#set-nav button[aria-current='true']");
    if (on) openSec(on.dataset.sec);
  });
});

// Переключатели вместо кнопок «Включено / Выключено»: состояние видно
// формой, а не надписью. Надпись остаётся внутри — для экранного диктора.
// Нажатие на саму строку тоже переключает: в узкую кнопку не надо целиться.
const SWITCHES = ["vibe-splash", "vibe-sound", "vibe-fx", "vibe-click", "bypass-ru", "lan", "ipv6", "fragment", "reports", "dns-secure", "autostart"];
for (const id of SWITCHES) {
  const b = $(id);
  if (!b) continue;
  b.classList.add("switch");
  const row = b.parentElement;
  row.classList.add("has-switch");
  const label = row.querySelector(".grow");
  if (label) label.addEventListener("click", (e) => { if (!e.target.closest("a, button, input")) b.click(); });
}

window.vibeState = vibeState;
window.paintDotNums = paintDotNums;
</script>
