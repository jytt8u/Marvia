<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvia</title>
<style>
  /* Шрифты свои, вшитые в программу, — те же, что у панели. Системный
     Segoe UI не совпал бы с макетом ни в одной строке, а тянуть шрифт из
     сети окно не вправе: оно и так знает о человеке больше, чем нужно. */
  @font-face { font-family: Onest; src: url(fonts/onest-latin.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Onest; src: url(fonts/onest-cyrillic.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Unbounded; src: url(fonts/unbounded-latin.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Unbounded; src: url(fonts/unbounded-cyrillic.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Manrope; src: url(fonts/manrope-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Manrope; src: url(fonts/manrope-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  /*
    Цвета не написаны здесь ни разу: все они — переменные, которые ставит
    тема (Look.vars) на корневой элемент. Запасные значения ниже — вид «Серый»
    из коробки, чтобы страница не мигнула чёрным до первого скрипта.
  */
  :root {
    --bg: #0c0e11; --lit: #43474c; --mid: #24272a; --shade: #050608;
    --surf: #313437; --surf2: #404346; --line: #4b4e50;
    --fg: #f1f4f7; --dim: #b3b6b9; --acc: #c3ccd6; --accFg: #08110d;
    --accSoft: rgba(195,204,214,0.14); --accRgb: 195,204,214;
    --warn: #f2a03d; --fail: #ff6b7a;
    --bgcss: linear-gradient(135deg, #43474c 0%, #24272a 52%, #050608 100%);
    --cardLine: var(--line); --cardShadow: none; --glow: none; --glowA: 0.2;
    --r: 14px; --pad: 16px; --gap: 12px;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --display: Unbounded, Onest, system-ui, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }

  * { box-sizing: border-box; }

  /* Атрибут hidden обязан побеждать любой display: иначе «скрытое» поле
     ключа торчит на главном экране у того, у кого ключ давно есть. */
  [hidden] { display: none !important; }

  html, body {
    height: 100%; margin: 0;
    background: var(--bgcss, var(--bg)); color: var(--fg);
    font: 14px/1.5 Onest, "Segoe UI", system-ui, sans-serif;
    user-select: none; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: color .35s;
  }
  /* Едва заметная точечная сетка из цвета текста — фон перестаёт быть
     пустым, но не спорит с контентом. Та же, что на телефоне. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(rgba(var(--accRgb), 0.06) 1px, transparent 1.5px) 0 0 / 22px 22px;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

  /* ------------------------------------------------------------- шапка */

  .top {
    height: 44px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; border-bottom: 1px solid var(--line);
    background: rgba(var(--accRgb), 0.04);
  }
  .brand { display: flex; align-items: center; gap: 10px; }

  /*
    Знак — объёмная лента-«M», и красится она темой, оставаясь металлом. Два
    слоя: нижний — сам знак, обесцвеченный в нейтральный металл; верхний —
    заливка акцентом со смешением mix-blend-mode: color, которое берёт из
    акцента тон, а свет и тень — у металла снизу. Тот же приём в панели.
  */
  :root { --mark-img: url("assets/marvia-mark.png"); --word-img: url("assets/marvia-word.svg"); }
  .logo { position: relative; display: inline-block; flex: none; width: 24px; height: 24px; isolation: isolate;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
  .logo::before, .logo::after { content: ""; position: absolute; inset: 0; }
  .logo::before {
    background: var(--mark-img) center / contain no-repeat;
    filter: grayscale(1) contrast(1.03) brightness(1.02);
  }
  .logo::after {
    background: var(--acc, transparent);
    mix-blend-mode: color;
    -webkit-mask: var(--mark-img) center / contain no-repeat;
            mask: var(--mark-img) center / contain no-repeat;
  }
  .wordmark {
    display: block; height: 12px; aspect-ratio: 610 / 136; font-size: 0;
    background: var(--fg);
    -webkit-mask: var(--word-img) center / contain no-repeat;
            mask: var(--word-img) center / contain no-repeat;
  }
  .ver { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .top button.lang {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; cursor: pointer;
    transition: color .3s, border-color .3s;
  }
  .top button.lang:hover { color: var(--fg); border-color: var(--acc); }

  .body { flex: 1; display: flex; min-height: 0; }

  /* ------------------------------------------------------------ боковая */

  aside {
    width: 212px; flex: 0 0 212px;
    background: rgba(var(--accRgb), 0.04); border-right: 1px solid var(--line);
    padding: 14px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .tab {
    display: flex; align-items: center; gap: 10px;
    min-height: 40px; padding: 0 10px; border-radius: min(var(--r), 12px);
    color: var(--dim); cursor: pointer; border: none; background: none; width: 100%;
    font: inherit; font-size: 14px; font-weight: 500; text-align: left;
    transition: background .35s var(--ease), color .35s;
  }
  .tab svg { width: 18px; height: 18px; flex: none; color: var(--dim); transition: color .35s; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--accSoft); color: var(--fg); font-weight: 700; }
  .tab[aria-selected="true"] svg { color: var(--acc); }
  .tab .news { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: auto; }
  .tab.news .news { display: block; }
  .spacer { flex: 1; }

  .sub-card {
    padding: 12px; border-radius: var(--r);
    background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow);
    display: flex; flex-direction: column; gap: 8px;
  }
  .sub-card .t { font-size: 13px; font-weight: 600; color: var(--fg); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sub-card .t::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  body[data-state="connected"] .sub-card .t::after { background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  .sub-card .s { font-family: var(--mono); font-size: 10px; color: var(--dim); line-height: 1.5; }
  .about-link {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
    border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; text-align: left;
    transition: color .3s;
  }
  .about-link:hover { color: var(--fg); }
  .about-link .logo { width: 16px; height: 16px; opacity: .85; filter: none; }

  /* ---------------------------------------------------------- основное */

  main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 22px 26px; overflow: hidden; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex: none; }
  .head .title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: var(--fg); }
  .head .sub { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .page { display: none; flex: 1; min-height: 0; flex-direction: column; gap: var(--gap); animation: rise .5s var(--ease) both; }
  .page[data-open] { display: flex; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .scroll { overflow: auto; min-height: 0; }

  .card {
    padding: var(--pad); border-radius: var(--r);
    background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow);
    display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card b { font-size: 14px; font-weight: 600; color: var(--fg); }
  .k { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .hint { font-size: 12px; line-height: 1.5; color: var(--dim); }
  .hint.bad, .bad { color: var(--fail); }
  .lead { margin: 0; font-size: 13px; line-height: 1.55; color: var(--dim); }
  .mono { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .split { display: flex; gap: var(--gap); flex: 1; min-height: 0; }
  .split > .wide { flex: 1; min-width: 0; }
  .col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }

  .chip, .pillb {
    min-height: 36px; padding: 0 12px; border-radius: min(var(--r), 12px); cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600;
    background: var(--surf); border: 1px solid var(--line); color: var(--fg);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .35s var(--ease), border-color .35s, color .35s, transform .3s var(--ease);
  }
  .chip:hover, .pillb:hover { border-color: var(--acc); }
  .chip:active, .pillb:active { transform: scale(.97); }
  .chip[aria-pressed="true"], .pillb[aria-pressed="true"] { background: var(--accSoft); border-color: var(--acc); color: var(--fg); }
  .chip[disabled] { opacity: .5; cursor: default; }
  .primary {
    min-height: 40px; padding: 0 16px; border-radius: min(var(--r), 12px); border: 0; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 700; background: var(--acc); color: var(--accFg);
    box-shadow: var(--glow); transition: transform .3s var(--ease), box-shadow .4s;
  }
  .primary:active { transform: scale(.97); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  textarea, input.code-in {
    width: 100%; padding: 10px 12px; border-radius: min(var(--r), 12px); resize: none;
    background: var(--shade); border: 1px solid var(--line); color: var(--fg);
    font-family: var(--mono); font-size: 12px; outline: none; user-select: text;
  }
  textarea:focus, input.code-in:focus { border-color: var(--acc); }
  .warn {
    padding: 10px 14px; border-radius: min(var(--r), 12px);
    background: rgba(242,160,61,.12); border: 1px solid rgba(242,160,61,.5); color: var(--warn); font-size: 13px;
  }
  .badge { padding: 4px 10px; border-radius: 999px; background: var(--surf2); color: var(--dim); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.on { background: var(--accSoft); color: var(--acc); }
  .track { height: 5px; border-radius: 999px; background: var(--shade); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 999px; background: var(--acc); transition: width .6s var(--ease); }

  /* ----------------------------------------------------------- главная */

  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-width: 0; }
  .ring { position: relative; width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; flex: none; }
  /* Дуга вокруг кнопки: разрыв внизу справа, градиент от акцента к прозрачному.
     Пока подключаемся — короткая и крутится; выключено — гаснет в линию. */
  .ring > svg { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; transform: rotate(90deg); overflow: visible; }
  .ring circle { fill: none; stroke: url(#arcGrad); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 653 0; transition: stroke-dasharray .7s var(--ease); }
  .ring .arc-a { stop-color: var(--line); }
  .ring .arc-b { stop-color: var(--line); stop-opacity: .3; }
  body[data-state="connected"] .ring circle, body[data-state="stalled"] .ring circle { stroke-dasharray: 490 163; }
  body[data-state="connected"] .ring .arc-a { stop-color: var(--acc); }
  body[data-state="connected"] .ring .arc-b { stop-color: var(--acc); stop-opacity: .12; }
  body[data-state="stalled"] .ring .arc-a { stop-color: var(--warn); }
  body[data-state="connecting"] .ring circle { stroke-dasharray: 160 493; }
  body[data-state="connecting"] .ring .arc-a { stop-color: var(--dim); }
  body[data-state="connecting"] .ring > svg { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(450deg); } }

  .power {
    position: relative; z-index: 1;
    width: 200px; height: 200px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 38% 30%, var(--surf2) 0%, var(--surf) 55%, var(--shade) 100%);
    box-shadow: inset 0 0 0 1px var(--line), 0 24px 48px rgba(0,0,0,.45);
    transition: box-shadow .6s var(--ease), background .6s, transform .3s var(--ease);
  }
  .power:active { transform: scale(.97); }
  .power[disabled] { cursor: default; opacity: .6; }
  .power svg { width: 64px; height: 64px; color: var(--dim); transition: color .4s; }
  /* Подключено: диск объёмный, подсвечен акцентом изнутри и вокруг; вариант — из темы. */
  .power[data-state="connected"], .power[data-state="stalled"] {
    box-shadow: inset 0 0 0 1px rgba(var(--accRgb), .22), inset 0 -20px 40px rgba(var(--accRgb), .10), var(--glow), 0 24px 48px rgba(0,0,0,.5);
  }
  .power[data-state="connected"] svg { color: var(--acc); }
  .power[data-state="stalled"] svg { color: var(--warn); }
  .power[data-state="connecting"] svg { color: var(--dim); }
  .power[data-state="connected"][data-btn="solid"] {
    background: radial-gradient(circle at 38% 30%, rgba(255,255,255,.28), var(--acc) 60%);
    box-shadow: inset 0 -14px 30px rgba(0,0,0,.18), var(--glow), 0 24px 48px rgba(0,0,0,.5);
  }
  .power[data-state="connected"][data-btn="solid"] svg { color: var(--accFg); }
  .power[data-state="connected"][data-btn="glass"] {
    background: rgba(var(--accRgb), .16);
    box-shadow: inset 0 0 0 1px rgba(var(--accRgb), .45), inset 0 -20px 40px rgba(var(--accRgb), .12), var(--glow), 0 24px 48px rgba(0,0,0,.5);
  }
  .power[data-state="connected"][data-btn="bare"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--acc), 0 24px 48px rgba(0,0,0,.5); }

  .status { font-size: 28px; font-weight: 700; letter-spacing: -.01em; color: var(--dim); transition: color .4s; text-align: center; }
  body[data-state="connected"] .status { color: var(--acc); }
  body[data-state="stalled"] .status, body[data-state="failed"] .status { color: var(--warn); }
  .detail { font-family: var(--mono); font-size: 13px; letter-spacing: .04em; color: var(--dim); text-align: center; max-width: 420px; }
  .detail.bad { color: var(--fail); }
  .quick { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .quick .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .3s, box-shadow .3s; }
  .quick .chip[aria-pressed="true"] .dot { background: var(--acc); box-shadow: 0 0 8px rgba(var(--accRgb), .7); }
  .first-key { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; }

  .node {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r);
    background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow); width: 100%; max-width: 460px;
  }
  .node .mark { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; transition: background .3s; }
  body[data-state="connected"] .node .mark { background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  .node .name { font-size: 14px; font-weight: 600; color: var(--fg); }
  .node .sub { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .node > div { flex: 1; min-width: 0; }
  .node .ping { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--acc); }

  .side { width: 380px; flex: 0 0 380px; display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
  .tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { padding: 12px 14px; border-radius: var(--r); background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kpi .k { letter-spacing: 0; text-transform: none; font-family: inherit; font-size: 12px; }
  .kpi .v { font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v.acc { color: var(--acc); }
  .kpi .t { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .chart .bars { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
  .chart .bars i { flex: 1; min-width: 0; border-radius: 2px; background: rgba(var(--accRgb), .55); transition: height .5s var(--ease); }
  .chart .bars i.hot { background: var(--acc); }
  .chart .axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .row-fact { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--fg); }
  .row-fact span:last-child { font-family: var(--mono); font-size: 12px; color: var(--acc); text-align: right; }

  /* Предупреждение о системном прокси: не наш трафик — не наше обещание. */
  .leak { width: 100%; max-width: 460px; padding: 12px 14px; border-radius: var(--r); background: rgba(242,160,61,.10); border: 1px solid rgba(242,160,61,.45); display: flex; flex-direction: column; gap: 8px; }
  .leak .head { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--warn); font-weight: 600; }
  .leak .head svg { width: 16px; height: 16px; }
  .leak .body { font-size: 12px; line-height: 1.5; color: var(--fg); }
  .leak .act { display: flex; align-items: center; gap: 10px; }
  .leak .said { font-size: 12px; color: var(--dim); }

  /* ----------------------------------------------------------- серверы */

  .nodes { display: flex; flex-direction: column; gap: 2px; overflow: auto; min-height: 0; }
  .row-node {
    display: grid; grid-template-columns: 22px 1fr 120px 92px; gap: 12px; align-items: center;
    padding: 10px; min-height: 52px; border: 0; border-radius: min(var(--r), 10px); cursor: pointer; text-align: left;
    background: transparent; color: var(--fg); font: inherit; transition: background .3s;
  }
  .row-node:hover { background: rgba(var(--accRgb), .06); }
  .row-node[data-current] { background: var(--accSoft); }
  .row-node .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); justify-self: center; }
  .row-node[data-alive] .dot { background: var(--dim); }
  .row-node[data-current] .dot { background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  .row-node .name { font-size: 14px; font-weight: 600; }
  .row-node[data-chosen] .name::after { content: " ✓"; color: var(--acc); }
  .row-node .sub { font-size: 12px; color: var(--dim); }
  .row-node .bar { height: 5px; border-radius: 999px; background: var(--shade); overflow: hidden; }
  .row-node .bar i { display: block; height: 100%; border-radius: 999px; background: var(--acc); }
  .row-node .ms { font-family: var(--mono); font-size: 13px; font-weight: 700; text-align: right; white-space: nowrap; color: var(--fg); }
  .row-node[data-current] .ms { color: var(--acc); }
  .row-node:not([data-alive]) .name, .row-node:not([data-alive]) .ms { color: var(--dim); }

  /* ---------------------------------------------------------------- тема */

  .presets { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; }
  .preset {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; height: 66px;
    border-radius: min(calc(var(--r) + 4px), 18px); cursor: pointer; overflow: hidden;
    border: 1px solid var(--line); background: var(--surf);
    transition: border-color .35s, box-shadow .35s, transform .3s var(--ease);
  }
  .preset[aria-pressed="true"] { border: 2px solid var(--acc); box-shadow: 0 0 0 3px rgba(var(--accRgb), .25); }
  .preset .pv { position: relative; flex: 1; width: 100%; display: block; }
  .preset .pv i { position: absolute; display: block; }
  .preset .nm { font-size: 10px; color: var(--dim); padding-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .preset[aria-pressed="true"] .nm { color: var(--fg); font-weight: 700; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; padding: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.25); transition: transform .3s var(--ease), box-shadow .3s; }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--shade), 0 0 0 5px var(--acc); transform: scale(1.05); }
  .lamp {
    position: relative; height: 126px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 6px;
  }
  .lamp button { border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .lamp button i { width: 7px; height: 7px; border-radius: 50%; background: rgba(var(--accRgb), .4); transition: all .3s var(--ease); }
  .lamp button[aria-pressed="true"] i { width: 18px; height: 18px; background: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,.18), 0 0 20px rgba(255,255,255,.8); }
  .lamp .hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11px; pointer-events: none; }
  .kinds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .kind {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 5px 5px 7px; border-radius: min(var(--r), 12px);
    border: 1px solid var(--line); background: var(--surf); color: var(--fg); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .kind[aria-pressed="true"] { background: var(--accSoft); border-color: var(--acc); }
  .kind i { display: block; width: 100%; height: 34px; border-radius: max(calc(var(--r) - 6px), 4px); border: 1px solid var(--line); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pills .pillb { flex: 1; min-width: 0; padding: 0 8px; }
  .range { width: 100%; accent-color: var(--acc); }
  .file-row { display: flex; gap: 8px; }
  .code { font-family: var(--mono); font-size: 12px; padding: 10px 12px; border-radius: min(var(--r), 12px); background: var(--shade); border: 1px solid var(--line); color: var(--fg); cursor: pointer; }
  .knobs { width: 340px; flex: 0 0 340px; overflow: auto; min-height: 0; padding-right: 2px; }

  /* ---------------------------------------------------------- настройки */

  .settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); align-content: start; overflow: auto; min-height: 0; }
  .group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .group .k { padding: 0 4px; }
  .rows { border-radius: var(--r); background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow); display: flex; flex-direction: column; overflow: hidden; }
  .rows > div { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; }
  .rows > div + div { border-top: 1px solid var(--line); }
  .rows .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rows .name { font-size: 14px; font-weight: 600; color: var(--fg); }
  .rows .sub { font-size: 12px; color: var(--dim); }
  .rows .stack { flex-direction: column; align-items: stretch; gap: 10px; }
  .log { max-height: 220px; overflow: auto; font-family: var(--mono); font-size: 11px; display: flex; flex-direction: column; gap: 4px; user-select: text; }
  .log .ln { display: flex; gap: 10px; color: var(--fg); }
  .log .tm { color: var(--dim); flex: none; }
  .about { margin: 0; font-size: 13px; line-height: 1.6; color: var(--dim); }
  .about b { color: var(--fg); }
  .facts { display: flex; gap: 28px; }
  .fact .k { letter-spacing: .16em; }
  .fact .v { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--fg); margin-top: 4px; white-space: nowrap; }
  .host { font-family: var(--mono); font-size: 11px; color: var(--dim); }

  /* --------------------------------------------------------- трей-виджет */

  /*
    Страница одна: та же разметка и тот же скрипт, только в другой шкуре —
    body.as-widget прячет окно и показывает виджет. Рамку рисуем сами: окно
    у трея без системной.
  */
  .widget { display: none; }
  body.as-widget { background: transparent; }
  body.as-widget::before { display: none; }
  body.as-widget .app { display: none; }
  body.as-widget .widget {
    position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%;
    border-radius: 16px; border: 1px solid var(--line); overflow: hidden;
    background: radial-gradient(rgba(var(--accRgb), 0.06) 1px, transparent 1.5px) 0 0 / 22px 22px, var(--bgcss, var(--bg));
  }
  .w-top { height: 42px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); background: rgba(var(--accRgb), 0.05); }
  .w-top .acts { display: flex; gap: 2px; }
  .w-top .acts button { width: 34px; height: 30px; border: 0; background: transparent; color: var(--dim); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .w-top .acts button:hover { color: var(--fg); background: var(--accSoft); }
  .w-top .acts svg { width: 14px; height: 14px; }
  .w-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 8px 0; }
  .w-hero .ring { width: 196px; height: 196px; }
  .w-hero .power { width: 156px; height: 156px; }
  .w-hero .power svg { width: 50px; height: 50px; }
  .w-hero .status { font-size: 20px; }
  .w-meta { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--dim); }
  .w-bottom { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .w-node { max-width: none; cursor: pointer; font: inherit; text-align: left; }
  .w-node > div { flex: 1; min-width: 0; }
  .w-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .w-tiles .kpi { padding: 10px 12px; }
  .w-tiles .kpi .k { font-size: 11px; }
  .w-tiles .kpi .v { font-size: 14px; }
  .w-open { min-height: 40px; }

  /* Свой фон: картинка или видео под всем окном; пелена держит читаемость. */
  #bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  #bg-layer img, #bg-layer video { width: 100%; height: 100%; display: block; }
  #bg-veil { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
</style>
</head>
<body data-state="idle">
<div id="bg-layer" hidden></div>
<div id="bg-veil" hidden></div>
<div class="app">

  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>

  </header>

  <div class="body">
    <aside>
      <button class="tab" data-tab="home" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
        <span data-t="tabHome">Туннель</span>
      </button>
      <button class="tab" data-tab="nodes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>

      <button class="tab" data-tab="theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15 15h2a4 4 0 0 0 4-4 8 8 0 0 0-9-8z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15.5" cy="7.5" r="1"/></svg>
        <span data-t="tabTheme">Тема</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span data-t="tabSettings">Настройки</span>
        <i class="news"></i>
      </button>

      <div class="spacer"></div>

      <!--
        Подписка: до какого числа и сколько трафика осталось. Человек

      -->
      <div class="sub-card">
        <div class="t" id="sub-title"></div>
        <div class="s" id="subscription"></div>
      </div>

      <!-- «О нас» живёт в настройках; ссылка снизу — короткий путь туда. -->

        <span class="logo" aria-hidden="true"></span>
        <span data-t="tabAbout">О нас</span>
      </button>
    </aside>

    <main>
      <div class="head">
        <div>
          <div class="title" id="page-title"></div>
          <div class="sub" id="page-sub"></div>
        </div>
      </div>

      <!-- -------------------------------------------------------- главная -->
      <section class="page" data-tab="home" data-open>
        <div id="elev-warn" class="warn" data-t="elevWarn" hidden></div>

        <div class="split">
          <div class="hero wide">
            <div class="ring">
              <!--
                Дуга рисуется отдельно от кнопки: у кнопки свой объём и свои

              <svg viewBox="0 0 216 216" aria-hidden="true">

          <div class="col">
            <div class="group">
              <div class="k" data-t="settingsApp"></div>
              <div class="rows">
                <!-- Есть новая версия: показывается только когда панель продавца

                <div id="update-card" hidden>

const $ = (id) => document.getElementById(id);

// on вешает обработчик и не падает, если элемента нет.
//
// Прямая подписка через getElementById однажды уже обрушила всё окно: правка
// разметки убрала кнопку, а подписку на неё оставила. Исключение прервало
// загрузку на середине, и не выполнилось ничего из того, что шло ниже, —
// перевод надписей, сохранение ключа, переключатель языка и, главное, опрос
// состояния. Окно осталось живым на вид и мёртвым по сути.
//
// Пропажу не заминаем: она едет в консоль, чтобы её починили, — но роняет
// теперь одну кнопку, а не всю страницу.
function on(id, event, handler) {
  const el = $(id);
  if (!el) {
    console.error("нет элемента " + id + ": обработчик не повешен");
    return;
  }
  el.addEventListener(event, handler);
}

let lang = "ru";
const L = () => T[lang];

function pickLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && T[saved]) return saved;
  } catch (_) { /* хранилище недоступно */ }

  const want = (navigator.languages || [navigator.language || ""]).join(",").toLowerCase();
  return /\b(ru|be|uk|kk|ky|uz|tg|hy|az)\b/.test(want) ? "ru" : "en";
}

// paintStatic заполняет всё, что не меняется от состояния: заголовки вкладок,
// подписи кнопок, тексты «о программе».
function paintStatic() {
  const d = L();
  document.documentElement.lang = d.lang;

  for (const node of document.querySelectorAll("[data-t]")) {
    const v = d[node.dataset.t];
    if (typeof v === "string") node.textContent = v;
  }
  // Внутри этих абзацев есть выделения, поэтому они идут разметкой. Источник
  // свой, из словаря — чужого текста сюда не попадает.
  for (const node of document.querySelectorAll("[data-html]")) {
    const v = d[node.dataset.html];
    if (typeof v === "string") node.innerHTML = v;
  }

  $("lang").textContent = d.switchTo;
  $("lang").title = d.switchTitle;
  $("lang-2").textContent = d.switchTo;
  $("lang-2").title = d.switchTitle;
  $("w-full").title = d.wOpen;
  $("w-hide").title = d.wHide;

  paintHead();
  paintTheme();
}

async function setLang(next) {
  if (!T[next]) return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, next); } catch (_) { /* хранилище недоступно */ }
  paintStatic();
  // Программе язык нужен для своих сообщений: они приходят готовой строкой.
  try { await api("POST", "api/lang", { lang: next }); } catch (_) { /* переживём */ }
  tick();
}

/*
  Тема: таблица и арифметика — общие с панелью, вшиты выше на место метки.
  Здесь только выбор и раскладка переменных на корневой элемент: остальная
  страница написана через var(--…) и перекрашивается сама.
*/

let look = Look.load();

function applyLook() {
  const t = Look.theme(look);
  // Свой фон отменяет фон темы: иначе он его и закроет. Читаемость тогда
  // держит пелена над картинкой, а не фон.
  document.documentElement.style.cssText = Look.vars(t) + (backdropURL ? ";--bgcss:transparent" : "");
  paintBackdrop();
  // Кнопка питания: вид — из темы. Ставится атрибутом, а красится в CSS.
  $("power").dataset.btn = t.btn;
  paintTheme();
}

function setLook(patch) {
  Object.assign(look, patch);
  look = Look.normalize(look);
  Look.save(look);
  applyLook();
}

// Свой фон: картинка или видео из файла.
//
// Файл остаётся на этом компьютере — в IndexedDB профиля WebView2 — и в код
// темы не попадает: код передают, а файл вместе с ним не унесёшь. Ручки
// (как вписать, затемнение, размытие) тоже свои, отдельно от вида.
let backdrop = Look.loadBackdrop();
let backdropURL = null;
let backdropKind = "";

function paintBackdrop() {
  const layer = $("bg-layer"), veil = $("bg-veil");
  const on = !!backdropURL;
  layer.hidden = !on;
  veil.hidden = !on;
  if (!on) { layer.replaceChildren(); return; }

  const t = Look.theme(look);
  const css = Look.backdropCss(backdrop, t);
  // Поля под «целиком» закрывает фон темы, не чёрный: у светлой темы
  // чёрная рамка по краям выглядела бы поломкой.
  layer.style.background = t.bg;
  veil.style.background = css.veil;

  const tag = backdropKind === "video" ? "video" : "img";
  let media = layer.firstElementChild;
  if (!media || media.tagName.toLowerCase() !== tag || media.src !== backdropURL) {
    media = document.createElement(tag);
    if (tag === "video") {
      // Звук выключен и включить его нечем: окно, которое заговорило само,
      // — это не фон, это происшествие.
      media.muted = true;
      media.autoplay = true;
      media.loop = true;
      media.setAttribute("playsinline", "");
    }
    media.src = backdropURL;
    layer.replaceChildren(media);
  }
  media.setAttribute("style", css.media);
}

// useBackdropFile ставит файл фоном. Прежний адрес отзываем: иначе каждая
// замена оставляет в памяти окна ещё одно видео.
function useBackdropFile(file) {
  if (backdropURL) URL.revokeObjectURL(backdropURL);
  backdropURL = null;
  backdropKind = "";
  if (file) {
    backdropURL = URL.createObjectURL(file);
    backdropKind = String(file.type || "").startsWith("video") ? "video" : "image";
  }
  applyLook();
}

function setBackdrop(patch) {
  Object.assign(backdrop, patch);
  backdrop = Look.normalizeBackdrop(backdrop);
  Look.saveBackdrop(backdrop);
  paintBackdrop();
}

// paintBackdropKnobs рисует карточку «Свой фон». Ползунки не перерисовывают
// карточку: их значения пишем в подписи на месте, иначе палец теряет
// ползунок на первом же движении.
function paintBackdropKnobs() {
  const d = L();
  const on = !!backdropURL;
  $("bg-pick").textContent = on ? d.themeBackdropChange : d.themeBackdropPick;
  $("bg-drop").hidden = !on;
  $("bg-knobs").hidden = !on;
  if (!on) return;
  pills("bg-fits", Look.FITS, backdrop.fit, d.themeBackdropFits, (k) => { setBackdrop({ fit: k }); paintBackdropKnobs(); });
  $("bg-dim").value = Math.round(backdrop.dim * 100);
  $("bg-dim-note").textContent = Math.round(backdrop.dim * 100) + "%";
  $("bg-blur").value = backdrop.blur;
  $("bg-blur-note").textContent = backdrop.blur ? backdrop.blur + " px" : d.themeBackdropSharp;
}

async function loadBackdropFile() {
  let file = null;
  try { file = await Look.getBackdropFile(); } catch (_) { return; /* хранить негде — фон просто не запомнился */ }
  if (file) useBackdropFile(file);
}

on("bg-pick", "click", () => $("bg-file").click());
on("bg-file", "change", async (e) => {
  const d = L();
  const file = e.target.files && e.target.files[0];
  // Поле чистим сразу: иначе повторный выбор того же файла не считается
  // изменением, и события не будет вовсе.
  e.target.value = "";
  if (!file) return;
  const bad = $("bg-bad");
  const say = (text) => { bad.textContent = text; bad.hidden = !text; };
  if (!/^(image|video)\//.test(file.type || "")) { say(d.themeBackdropWrong); return; }
  if (file.size > Look.BACKDROP_MAX) { say(d.themeBackdropBig); return; }
  try { await Look.putBackdropFile(file); } catch (_) { say(d.themeBackdropNoRoom); return; }
  say("");
  useBackdropFile(file);
});
on("bg-drop", "click", async () => {
  try { await Look.dropBackdropFile(); } catch (_) { /* его там и не было */ }
  $("bg-bad").hidden = true;
  useBackdropFile(null);
});
on("bg-dim", "input", (e) => {
  setBackdrop({ dim: Number(e.target.value) / 100 });
  $("bg-dim-note").textContent = e.target.value + "%";
});
on("bg-blur", "input", (e) => {
  setBackdrop({ blur: Number(e.target.value) });
  $("bg-blur-note").textContent = Number(e.target.value) ? e.target.value + " px" : L().themeBackdropSharp;
});

// el — короткий конструктор элемента: тег, класс, содержимое.
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

// pills рисует ряд таблеток: активная — акцентом. Все ручки темы, кроме
// цветов, выбираются так.
function pills(id, keys, current, names, onPick) {
  const box = $(id);
  box.replaceChildren();
  for (const k of keys) {
    const b = el("button", "pillb", names[k] || k);
    b.type = "button";
    b.dataset.focus = id + "-" + k;
    b.setAttribute("aria-pressed", String(current === k));
    b.addEventListener("click", () => onPick(k));
    box.append(b);
  }
}

function swatches(id, colors, current, paint, onPick) {
  const box = $(id);
  box.replaceChildren();
  for (const c of colors) {
    const b = el("button", "swatch");
    b.type = "button";
    b.dataset.focus = id + "-" + c;
    b.setAttribute("aria-label", c == null ? L().themeTintAuto : (id === "accents" ? L().themeAccent : L().themeTint) + " " + c);
    b.style.background = paint(c);
    b.setAttribute("aria-pressed", String(current === c));
    b.addEventListener("click", () => onPick(c));
    box.append(b);
  }
}

// paintTheme рисует вкладку «Тема». Заново при каждой смене: у карточек
// подсветка выбранного, а у плиток — цвет активной, и всё это от темы.
// Прокрутка колонки ручек при этом остаётся: перерисовываются дети, а не
// сама колонка.
function paintTheme() {
  const focusKey = document.activeElement && document.activeElement.dataset.focus;
  const d = L();
  const t = Look.theme(look);
  $("theme-copy-status").textContent = "";

  // Готовые виды — мини-макет окна в цветах каждого: боковая, кнопка, карточки.
  const presets = $("presets");
  presets.replaceChildren();
  Look.LOOKS.forEach((lk, i) => {
    const lt = Look.theme(Object.assign({}, lk, { acc: null, tint: null }));
    const b = el("button", "preset");
    b.type = "button";
    b.dataset.focus = "preset-" + i;
    b.setAttribute("aria-pressed", String(Look.same(look, lk)));
    const pv = el("span", "pv");
    pv.style.background = lt.bgcss;
    const side = el("i"); side.style.cssText = "left:0;top:0;bottom:0;width:30%;background:" + lt.surf + ";border-right:1px solid " + lt.line;
    const ring = el("i"); ring.style.cssText = "left:52%;top:22%;width:12px;height:12px;border-radius:50%;box-sizing:border-box;border:2px solid " + lt.acc
      + (lk.btn === "solid" ? ";background:" + lt.acc : "");
    const cardA = el("i"); cardA.style.cssText = "left:38%;right:8%;bottom:8%;height:22%;border-radius:" + Math.round(lt.r * 0.25) + "px;background:" + lt.surf
      + ";border:1px solid " + lt.cardLine;
    pv.append(side, ring, cardA);
    const nm = el("span", "nm", d.themes[i] || lk.preset);
    b.append(pv, nm);
    // Вид задаёт всё разом; акцент и оттенок сбрасываются: у каждого свой.
    b.addEventListener("click", () => setLook(Object.assign({ acc: null, tint: null }, lk)));
    presets.append(b);
  });

  swatches("accents", Look.ACCENTS, t.acc, (c) => c, (c) => setLook({ acc: c }));
  swatches("tints", [null].concat(Look.ACCENTS), look.tint,
    (c) => "linear-gradient(135deg," + (c || t.acc) + "," + Look.mix(c || t.acc, "#000000", 0.6) + ")",
    (c) => setLook({ tint: c }));

  // Лампа: экран, залитый настоящим фоном; нажатие в угол переносит свет.
  const litBg = (kind, dir) => Look.theme(Object.assign({}, look, { kind, dir })).bgcss;
  const lamp = $("lamp");
  lamp.replaceChildren();
  lamp.style.background = litBg(look.kind === "flat" ? "linear" : look.kind, look.dir);
  for (const k of ["nw", "n", "ne", "w", "c", "e", "sw", "s", "se"]) {
    const b = el("button");
    b.type = "button";
    b.dataset.focus = "lamp-" + k;
    b.setAttribute("aria-label", d.dirs[k]);
    b.setAttribute("aria-pressed", String(look.dir === k));
    b.append(el("i"));
    b.addEventListener("click", () => setLook({ dir: k, kind: look.kind === "flat" ? "linear" : look.kind }));
    lamp.append(b);
  }
  lamp.append(el("span", "hint", d.themeLampHint));
  $("light-note").textContent = look.kind === "flat" ? d.themeLightOff : d.dirs[look.dir];

  const kinds = $("kinds");
  kinds.replaceChildren();
  for (const k of Look.KINDS) {
    const b = el("button", "kind");
    b.type = "button";
    b.dataset.focus = "kind-" + k;
    b.setAttribute("aria-pressed", String(look.kind === k));
    const i = el("i");
    i.style.background = litBg(k, look.dir);
    b.append(i, el("span", null, d.kinds[k]));
    b.addEventListener("click", () => setLook({ kind: k }));
    kinds.append(b);
  }

  const depth = $("depth");
  depth.setAttribute("aria-label", d.themeDepth);
  depth.value = Math.round(look.depth * 100);
  $("depth-note").textContent = d.depths[look.depth <= 0.3 ? 0 : look.depth <= 0.5 ? 1 : look.depth <= 0.7 ? 2 : look.depth <= 0.85 ? 3 : 4];

  pills("radii", Object.keys(Look.RADII), look.radius, d.radii, (k) => setLook({ radius: k }));
  pills("densities", Object.keys(Look.DENSITY), look.density, d.density, (k) => setLook({ density: k }));
  pills("cardKinds", Look.CARDS, look.card, d.cardKinds, (k) => setLook({ card: k }));
  pills("buttons", Look.BUTTONS, look.btn, d.buttons, (k) => setLook({ btn: k }));
  pills("glows", Object.keys(Look.GLOWS), look.glow, d.glows, (k) => setLook({ glow: k }));

  // Профили — три слота с кодами. Пустой слот занимается кнопкой «сохранить
  // сюда», занятый по нажатию применяется.
  const slots = Look.loadProfiles();
  const profiles = $("profiles");
  profiles.replaceChildren();
  slots.forEach((code, i) => {
    const b = el("button", "pillb", (code ? d.themeSlotFull : d.themeSlotEmpty) + " " + (i + 1));
    b.type = "button";
    b.dataset.focus = "profile-" + i;
    b.setAttribute("aria-pressed", String(profileSlot === i));
    b.addEventListener("click", () => {
      profileSlot = i;
      const st = code ? Look.decode(code) : null;
      if (st) setLook(st); else paintTheme();
    });
    profiles.append(b);
  });

  paintBackdropKnobs();
  $("theme-code").textContent = Look.encode(look);
  $("theme-code").title = d.themeCopy;
  $("code-in").placeholder = d.themeCodePlaceholder;
  $("code-in").setAttribute("aria-label", d.themeCodePlaceholder);
  if (focusKey) {
    const next = Array.from(document.querySelectorAll("[data-focus]")).find((e) => e.dataset.focus === focusKey);
    if (next) next.focus({ preventScroll: true });
  }
}

// Слот профиля, в который пишет «сохранить сюда».
let profileSlot = 0;

on("depth", "input", (e) => setLook({ depth: Number(e.target.value) / 100 }));
on("profile-save", "click", () => {

on("theme-random", "click", () => {

    kind: pick(["linear", "radial", "aurora"]), dir: pick(Object.keys(Look.DIRS)),

});
on("code-in", "change", (e) => {

/* ------------------------------------------------------------- прокси */

/*
  Предупреждение о системном прокси.

  Показываем только при поднятом туннеле, и вот почему: пока туннель выключен,
  прокси никому не мешает и говорить не о чем. А вот когда окно написало «весь
  трафик компьютера идёт через туннель», это обещание должно быть верным — или
  рядом должно стоять честное «кроме вот этого».

  Кнопка снимает только настройку системы. Переменные окружения живут в уже
  запущенных программах, наша правка до них не дойдёт, и обещать обратное
  нечестно — так и пишем.
*/
function showProxy(s) {
  const box = $("proxy-warn");
  const show = s.state === "connected" && !!s.proxy;

  box.hidden = !show;
  if (!show) return;

  $("proxy-text").textContent = s.proxy;

  // Переменные окружения снять из реестра нельзя, поэтому и кнопку не
  // показываем: кнопка, которая не помогает, хуже её отсутствия.
  const button = $("proxy-off");
  button.hidden = s.proxy_env;
  $("proxy-care").hidden = s.proxy_env;
  $("proxy-msg").textContent = s.proxy_env
    ? L().proxyEnv
    : "";
}

async function dropProxy() {
  const button = $("proxy-off");
  const said = $("proxy-msg");

  button.disabled = true;
  said.textContent = L().proxyRemoving;
  try {
    const after = await api("POST", "api/proxy/off");
    render(after);
    if (!after.proxy) {
      said.textContent = L().proxyGone;
    }
  } catch (e) {
    said.textContent = e.message;
  } finally {
    button.disabled = false;
  }
}

/* ----------------------------------------------------------------- обмен */

// Всё лежит под одноразовым ключом в адресе: /<ключ>/. Запросы поэтому
// относительные — они сами попадают куда надо, а ключ нигде не дублируется.
const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";

async function api(method, path, body) {
  const res = await fetch(base + path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : {};
  if (!res.ok) throw new Error(data.error || (L().err + res.status));
  return data;
}

/* ----------------------------------------------------------- выбор ноды */

// Список стран рисуем сами, без шаблонов: строк единицы, а каждая новая
// зависимость в окне — это то, что придётся вшивать и обновлять.
//
// Текст не вставляем разметкой: имя и страну пишет продавец, и одна кавычка
// в названии сервера превратилась бы в сломанную страницу, а то и хуже.
function paintNodes(list) {
  const box = $("nodes-list");
  box.replaceChildren();

  const d = L();
  if (!list || list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = d.nodesNone;
    box.append(empty);
    return;
  }

  const row = (opts) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "row-node";
    if (opts.alive) b.setAttribute("data-alive", "");
    if (opts.current) b.setAttribute("data-current", "");
    if (opts.chosen) b.setAttribute("data-chosen", "");

    const dot = document.createElement("span");
    dot.className = "dot";

    const grow = document.createElement("div");
    grow.className = "grow";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = opts.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = opts.sub;
    grow.append(name, sub);

    // Полоска качества: замер в миллисекундах на глаз не сравнить, а длина —
    // сравнивается. Триста миллисекунд и хуже — пусто.
    const bar = document.createElement("span");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = opts.ms > 0 ? Math.max(0, Math.min(100, Math.round((1 - opts.ms / 300) * 100))) + "%" : "0";
    bar.append(fill);

    const ms = document.createElement("div");
    ms.className = "ms";
    ms.textContent = opts.ms > 0 ? opts.ms + d.ms : d.pingUnknown;

    b.append(dot, grow, bar, ms);
    b.addEventListener("click", () => chooseNode(opts.id));
    return b;
  };

  // Автовыбор — первой строкой: это состояние по умолчанию, и вернуться к
  // нему человек должен уметь так же легко, как уйти.
  const chosenAny = list.some((n) => n.chosen);
  const fastest = list.filter((n) => n.alive && n.ms > 0).sort((a, b) => a.ms - b.ms)[0];
  box.append(row({
    id: 0,
    name: d.nodesAuto,
    sub: fastest ? d.nodesAutoSub + " — " + (fastest.country || fastest.name) : d.nodesAutoSub,
    ms: 0,
    alive: true,
    chosen: !chosenAny,
    current: false,
  }));

  for (const n of list) {
    // Что показываем под именем: сначала то, где трафик, потом выбор.
    // Это разные вещи: выбранная нода могла замолчать, и ядро уехало на живую.
    let sub = n.country && n.country !== n.name ? n.name : "";
    const marks = [];
    if (n.current) marks.push(d.nodesCurrent);
    if (n.setup_ms > 0) marks.push(d.setupLabel + ": " + n.setup_ms + d.ms);
    if (n.chosen) marks.push(d.nodesChosen);
    if (!n.alive && !n.current) marks.push(n.ms > 0 ? d.nodesDead : d.nodesUnknown);
    if (marks.length) sub = sub ? sub + " · " + marks.join(" · ") : marks.join(" · ");

    box.append(row({
      id: n.id,
      name: n.country || n.name,
      sub,
      ms: n.ms > 0 ? n.ms : 0,
      alive: n.alive,
      current: n.current,
      chosen: n.chosen,
    }));
  }
}

async function loadNodes() {
  try {
    const data = await api("GET", "api/nodes");
    paintNodes(data.nodes);
  } catch (e) {
    $("nodes-msg").textContent = e.message;
  }
}

async function chooseNode(id) {
  const msg = $("nodes-msg");
  msg.textContent = L().nodesSwitching;
  try {
    const data = await api("POST", "api/nodes/select", { id });
    paintNodes(data.nodes);
    msg.textContent = "";
  } catch (e) {
    msg.textContent = e.message;
  }
}

on("nodes-measure", "click", async () => {
  const msg = $("nodes-msg");
  const button = $("nodes-measure");
  msg.textContent = L().nodesMeasuring;
  button.disabled = true;
  try {
    const data = await api("POST", "api/nodes/measure");
    paintNodes(data.nodes);
    msg.textContent = "";
  } catch (e) {
    msg.textContent = e.message;
  } finally {
    button.disabled = false;
  }
});

/* -------------------------------------------------------------- величины */

function bytes(n) {
  const units = L().bytes;
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? Math.round(n) : n.toFixed(1)) + " " + units[i];
}

function clock(seconds) {
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  const two = (n) => String(n).padStart(2, "0");
  return two(h) + ":" + two(m) + ":" + two(s);
}

// keyParts достаёт из ссылки то, что можно показать: хост подписки и метку.
// Сам ключ — между «//» и «@» — на экран не выводится: он и так в поле ниже.
function keyParts(link) {
  const m = /^marvia:\/\/[^@]*@([^/#?]+)[^#]*(?:#(.*))?$/.exec((link || "").trim());
  if (!m) return null;
  let label = "";
  try { label = decodeURIComponent(m[2] || ""); } catch (_) { label = m[2] || ""; }
  return { host: m[1], label };
}

/* ------------------------------------------------------------- отрисовка */

// Названия состояний живут в словаре: их видит человек, а не программа.

let prev = null;

/*
  Последняя ошибка, показанная в ответ на нажатие.

  Опрос состояния приходит раз в секунду и переписывает ту же строку, поэтому
  всё, что программа отвечает сразу — «не задана ссылка доступа», «нужны права
  администратора», — вспыхивало и пропадало быстрее, чем человек успевал
  прочитать. Он видел красный проблеск и нажимал снова.
*/
let complaint = null;

function complain(text) {
  complaint = { text, until: Date.now() + 12000 };
  $("detail").textContent = text;
}

function complaintNow() {
  if (complaint && Date.now() < complaint.until) return complaint.text;
  complaint = null;
  return null;
}

// paintBars рисует час трафика: 60 столбиков, самый высокий — самая
// нагруженная минута. Столбики от четырёх пятых максимума — акцентом, как в
// макете: глазу нужна точка отсчёта, а не ровная гребёнка.
function paintBars(history) {
  const box = $("bars");
  const list = Array.isArray(history) && history.length ? history : new Array(60).fill(0);
  const max = Math.max(1, ...list);
  const total = list.reduce((a, v) => a + v, 0);

  if (box.children.length !== list.length) {
    box.replaceChildren(...list.map(() => document.createElement("i")));
  }
  list.forEach((v, i) => {
    const bar = box.children[i];
    bar.style.height = Math.max(2, Math.round((v / max) * 100)) + "%";
    bar.classList.toggle("hot", v > 0 && v >= max * 0.8);
  });
  $("hour-total").textContent = total > 0 ? bytes(total) : "";
}

function render(s) {
  const d = L();
  document.body.dataset.state = s.state;
  $("status").textContent = d.state[s.state] || s.state;
  $("power").dataset.state = s.state;
  // Во время подключения кнопка была заблокирована, а обработчик отмену умел:
  // человек полторы минуты смотрел на замершее окно и не мог ничего сделать.
  $("power").disabled = !s.elevated;
  $("power").title =
    s.state === "connecting" ? d.power.cancel
    : s.state === "connected" || s.state === "stalled" ? d.power.off
    : d.power.on;
  $("elev-warn").hidden = s.elevated;
  $("version").textContent = s.version ? "v" + s.version : "";
  $("update-card").hidden = !s.update;
  if (s.update) $("update-title").textContent = d.updateTitle(s.update);
  // Точка на вкладке — чтобы заметили, не заходя в настройки.
  document.querySelector('.tab[data-tab="settings"]').classList.toggle("news", !!s.update);

  const detail = $("detail");

  // Пока подключаемся или подключились, жалоба уже неактуальна.
  if (s.state === "connecting" || s.state === "connected") complaint = null;

  const said = complaintNow();
  detail.classList.toggle("bad", s.state === "failed" || s.state === "stalled" || said !== null);
  if (said !== null) detail.textContent = said;
  else if (s.state === "failed") detail.textContent = s.reason || d.detail.unknown;
  else if (s.state === "stalled") detail.textContent = s.reason || d.detail.stalled;
  else if (s.state === "connecting") detail.textContent = d.detail.connecting;
  else if (s.state === "connected") detail.textContent = d.detail.connected;
  else if (!s.has_account) detail.textContent = d.detail.noKey;
  else detail.textContent = d.detail.idle;

  // Поле ключа на первом экране — только пока ключа нет.
  $("first-key").hidden = s.has_account;

  // Подписка: до какого числа и сколько осталось — в боковой и на вкладке ключа.
  const parts = [];
  if (s.until) parts.push(d.until + s.until);
  if (s.limit_bytes > 0) parts.push(d.left + bytes(s.left_bytes || 0));
  $("sub-title").textContent = s.has_account ? d.subOn : d.subOff;
  $("subscription").textContent = parts.length ? parts.join(" · ") : (s.has_account ? d.subAfter : d.subNoKey);

  const up = s.state === "connected" || s.state === "stalled";
  $("key-state").textContent = s.has_account ? d.keyOn : d.keyOff;
  $("key-state").classList.toggle("on", s.has_account);
  $("f-until").textContent = s.until ? s.until : (up ? d.keyNoUntil : "—");
  $("f-traffic").textContent = s.limit_bytes > 0 ? bytes(s.left_bytes || 0) + " / " + bytes(s.limit_bytes) : (up ? d.keyNoLimit : "—");
  $("f-fill").style.width = s.limit_bytes > 0 ? Math.round(100 * Math.max(0, s.left_bytes || 0) / s.limit_bytes) + "%" : "0";
  $("key-note").textContent = up ? "" : d.keyNote;

  if (s.node) {
    $("node-name").textContent = s.node;
    $("node-addr").textContent = s.address;
    $("node-ping").textContent = s.ping_ms ? s.ping_ms + d.ms : d.pingUnknown;
    $("rule-now").textContent = s.node;
    $("k-ping").textContent = s.ping_ms ? s.ping_ms + d.ms : d.pingUnknown;
  } else {
    $("node-name").textContent = d.noNode;
    $("node-addr").textContent = d.noNodeSub;
    $("node-ping").textContent = "";
    $("rule-now").textContent = "—";
    $("k-ping").textContent = "—";
  }

  // Сессия считается здесь, по моменту подъёма: секунды тикают сами, и
  // программе незачем слать готовую строку раз в секунду.
  $("k-session").textContent = up && s.since ? clock(Math.max(0, Math.floor(Date.now() / 1000) - s.since)) : "—";

  showProxy(s);

  // Скорость считаем сами, по разнице между опросами: программе незачем
  // помнить, когда её спрашивали в прошлый раз.
  const now = Date.now();
  if (prev && now > prev.t) {
    const dt = (now - prev.t) / 1000;
    $("s-down").textContent = bytes(Math.max(0, (s.down - prev.down) / dt)) + d.perSec;
    $("s-up").textContent = bytes(Math.max(0, (s.up - prev.up) / dt)) + d.perSec;
  }
  prev = { t: now, up: s.up || 0, down: s.down || 0 };

  $("t-down").textContent = bytes(s.down || 0);
  $("t-up").textContent = bytes(s.up || 0);

  paintBars(s.history);

  // Виджет — тот же экран в другой шкуре: кнопка, состояние, сессия и
  // скорость, нода. Красится тем же, чем окно, только короче.
  $("w-power").dataset.state = s.state;
  $("w-power").dataset.btn = $("power").dataset.btn || "";
  $("w-power").disabled = !s.elevated;
  $("w-power").title = $("power").title;
  $("w-status").textContent = $("status").textContent;
  const wmeta = [];
  if (up && s.since) wmeta.push(clock(Math.max(0, Math.floor(Date.now() / 1000) - s.since)));
  if (up) wmeta.push($("s-down").textContent);
  $("w-meta").textContent = wmeta.length ? wmeta.join(" · ") : $("detail").textContent;
  $("w-node").textContent = $("node-name").textContent;
  $("w-ping").textContent = $("node-ping").textContent;
  $("w-session").textContent = $("k-session").textContent;
  $("w-down").textContent = $("t-down").textContent || $("s-down").textContent;
  $("w-kping").textContent = $("k-ping").textContent;
}

// paintKeyCard — заголовок карточки ключа: метка и хост из ссылки.
function paintKeyCard(link) {
  const d = L();
  const parts = keyParts(link);
  $("key-label").textContent = parts && parts.label ? parts.label : d.keyTitle;
  $("key-host").textContent = parts ? parts.host : d.keyNoHost;
}

// paintLog раскладывает строки журнала: время отдельно, текст отдельно.
// Строка приходит как «ЧЧ:ММ:СС  текст» — программа так их и пишет.
function paintLog(lines) {
  const box = $("log");
  const list = lines || [];
  if (list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = L().logEmpty;
    box.replaceChildren(empty);
    return;
  }
  // Перерисовываем только когда число строк изменилось: журнал опрашивается
  // каждую секунду, а прокрутку человек ставит руками.
  if (box.dataset.count === String(list.length)) return;
  box.dataset.count = String(list.length);

  const stuck = box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
  box.replaceChildren(...list.map((line) => {
    const ln = document.createElement("div");
    ln.className = "ln";
    const tm = document.createElement("span");
    tm.className = "tm";
    const tx = document.createElement("span");
    const m = /^(\d\d:\d\d:\d\d)\s+(.*)$/s.exec(line);
    tm.textContent = m ? m[1] : "";
    tx.textContent = m ? m[2] : line;
    ln.append(tm, tx);
    return ln;
  }));
  if (stuck) box.scrollTop = box.scrollHeight;
}

/* --------------------------------------------------------------- действия */

let busy = false;

async function togglePower() {
  if (busy) return;
  busy = true;
  try {
    const s = await api("GET", "api/state");
    if (s.state === "connected" || s.state === "connecting") await api("POST", "api/disconnect");
    else await api("POST", "api/connect");
    await tick();
  } catch (err) {
    complain(err.message);
    $("detail").classList.add("bad");
  } finally {
    busy = false;
  }
}
on("power", "click", togglePower);
on("w-power", "click", togglePower);

// Автозапуск: одна кнопка-переключатель, состояние спрашиваем у программы,
// а не помним сами — задачу могли снять и мимо нас.
async function paintAutostart() {
  const d = L();
  try {
    const a = await api("GET", "api/autostart");
    $("autostart").textContent = a.on ? d.autostartOn : d.autostartOff;
    $("autostart").dataset.on = String(!!a.on);
  } catch (_) { /* покажем при следующем заходе */ }
}
on("autostart", "click", async () => {
  const on = $("autostart").dataset.on !== "true";
  $("autostart-msg").textContent = "";
  try {
    await api("POST", "api/autostart", { on });
  } catch (err) {
    $("autostart-msg").textContent = err.message;
  }
  paintAutostart();
});
paintAutostart();

on("proxy-off", "click", dropProxy);

on("save", "click", async () => {
  const msg = $("save-msg");
  msg.className = "hint";
  try {
    await api("POST", "api/account", { link: $("account").value });
    msg.textContent = L().keySaved;
    paintKeyCard($("account").value);
    await tick();
  } catch (err) {
    msg.className = "hint bad";
    msg.textContent = err.message;
  }
});

// Тот же обработчик для поля на первом экране.
//
// Оно там ровно до первого сохранённого ключа: дальше человек про него
// забудет, а место на главном экране дорогое.
on("first-save", "click", async () => {
  const msg = $("first-msg");
  msg.className = "hint";
  try {
    const link = $("first-account").value;
    await api("POST", "api/account", { link });
    $("account").value = link;
    paintKeyCard(link);
    msg.textContent = L().keySaved;
    await tick();
  } catch (err) {
    msg.className = "hint bad";
    msg.textContent = err.message;
  }
});

/* ----------------------------------------------------------------- опрос */

async function tick() {
  try {
    render(await api("GET", "api/state"));
    const log = await api("GET", "api/log");
    paintLog(log.lines);
  } catch (err) {
    $("status").textContent = L().noLink;
  }
}

lang = pickLang();
applyLook();
paintStatic();
loadBackdropFile();
on("lang", "click", () => setLang(lang === "ru" ? "en" : "ru"));
on("lang-2", "click", () => setLang(lang === "ru" ? "en" : "ru"));

// Программе язык сообщаем сразу: её сообщения приходят готовой строкой, и до
// первого такого сообщения она должна знать, на каком языке его собирать.
api("POST", "api/lang", { lang }).catch(() => {});

api("GET", "api/account").then((a) => {
  $("account").value = a.link || "";
  paintKeyCard(a.link);
}).catch(() => {});
tick();
setInterval(tick, 1000);
</script>
