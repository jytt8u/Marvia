<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvia</title>
<style>
  /* Шрифты свои, вшитые в программу, — те же, что у панели. Системный
     Segoe UI не совпал бы с макетом ни в одной строке, а тянуть шрифт из
     сети окно не вправе: оно и так знает о человеке больше, чем нужно. */
  @font-face { font-family: Onest; src: url(fonts/onest-latin.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Onest; src: url(fonts/onest-cyrillic.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Unbounded; src: url(fonts/unbounded-latin.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Unbounded; src: url(fonts/unbounded-cyrillic.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Chakra Petch'; src: url(fonts/chakra-petch-latin.woff2) format('woff2');
    font-weight: 700; font-display: swap; unicode-range: U+0000-00FF; }

  /*
    Цвета не написаны здесь ни разу: все они — переменные, которые ставит
    тема (Look.vars) на корневой элемент. Запасные значения ниже — вид «Серый»
    из коробки, чтобы страница не мигнула чёрным до первого скрипта.
  */
  :root {
    --bg: #0c0e11; --surf: #18191c; --surf2: #242628; --line: #333537;
    --fg: #f1f4f7; --dim: #9aa0a7; --acc: #c3ccd6; --accFg: #08110d;
    --accSoft: rgba(195,204,214,0.13); --accRgb: 195,204,214;
    --warn: #f2a03d; --fail: #ff6b7a;
    --bgcss: var(--bg); --cardLine: var(--line); --cardShadow: none; --glow: none;
    --r: 14px; --pad: 16px; --gap: 12px;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --display: Unbounded, Onest, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  /* Атрибут hidden обязан побеждать любой display: иначе «скрытое» поле
     ключа торчит на главном экране у того, у кого ключ давно есть. */
  [hidden] { display: none !important; }

  html, body {
    height: 100%; margin: 0;
    background: var(--bgcss, var(--bg)); color: var(--fg);
    font: 14px/1.5 Onest, "Segoe UI", system-ui, sans-serif;
    user-select: none; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }

  .app { display: flex; flex-direction: column; height: 100%; }

  /* ------------------------------------------------------------- шапка */

  .top {
    height: 44px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surf);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 22px; width: auto; display: block; }
  .wordmark { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .2em; color: var(--acc); }
  .ver { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .top button.lang {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 8px; cursor: pointer;
  }
  .top button.lang:hover { color: var(--fg); border-color: var(--acc); }

  .body { flex: 1; display: flex; min-height: 0; }

  /* ------------------------------------------------------------ боковая */

  aside {
    width: 216px; flex: 0 0 216px;
    background: var(--surf); border-right: 1px solid var(--line);
    padding: 16px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .tab {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--r);
    color: var(--dim); cursor: pointer; border: none; background: none; width: 100%;
    font: inherit; font-size: 13px; text-align: left;
    transition: background .15s, color .15s;
  }
  .tab .dot { width: 7px; height: 7px; border-radius: 2px; flex: none; background: var(--dim); transition: background .15s; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--surf2); color: var(--fg); }
  .tab[aria-selected="true"] .dot { background: var(--acc); }

  .spacer { flex: 1; }

  /* Карточка подписки внизу боковой: что с ключом и до какого числа. */
  .sub-card { padding: 12px; border-radius: var(--r); background: var(--surf2); display: flex; flex-direction: column; gap: 5px; }
  .sub-card .t { font-size: 12px; color: var(--fg); }
  .sub-card .s { font-family: var(--mono); font-size: 10px; color: var(--dim); line-height: 1.5; }

  /* -------------------------------------------------------------- центр */

  main { flex: 1; min-width: 0; padding: 22px 26px; display: flex; flex-direction: column; gap: 18px; overflow: hidden; }

  .head { display: flex; align-items: flex-end; justify-content: space-between; flex: none; }
  .head .title { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -.01em; color: var(--fg); }
  .head .sub { font-size: 13px; color: var(--dim); margin-top: 3px; }

  /* Состояние туннеля — капсула в углу, на всех вкладках. Цвет говорит
     раньше слов: акцент — защищено, янтарный — связь потеряна, красный — не
     подключилось. */
  .pill {
    display: flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surf2);
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--dim);
    transition: background .3s, border-color .3s, color .3s;
  }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); transition: background .3s; }
  body[data-state="connected"] .pill { background: var(--accSoft); border-color: var(--acc); color: var(--acc); }
  body[data-state="connected"] .pill i { background: var(--acc); }
  body[data-state="connecting"] .pill i { background: var(--acc); animation: blink 1.2s ease-in-out infinite; }
  body[data-state="stalled"] .pill { border-color: var(--warn); color: var(--warn); }
  body[data-state="stalled"] .pill i { background: var(--warn); }
  body[data-state="failed"] .pill { border-color: var(--fail); color: var(--fail); }
  body[data-state="failed"] .pill i { background: var(--fail); }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  .page { display: none; flex: 1; min-height: 0; flex-direction: column; gap: var(--gap); }
  .page[data-open] { display: flex; }

  .card {
    padding: var(--pad); border-radius: var(--r);
    background: var(--surf); border: 1px solid var(--cardLine, var(--line)); box-shadow: var(--cardShadow, none);
    display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card-head b { font-size: 14px; font-weight: 600; }
  .card-head .mono { font-family: var(--mono); font-size: 11px; color: var(--dim); }

  .k { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }

  .split { flex: 1; min-height: 0; display: flex; gap: var(--gap); }
  .split > .card { flex: 1; }
  .split > .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
  .split > .wide { flex: 1.4; }

  /* ------------------------------------------------------------- цифры */

  .kpis { display: flex; gap: var(--gap); flex: none; }
  .kpi { flex: 1; padding: var(--pad); border-radius: var(--r); background: var(--surf); border: 1px solid var(--line); min-width: 0; }
  .kpi .v { font-family: var(--mono); font-size: 22px; font-weight: 700; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .kpi .v.acc { color: var(--acc); }
  .kpi .t { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 2px; }

  /* ------------------------------------------------------------- кнопка */

  /* «safe center»: пока содержимого мало, оно по центру; когда добавилось
     предупреждение о прокси, карточка прокручивается сверху, а не обрезает
     кнопку. Обычный center при переполнении режет именно верх. */
  .hero { align-items: center; justify-content: safe center; gap: 12px; overflow-y: auto; }
  .hero::-webkit-scrollbar { width: 0; }

  .power {
    width: 150px; height: 150px; border-radius: 50%; flex: none;
    border: 1px solid var(--line); background: var(--surf2);
    cursor: pointer; display: grid; place-items: center;
    transition: transform .18s, box-shadow .35s, background .35s, border-color .35s;
  }
  .power svg { width: 56px; height: 56px; color: var(--dim); transition: color .35s; }
  .power:hover:not(:disabled) { transform: translateY(-2px); }
  .power:active:not(:disabled) { transform: translateY(0) scale(.985); }
  .power:disabled { cursor: default; opacity: .55; }

  /* Подключено: вид кнопки — из темы. Диск, кольцо, стекло, контур; свечение
     тоже оттуда. Остальные состояния одинаковы при любой кнопке: беда должна
     выглядеть как беда. */
  .power[data-state="connected"] {
    background: var(--acc); border-color: transparent;
    box-shadow: 0 0 0 10px var(--accSoft), var(--glow);
  }
  .power[data-state="connected"] svg { color: var(--accFg); }
  .power[data-state="connected"][data-btn="ring"] { background: transparent; border: 3px solid var(--acc); }
  .power[data-state="connected"][data-btn="ring"] svg { color: var(--acc); }
  .power[data-state="connected"][data-btn="glass"] { background: var(--accSoft); border: 1px solid var(--acc); }
  .power[data-state="connected"][data-btn="glass"] svg { color: var(--acc); }
  .power[data-state="connected"][data-btn="bare"] { background: transparent; border: 1px solid var(--line); box-shadow: var(--glow); }
  .power[data-state="connected"][data-btn="bare"] svg { color: var(--acc); }

  .power[data-state="failed"] { background: var(--fail); border-color: transparent; }
  .power[data-state="failed"] svg { color: #fff; }

  /* Связь потеряна — янтарный, а не красный: туннель поднят, и это не то же
     самое, что «не подключилось». Разный цвет говорит это без слов. */
  .power[data-state="stalled"] { background: var(--warn); border-color: transparent; }
  .power[data-state="stalled"] svg { color: #1a1204; }

  .power[data-state="connecting"] { animation: breathe 1.5s ease-in-out infinite; border-color: var(--acc); }
  .power[data-state="connecting"] svg { color: var(--acc); }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accRgb), .34); }
    50%      { box-shadow: 0 0 0 16px rgba(var(--accRgb), 0); }
  }

  .status { font-family: var(--display); font-size: 17px; font-weight: 600; margin-top: 4px; text-align: center; }
  .detail { color: var(--dim); text-align: center; max-width: 420px; font-size: 13px; line-height: 1.5; }
  .detail.bad { color: var(--fail); }

  /* ----------------------------------------------------------- карточки */

  .first-key { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }

  .node {
    width: 100%; max-width: 420px; margin-top: 6px;
    background: var(--surf2); border: 1px solid transparent; border-radius: var(--r); padding: 12px 14px;
    display: flex; align-items: center; gap: 12px; transition: border-color .3s;
  }
  body[data-state="connected"] .node { border-color: var(--accSoft); }
  .node .mark { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); }
  body[data-state="connected"] .node .mark { background: var(--acc); }
  .node .name { font-size: 13px; }
  .node .sub { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 1px; }
  .node .ping { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: nowrap; }
  .node .ping:empty { display: none; }

  /*
    Предупреждение о прокси. Намеренно не красное: ничего не сломано, туннель
    работает. Сломано обещание — часть трафика идёт мимо, — и об этом надо
    сказать заметно, но без паники, иначе человек решит, что не подключился.
  */
  .leak {
    width: 100%; max-width: 420px; text-align: left;
    background: rgba(242,160,61,.09); border: 1px solid rgba(242,160,61,.3);
    border-radius: var(--r); padding: 12px 14px;
  }
  .leak .head { display: flex; align-items: center; gap: 9px; }
  .leak .head svg { width: 16px; height: 16px; flex: 0 0 16px; color: var(--warn); }
  .leak .title { font-weight: 600; font-size: 13px; color: var(--warn); }
  .leak .body { color: var(--dim); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .leak .act { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .leak button {
    background: rgba(242,160,61,.16); border: 1px solid rgba(242,160,61,.34);
    color: var(--warn); font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 9px; cursor: pointer;
  }
  .leak .said { color: var(--dim); font-size: 12px; }

  /*
    Текст ошибки — единственное, что человек может отправить продавцу. Общий
    запрет выделения делал его непередаваемым: оставалось переписывать с
    экрана руками или фотографировать.
  */
  #detail, .leak .body, .leak .said, .log { user-select: text; }

  .warn {
    background: rgba(255,107,122,.1); border: 1px solid rgba(255,107,122,.3);
    color: var(--fail); border-radius: var(--r); padding: 11px 15px; font-size: 13px; flex: none;
  }

  /* -------------------------------------------------------------- график */

  .chart { flex: 1; }
  .bars { flex: 1; min-height: 60px; display: flex; align-items: flex-end; gap: 2px; }
  .bars i { flex: 1; min-height: 2px; border-radius: 2px; background: var(--surf2); }
  .bars i.hot { background: var(--acc); }
  .axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--dim); }

  /* --------------------------------------------------------------- ноды */

  .list { overflow: hidden; }
  .nodes { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
  .nodes::-webkit-scrollbar { width: 8px; }
  .nodes::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  .row-node {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: var(--r); cursor: pointer;
    background: var(--surf2); border: 1px solid transparent;
    color: var(--fg); text-align: left; font: inherit; width: 100%;
  }
  .row-node:hover { border-color: var(--line); }
  .row-node[data-chosen] { border-color: var(--acc); }
  .row-node[data-current] { background: var(--accSoft); }
  .row-node .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); }
  .row-node[data-alive] .dot { background: var(--acc); }
  .row-node .grow { flex: 1; min-width: 0; }
  .row-node .name { font-size: 13px; }
  .row-node .sub { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-node .bar { width: 70px; height: 3px; border-radius: 2px; flex: none; background: var(--surf); overflow: hidden; }
  .row-node .bar i { display: block; height: 100%; background: var(--acc); }
  .row-node .ms { font-family: var(--mono); font-size: 12px; width: 56px; text-align: right; flex: none; }

  .row-fact { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: var(--r); background: var(--surf2); font-size: 13px; }
  .row-fact span:last-child { font-family: var(--mono); font-size: 11px; color: var(--acc); text-align: right; }

  /* ------------------------------------------------------------- вкладки */

  .lead { color: var(--dim); font-size: 13px; margin: 0; line-height: 1.55; }

  textarea {
    width: 100%; background: var(--surf2); color: var(--fg);
    border: 1px solid var(--line); border-radius: var(--r);
    padding: 12px 14px; font: 12px/1.5 var(--mono);
    resize: none; user-select: text; transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: var(--acc); }

  button.primary {
    background: var(--acc); color: var(--accFg); border: none;
    padding: 10px 20px; border-radius: var(--r); cursor: pointer;
    font: inherit; font-weight: 600; transition: filter .15s;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.chip {
    background: var(--surf2); color: var(--dim); border: none;
    padding: 7px 12px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 12px;
  }
  button.chip:hover { color: var(--fg); }
  button.chip:disabled { opacity: .5; cursor: default; }

  .row { display: flex; gap: 12px; align-items: center; }
  .hint { color: var(--dim); font-size: 12px; margin: 0; }
  .bad { color: var(--fail); }

  /* Ключ: карточка с фактами, как в макете, — трафик, срок, статус. */
  .keycard .facts { display: flex; gap: 32px; margin-top: 6px; }
  .keycard .fact .v { font-family: var(--mono); font-size: 16px; margin-top: 4px; }
  .keycard .host { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .badge { padding: 5px 10px; border-radius: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; background: var(--surf2); color: var(--dim); white-space: nowrap; }
  .badge.on { background: var(--accSoft); color: var(--acc); }
  .track { height: 5px; border-radius: 3px; overflow: hidden; background: var(--surf2); margin-top: 8px; }
  .track i { display: block; height: 100%; background: var(--acc); }

  /* Журнал: время отдельно от текста, как в макете. */
  .log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  .log .ln { display: flex; gap: 12px; align-items: flex-start; font-family: var(--mono); font-size: 12px; line-height: 1.5; }
  .log .ln .tm { color: var(--dim); white-space: nowrap; }

  /* Тема: пресеты — карточки с фоном пресета, чтобы выбирать по виду, а не
     по названию. */
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow-y: auto; padding-right: 4px; align-content: start; }
  .knobs { flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: var(--gap); }
  .knobs::-webkit-scrollbar { width: 8px; }
  .knobs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  .knobs .card { flex: none; }
  .lamp { position: relative; height: 110px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .lamp button { background: none; border: none; cursor: pointer; display: grid; place-items: center; }
  .lamp button i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg); opacity: .22; display: block; }
  .lamp button[aria-pressed="true"] i { width: 22px; height: 22px; opacity: 1; background: var(--acc);
    box-shadow: 0 0 0 5px var(--accSoft), 0 0 22px 4px rgba(var(--accRgb), .55); }
  .lamp .hint { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; pointer-events: none; font-size: 11px; }
  .kinds { display: flex; gap: 6px; }
  .kind { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 3px; cursor: pointer;
    border-radius: calc(var(--r) + 3px); border: 1px solid var(--line); background: transparent; font: inherit; font-size: 10px; color: var(--dim); }
  .kind i { display: block; height: 34px; border-radius: max(calc(var(--r) - 3px), 5px); }
  .kind[aria-pressed="true"] { border: 2px solid var(--acc); background: var(--accSoft); color: var(--acc); }
  .range { width: 100%; accent-color: var(--acc); }
  .code { padding: 10px 12px; border-radius: var(--r); background: var(--surf2); border: 1px dashed var(--acc);
    font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--fg); overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; cursor: copy; user-select: text; }

//
// Прямая подписка через getElementById однажды уже обрушила всё окно: правка
// разметки убрала кнопку, а подписку на неё оставила. Исключение прервало
// загрузку на середине, и не выполнилось ничего из того, что шло ниже, —
// перевод надписей, сохранение ключа, переключатель языка и, главное, опрос
// состояния. Окно осталось живым на вид и мёртвым по сути.
//
// Пропажу не заминаем: она едет в консоль, чтобы её починили, — но роняет
// теперь одну кнопку, а не всю страницу.
function on(id, event, handler) {
  const el = $(id);
  if (!el) {
    console.error("нет элемента " + id + ": обработчик не повешен");
    return;
  }
  el.addEventListener(event, handler);
}

  отстаёт молча, и человек видит вперемешку два языка. Статику разметка

let lang = "ru";
const L = () => T[lang];

function pickLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && T[saved]) return saved;
  } catch (_) { /* хранилище недоступно */ }

  const want = (navigator.languages || [navigator.language || ""]).join(",").toLowerCase();
  return /\b(ru|be|uk|kk|ky|uz|tg|hy|az)\b/.test(want) ? "ru" : "en";
}

// paintStatic заполняет всё, что не меняется от состояния: заголовки вкладок,
// подписи кнопок, тексты «о программе».
function paintStatic() {
  const d = L();
  document.documentElement.lang = d.lang;

  for (const node of document.querySelectorAll("[data-t]")) {
    const v = d[node.dataset.t];
    if (typeof v === "string") node.textContent = v;
  }
  // Внутри этих абзацев есть выделения, поэтому они идут разметкой. Источник
  // свой, из словаря — чужого текста сюда не попадает.
  for (const node of document.querySelectorAll("[data-html]")) {
    const v = d[node.dataset.html];
    if (typeof v === "string") node.innerHTML = v;
  }

  $("lang").textContent = d.switchTo;
  $("lang").title = d.switchTitle;

  paintHead();
  paintTheme();
}

async function setLang(next) {
  if (!T[next]) return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, next); } catch (_) { /* хранилище недоступно */ }
  paintStatic();
  // Программе язык нужен для своих сообщений: они приходят готовой строкой.
  try { await api("POST", "api/lang", { lang: next }); } catch (_) { /* переживём */ }
  tick();
}

let openTab = "home";

function paintHead() {
  const p = L().pages[openTab] || L().pages.home;
  $("page-title").textContent = p[0];
  $("page-sub").textContent = p[1];
}

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    openTab = tab.dataset.tab;
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t === tab)));
    document.querySelectorAll(".page").forEach((p) => {
      if (p.dataset.tab === openTab) p.setAttribute("data-open", "");
      else p.removeAttribute("data-open");
    });
    paintHead();

    // Список стран подтягиваем при открытии вкладки, а не постоянно: он
    // меняется редко, а лишний опрос стоит человеку батареи и трафика.
    if (openTab === "nodes") loadNodes();
  });
});

/*
  Тема: таблица и арифметика — общие с панелью, вшиты выше на место метки.
  Здесь только выбор и раскладка переменных на корневой элемент: остальная
  страница написана через var(--…) и перекрашивается сама.
*/

let look = Look.load();

function applyLook() {
  const t = Look.theme(look);
  document.documentElement.style.cssText = Look.vars(t);
  // Кнопка питания: вид — из темы. Ставится атрибутом, а красится в CSS.
  $("power").dataset.btn = t.btn;
  paintTheme();
}

function setLook(patch) {
  Object.assign(look, patch);
  look = Look.normalize(look);
  Look.save(look);
  applyLook();
}

// el — короткий конструктор элемента: тег, класс, содержимое.
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

// pills рисует ряд таблеток: активная — акцентом. Все ручки темы, кроме
// цветов, выбираются так.
function pills(id, keys, current, names, onPick) {
  const box = $(id);
  box.replaceChildren();
  for (const k of keys) {
    const b = el("button", "pillb", names[k] || k);
    b.type = "button";
    b.setAttribute("aria-pressed", String(current === k));
    b.addEventListener("click", () => onPick(k));
    box.append(b);
  }
}

function swatches(id, colors, current, paint, onPick) {
  const box = $(id);
  box.replaceChildren();
  for (const c of colors) {
    const b = el("button", "swatch");
    b.type = "button";
    b.style.background = paint(c);
    b.setAttribute("aria-pressed", String(current === c));
    b.addEventListener("click", () => onPick(c));
    box.append(b);
  }
}

// paintTheme рисует вкладку «Тема». Заново при каждой смене: у карточек
// подсветка выбранного, а у плиток — цвет активной, и всё это от темы.
// Прокрутка колонки ручек при этом остаётся: перерисовываются дети, а не
// сама колонка.
function paintTheme() {
  const d = L();
  const t = Look.theme(look);

  // Готовые виды — мини-макет окна в цветах каждого: боковая, кнопка, карточки.
  const presets = $("presets");
  presets.replaceChildren();
  Look.LOOKS.forEach((lk, i) => {
    const lt = Look.theme(Object.assign({}, lk, { acc: null, tint: null }));
    const b = el("button", "preset");
    b.type = "button";
    b.setAttribute("aria-pressed", String(Look.same(look, lk)));
    const pv = el("span", "pv");
    pv.style.background = lt.bgcss;
    const side = el("i"); side.style.cssText = "left:0;top:0;bottom:0;width:30%;background:" + lt.surf + ";border-right:1px solid " + lt.line;
    const ring = el("i"); ring.style.cssText = "left:52%;top:22%;width:12px;height:12px;border-radius:50%;box-sizing:border-box;border:2px solid " + lt.acc
      + (lk.btn === "solid" ? ";background:" + lt.acc : "");
    const cardA = el("i"); cardA.style.cssText = "left:38%;right:8%;bottom:8%;height:22%;border-radius:" + Math.round(lt.r * 0.25) + "px;background:" + lt.surf
      + ";border:1px solid " + lt.cardLine;
    pv.append(side, ring, cardA);
    const nm = el("span", "nm", d.themes[i] || lk.preset);
    b.append(pv, nm);
    // Вид задаёт всё разом; акцент и оттенок сбрасываются: у каждого свой.
    b.addEventListener("click", () => setLook(Object.assign({ acc: null, tint: null }, lk)));
    presets.append(b);
  });

  swatches("accents", Look.ACCENTS, t.acc, (c) => c, (c) => setLook({ acc: c }));
  swatches("tints", [null].concat(Look.ACCENTS), look.tint,
    (c) => "linear-gradient(135deg," + (c || t.acc) + "," + Look.mix(c || t.acc, "#000000", 0.6) + ")",
    (c) => setLook({ tint: c }));

  // Лампа: экран, залитый настоящим фоном; нажатие в угол переносит свет.
  const litBg = (kind, dir) => Look.theme(Object.assign({}, look, { kind, dir })).bgcss;
  const lamp = $("lamp");
  lamp.replaceChildren();
  lamp.style.background = litBg(look.kind === "flat" ? "linear" : look.kind, look.dir);
  for (const k of ["nw", "n", "ne", "w", "c", "e", "sw", "s", "se"]) {
    const b = el("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(look.dir === k));
    b.append(el("i"));
    b.addEventListener("click", () => setLook({ dir: k, kind: look.kind === "flat" ? "linear" : look.kind }));
    lamp.append(b);
  }
  lamp.append(el("span", "hint", d.themeLampHint));
  $("light-note").textContent = look.kind === "flat" ? d.themeLightOff : d.dirs[look.dir];

  const kinds = $("kinds");
  kinds.replaceChildren();
  for (const k of Look.KINDS) {
    const b = el("button", "kind");
    b.type = "button";
    b.setAttribute("aria-pressed", String(look.kind === k));
    const i = el("i");
    i.style.background = litBg(k, look.dir);
    b.append(i, el("span", null, d.kinds[k]));
    b.addEventListener("click", () => setLook({ kind: k }));
    kinds.append(b);
  }

  const depth = $("depth");
  depth.value = Math.round(look.depth * 100);
  $("depth-note").textContent = d.depths[look.depth <= 0.3 ? 0 : look.depth <= 0.5 ? 1 : look.depth <= 0.7 ? 2 : look.depth <= 0.85 ? 3 : 4];

  pills("radii", Object.keys(Look.RADII), look.radius, d.radii, (k) => setLook({ radius: k }));
  pills("densities", Object.keys(Look.DENSITY), look.density, d.density, (k) => setLook({ density: k }));
  pills("cardKinds", Look.CARDS, look.card, d.cardKinds, (k) => setLook({ card: k }));
  pills("buttons", Look.BUTTONS, look.btn, d.buttons, (k) => setLook({ btn: k }));
  pills("glows", Object.keys(Look.GLOWS), look.glow, d.glows, (k) => setLook({ glow: k }));

  // Профили — три слота с кодами. Пустой слот занимается кнопкой «сохранить
  // сюда», занятый по нажатию применяется.
  const slots = Look.loadProfiles();
  const profiles = $("profiles");
  profiles.replaceChildren();
  slots.forEach((code, i) => {
    const b = el("button", "pillb", (code ? d.themeSlotFull : d.themeSlotEmpty) + " " + (i + 1));
    b.type = "button";
    b.setAttribute("aria-pressed", String(profileSlot === i));
    b.addEventListener("click", () => {
      profileSlot = i;
      const st = code ? Look.decode(code) : null;
      if (st) setLook(st); else paintTheme();
    });
    profiles.append(b);
  });

  $("theme-code").textContent = Look.encode(look);
  $("theme-code").title = d.themeCopy;
  $("code-in").placeholder = d.themeCodePlaceholder;
}

// Слот профиля, в который пишет «сохранить сюда».
let profileSlot = 0;

on("depth", "input", (e) => setLook({ depth: Number(e.target.value) / 100 }));
on("profile-save", "click", () => {
  const slots = Look.loadProfiles();
  slots[profileSlot] = Look.encode(look);
  Look.saveProfiles(slots);
  paintTheme();
});
on("theme-random", "click", () => {
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  setLook({
    preset: pick(Object.keys(Look.PRESETS)), acc: pick([null].concat(Look.ACCENTS)), tint: pick([null, null].concat(Look.ACCENTS)),
    kind: pick(["linear", "radial", "aurora"]), dir: pick(Object.keys(Look.DIRS)),
    depth: Math.round((0.2 + Math.random() * 0.75) * 100) / 100,
    radius: pick(Object.keys(Look.RADII)), density: pick(Object.keys(Look.DENSITY)),
    btn: pick(Look.BUTTONS), glow: pick(Object.keys(Look.GLOWS)), card: pick(Look.CARDS),
  });
});
on("theme-code", "click", () => {
  if (navigator.clipboard) navigator.clipboard.writeText(Look.encode(look)).catch(() => {});

on("code-in", "change", (e) => {

/* ------------------------------------------------------------- прокси */

/*
  Предупреждение о системном прокси.

  Показываем только при поднятом туннеле, и вот почему: пока туннель выключен,
  прокси никому не мешает и говорить не о чем. А вот когда окно написало «весь
  трафик компьютера идёт через туннель», это обещание должно быть верным — или
  рядом должно стоять честное «кроме вот этого».

  Кнопка снимает только настройку системы. Переменные окружения живут в уже
  запущенных программах, наша правка до них не дойдёт, и обещать обратное
  нечестно — так и пишем.
*/
function showProxy(s) {
  const box = $("proxy-warn");
  const show = s.state === "connected" && !!s.proxy;

  box.hidden = !show;
  if (!show) return;

  $("proxy-text").textContent = s.proxy;

  // Переменные окружения снять из реестра нельзя, поэтому и кнопку не
  // показываем: кнопка, которая не помогает, хуже её отсутствия.
  const button = $("proxy-off");
  button.hidden = s.proxy_env;
  $("proxy-care").hidden = s.proxy_env;
  $("proxy-msg").textContent = s.proxy_env
    ? L().proxyEnv
    : "";
}

async function dropProxy() {
  const button = $("proxy-off");
  const said = $("proxy-msg");

  button.disabled = true;
  said.textContent = L().proxyRemoving;
  try {
    const after = await api("POST", "api/proxy/off");
    render(after);
    if (!after.proxy) {
      said.textContent = L().proxyGone;
    }
  } catch (e) {
    said.textContent = e.message;
  } finally {
    button.disabled = false;
  }
}

/* ----------------------------------------------------------------- обмен */

// Всё лежит под одноразовым ключом в адресе: /<ключ>/. Запросы поэтому
// относительные — они сами попадают куда надо, а ключ нигде не дублируется.
const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";

async function api(method, path, body) {
  const res = await fetch(base + path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : {};
  if (!res.ok) throw new Error(data.error || (L().err + res.status));
  return data;
}

/* ----------------------------------------------------------- выбор ноды */

// Список стран рисуем сами, без шаблонов: строк единицы, а каждая новая
// зависимость в окне — это то, что придётся вшивать и обновлять.
//
// Текст не вставляем разметкой: имя и страну пишет продавец, и одна кавычка
// в названии сервера превратилась бы в сломанную страницу, а то и хуже.
function paintNodes(list) {
  const box = $("nodes-list");
  box.replaceChildren();

  const d = L();
  if (!list || list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = d.nodesNone;
    box.append(empty);
    return;
  }

  const row = (opts) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "row-node";
    if (opts.alive) b.setAttribute("data-alive", "");
    if (opts.current) b.setAttribute("data-current", "");
    if (opts.chosen) b.setAttribute("data-chosen", "");

    const dot = document.createElement("span");
    dot.className = "dot";

    const grow = document.createElement("div");
    grow.className = "grow";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = opts.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = opts.sub;
    grow.append(name, sub);

    // Полоска качества: замер в миллисекундах на глаз не сравнить, а длина —
    // сравнивается. Триста миллисекунд и хуже — пусто.
    const bar = document.createElement("span");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = opts.ms > 0 ? Math.max(0, Math.min(100, Math.round((1 - opts.ms / 300) * 100))) + "%" : "0";
    bar.append(fill);

    const ms = document.createElement("div");
    ms.className = "ms";
    ms.textContent = opts.ms > 0 ? opts.ms + d.ms : "";

    b.append(dot, grow, bar, ms);
    b.addEventListener("click", () => chooseNode(opts.id));
    return b;
  };

  // Автовыбор — первой строкой: это состояние по умолчанию, и вернуться к
  // нему человек должен уметь так же легко, как уйти.
  const chosenAny = list.some((n) => n.chosen);
  const fastest = list.filter((n) => n.alive && n.ms > 0).sort((a, b) => a.ms - b.ms)[0];
  box.append(row({
    id: 0,
    name: d.nodesAuto,
    sub: fastest ? d.nodesAutoSub + " — " + (fastest.country || fastest.name) : d.nodesAutoSub,
    ms: 0,
    alive: true,
    chosen: !chosenAny,
    current: false,
  }));

  for (const n of list) {
    // Что показываем под именем: сначала то, где трафик, потом выбор.
    // Это разные вещи: выбранная нода могла замолчать, и ядро уехало на живую.
    let sub = n.country && n.country !== n.name ? n.name : "";
    const marks = [];
    if (n.current) marks.push(d.nodesCurrent);
    if (n.chosen) marks.push(d.nodesChosen);
    if (!n.alive && !n.current) marks.push(n.ms > 0 ? d.nodesDead : d.nodesUnknown);
    if (marks.length) sub = sub ? sub + " · " + marks.join(" · ") : marks.join(" · ");

    box.append(row({
      id: n.id,
      name: n.country || n.name,
      sub,
      ms: n.ms > 0 ? n.ms : 0,
      alive: n.alive,
      current: n.current,
      chosen: n.chosen,
    }));
  }
}

async function loadNodes() {
  try {
    const data = await api("GET", "api/nodes");
    paintNodes(data.nodes);
  } catch (e) {
    $("nodes-msg").textContent = e.message;
  }
}

async function chooseNode(id) {
  const msg = $("nodes-msg");
  msg.textContent = L().nodesSwitching;
  try {
    const data = await api("POST", "api/nodes/select", { id });
    paintNodes(data.nodes);
    msg.textContent = "";
  } catch (e) {

  }
}

on("nodes-measure", "click", async () => {
  const msg = $("nodes-msg");
  const button = $("nodes-measure");
  msg.textContent = L().nodesMeasuring;
  button.disabled = true;
  try {
    const data = await api("POST", "api/nodes/measure");

  } catch (e) {

  } finally {
    button.disabled = false;
  }
});

/* -------------------------------------------------------------- величины */

function bytes(n) {
  const units = L().bytes;
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? Math.round(n) : n.toFixed(1)) + " " + units[i];
}

function clock(seconds) {
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  const two = (n) => String(n).padStart(2, "0");
  return two(h) + ":" + two(m) + ":" + two(s);
}

// keyParts достаёт из ссылки то, что можно показать: хост подписки и метку.
// Сам ключ — между «//» и «@» — на экран не выводится: он и так в поле ниже.
function keyParts(link) {
  const m = /^marvia:\/\/[^@]*@([^/#?]+)[^#]*(?:#(.*))?$/.exec((link || "").trim());
  if (!m) return null;
  let label = "";
  try { label = decodeURIComponent(m[2] || ""); } catch (_) { label = m[2] || ""; }
  return { host: m[1], label };
}

/* ------------------------------------------------------------- отрисовка */

// Названия состояний живут в словаре: их видит человек, а не программа.

let prev = null;

/*
  Последняя ошибка, показанная в ответ на нажатие.

  Опрос состояния приходит раз в секунду и переписывает ту же строку, поэтому
  всё, что программа отвечает сразу — «не задана ссылка доступа», «нужны права
  администратора», — вспыхивало и пропадало быстрее, чем человек успевал
  прочитать. Он видел красный проблеск и нажимал снова.
*/
let complaint = null;

function complain(text) {
  complaint = { text, until: Date.now() + 12000 };
  $("detail").textContent = text;
}

function complaintNow() {
  if (complaint && Date.now() < complaint.until) return complaint.text;
  complaint = null;
  return null;
}

// paintBars рисует час трафика: 60 столбиков, самый высокий — самая
// нагруженная минута. Столбики от четырёх пятых максимума — акцентом, как в
// макете: глазу нужна точка отсчёта, а не ровная гребёнка.
function paintBars(history) {
  const box = $("bars");
  const list = Array.isArray(history) && history.length ? history : new Array(60).fill(0);
  const max = Math.max(1, ...list);
  const total = list.reduce((a, v) => a + v, 0);

  if (box.children.length !== list.length) {
    box.replaceChildren(...list.map(() => document.createElement("i")));
  }
  list.forEach((v, i) => {
    const bar = box.children[i];
    bar.style.height = Math.max(2, Math.round((v / max) * 100)) + "%";
    bar.classList.toggle("hot", v > 0 && v >= max * 0.8);
  });
  $("hour-total").textContent = total > 0 ? bytes(total) : "";
}

function render(s) {
  const d = L();
  document.body.dataset.state = s.state;
  $("status").textContent = d.state[s.state] || s.state;
  $("pill-text").textContent = d.pill[s.state] || s.state;
  $("power").dataset.state = s.state;
  // Во время подключения кнопка была заблокирована, а обработчик отмену умел:
  // человек полторы минуты смотрел на замершее окно и не мог ничего сделать.
  $("power").disabled = !s.elevated;
  $("power").title =
    s.state === "connecting" ? d.power.cancel
    : s.state === "connected" || s.state === "stalled" ? d.power.off
    : d.power.on;
  $("elev-warn").hidden = s.elevated;
  $("version").textContent = s.version ? "v" + s.version : "";

  const detail = $("detail");

  // Пока подключаемся или подключились, жалоба уже неактуальна.
  if (s.state === "connecting" || s.state === "connected") complaint = null;

  const said = complaintNow();
  detail.classList.toggle("bad", s.state === "failed" || s.state === "stalled" || said !== null);
  if (said !== null) detail.textContent = said;
  else if (s.state === "failed") detail.textContent = s.reason || d.detail.unknown;
  else if (s.state === "stalled") detail.textContent = s.reason || d.detail.stalled;
  else if (s.state === "connecting") detail.textContent = d.detail.connecting;
  else if (s.state === "connected") detail.textContent = d.detail.connected;
  else if (!s.has_account) detail.textContent = d.detail.noKey;
  else detail.textContent = d.detail.idle;

  // Поле ключа на первом экране — только пока ключа нет.
  $("first-key").hidden = s.has_account;

  // Подписка: до какого числа и сколько осталось — в боковой и на вкладке ключа.
  const parts = [];
  if (s.until) parts.push(d.until + s.until);
  if (s.limit_bytes > 0) parts.push(d.left + bytes(s.left_bytes || 0));
  $("sub-title").textContent = s.has_account ? d.subOn : d.subOff;
  $("subscription").textContent = parts.length ? parts.join(" · ") : (s.has_account ? d.subAfter : d.subNoKey);

  const up = s.state === "connected" || s.state === "stalled";
  $("key-state").textContent = s.has_account ? d.keyOn : d.keyOff;
  $("key-state").classList.toggle("on", s.has_account);
  $("f-until").textContent = s.until ? s.until : (up ? d.keyNoUntil : "—");
  $("f-traffic").textContent = s.limit_bytes > 0 ? bytes(s.left_bytes || 0) + " / " + bytes(s.limit_bytes) : (up ? d.keyNoLimit : "—");
  $("f-fill").style.width = s.limit_bytes > 0 ? Math.round(100 * Math.max(0, s.left_bytes || 0) / s.limit_bytes) + "%" : "0";
  $("key-note").textContent = up ? "" : d.keyNote;

  if (s.node) {
    $("node-name").textContent = s.node;
    $("node-addr").textContent = s.address;
    $("node-ping").textContent = s.ping_ms ? s.ping_ms + d.ms : "";
    $("rule-now").textContent = s.node;
    $("k-ping").textContent = s.ping_ms ? s.ping_ms + d.ms : "—";
  } else {
    $("node-name").textContent = d.noNode;
    $("node-addr").textContent = d.noNodeSub;
    $("node-ping").textContent = "";
    $("rule-now").textContent = "—";
    $("k-ping").textContent = "—";
  }

  // Сессия считается здесь, по моменту подъёма: секунды тикают сами, и
  // программе незачем слать готовую строку раз в секунду.
  $("k-session").textContent = up && s.since ? clock(Math.max(0, Math.floor(Date.now() / 1000) - s.since)) : "—";

  showProxy(s);

  // Скорость считаем сами, по разнице между опросами: программе незачем
  // помнить, когда её спрашивали в прошлый раз.
  const now = Date.now();
  if (prev && now > prev.t) {
    const dt = (now - prev.t) / 1000;
    $("s-down").textContent = bytes(Math.max(0, (s.down - prev.down) / dt)) + d.perSec;
    $("s-up").textContent = bytes(Math.max(0, (s.up - prev.up) / dt)) + d.perSec;
  }
  prev = { t: now, up: s.up || 0, down: s.down || 0 };

  $("t-down").textContent = bytes(s.down || 0);
  $("t-up").textContent = bytes(s.up || 0);

  paintBars(s.history);
}

// paintKeyCard — заголовок карточки ключа: метка и хост из ссылки.
function paintKeyCard(link) {
  const d = L();
  const parts = keyParts(link);
  $("key-label").textContent = parts && parts.label ? parts.label : d.keyTitle;
  $("key-host").textContent = parts ? parts.host : d.keyNoHost;
}

// paintLog раскладывает строки журнала: время отдельно, текст отдельно.
// Строка приходит как «ЧЧ:ММ:СС  текст» — программа так их и пишет.
function paintLog(lines) {
  const box = $("log");
  const list = lines || [];
  if (list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = L().logEmpty;
    box.replaceChildren(empty);
    return;
  }
  // Перерисовываем только когда число строк изменилось: журнал опрашивается
  // каждую секунду, а прокрутку человек ставит руками.
  if (box.dataset.count === String(list.length)) return;
  box.dataset.count = String(list.length);

  const stuck = box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
  box.replaceChildren(...list.map((line) => {
    const ln = document.createElement("div");
    ln.className = "ln";
    const tm = document.createElement("span");
    tm.className = "tm";
    const tx = document.createElement("span");
    const m = /^(\d\d:\d\d:\d\d)\s+(.*)$/s.exec(line);
    tm.textContent = m ? m[1] : "";
    tx.textContent = m ? m[2] : line;
    ln.append(tm, tx);
    return ln;
  }));
  if (stuck) box.scrollTop = box.scrollHeight;
}

/* --------------------------------------------------------------- действия */

let busy = false;

on("power", "click", async () => {
  if (busy) return;
  busy = true;
  try {
    const s = await api("GET", "api/state");
    if (s.state === "connected" || s.state === "connecting") await api("POST", "api/disconnect");
    else await api("POST", "api/connect");
    await tick();
  } catch (err) {
    complain(err.message);
    $("detail").classList.add("bad");
  } finally {
    busy = false;
  }
});

on("proxy-off", "click", dropProxy);

on("save", "click", async () => {
  const msg = $("save-msg");
  msg.className = "hint";
  try {
    await api("POST", "api/account", { link: $("account").value });
    msg.textContent = L().keySaved;
    paintKeyCard($("account").value);
    await tick();
  } catch (err) {
    msg.className = "hint bad";
    msg.textContent = err.message;
  }
});

// Тот же обработчик для поля на первом экране.
//
// Оно там ровно до первого сохранённого ключа: дальше человек про него
// забудет, а место на главном экране дорогое.
on("first-save", "click", async () => {
  const msg = $("first-msg");
  msg.className = "hint";
  try {
    const link = $("first-account").value;
    await api("POST", "api/account", { link });
    $("account").value = link;
    paintKeyCard(link);
    msg.textContent = L().keySaved;
    await tick();
  } catch (err) {
    msg.className = "hint bad";
    msg.textContent = err.message;
  }
});

/* ----------------------------------------------------------------- опрос */

async function tick() {
  try {
    render(await api("GET", "api/state"));
    const log = await api("GET", "api/log");
    paintLog(log.lines);
  } catch (err) {
    $("status").textContent = L().noLink;
  }
}

lang = pickLang();
applyLook();
paintStatic();
on("lang", "click", () => setLang(lang === "ru" ? "en" : "ru"));

// Программе язык сообщаем сразу: её сообщения приходят готовой строкой, и до
// первого такого сообщения она должна знать, на каком языке его собирать.
api("POST", "api/lang", { lang }).catch(() => {});

api("GET", "api/account").then((a) => {
  $("account").value = a.link || "";
  paintKeyCard(a.link);
}).catch(() => {});
tick();
setInterval(tick, 1000);
</script>
