<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Marvia speed measurements: direct versus VP1 and local loopback benchmark</title>
  <desc id="desc">A single Dubai to Helsinki download measured 86 megabits per second directly and 83 through VP1. A separate local VP1 benchmark on a Ryzen 7 7700 measured 521 to 702 megabytes per second. The two tests use different conditions and are not directly comparable.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1b3340" stroke-width="1"/></pattern>
    <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#2f888f"/><stop offset="1" stop-color="#74e0d2"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#09141b"/><rect width="1200" height="520" rx="18" fill="url(#grid)" opacity=".75"/>
  <rect x="20" y="20" width="1160" height="480" rx="12" fill="none" stroke="#38505c"/>
  <path d="M20 72H1180M20 448H1180" stroke="#38505c"/>
  <circle cx="43" cy="47" r="5" fill="#66d5d1"/><circle cx="60" cy="47" r="5" fill="#526874"/><circle cx="77" cy="47" r="5" fill="#526874"/>
  <text x="102" y="53" fill="#eaf4f5" font-family="Consolas,monospace" font-size="21" font-weight="700">MARVIA / PERFORMANCE RECORD</text>
  <text x="1145" y="52" text-anchor="end" fill="#8ea6b0" font-family="Consolas,monospace" font-size="15">TWO DIFFERENT TESTS</text>

  <text x="56" y="112" fill="#66d5d1" font-family="Consolas,monospace" font-size="18" font-weight="700">A / REAL ROUTE</text>
  <text x="56" y="139" fill="#a2bac3" font-family="Consolas,monospace" font-size="15">Dubai → Helsinki · 2026-09-14 · one stream · same file</text>
  <g stroke="#31505b" stroke-width="1"><path d="M240 166V348M335 166V348M430 166V348M525 166V348M620 166V348"/></g>
  <g fill="#69808b" font-family="Consolas,monospace" font-size="14"><text x="240" y="367" text-anchor="middle">0</text><text x="335" y="367" text-anchor="middle">25</text><text x="430" y="367" text-anchor="middle">50</text><text x="525" y="367" text-anchor="middle">75</text><text x="620" y="367" text-anchor="middle">100</text></g>
  <g font-family="Consolas,monospace" font-size="18" fill="#eaf4f5"><text x="56" y="224">DIRECT</text><text x="56" y="311">VP1</text></g>
  <rect x="240" y="190" width="327" height="46" rx="4" fill="#52636c"/><rect x="240" y="277" width="315" height="46" rx="4" fill="url(#bar)"/>
  <g font-family="Consolas,monospace" font-size="23" font-weight="700"><text x="580" y="220" fill="#f3f8f9">86 Mb/s</text><text x="568" y="307" fill="#76e4d5">83 Mb/s</text></g>
  <path d="M55 396H653" stroke="#38505c"/>
  <text x="56" y="425" fill="#b7c9d0" font-family="Consolas,monospace" font-size="16">VP1 / DIRECT = 96.5% · one observation, not a guarantee</text>

  <path d="M694 93V430" stroke="#38505c"/>
  <text x="724" y="112" fill="#66d5d1" font-family="Consolas,monospace" font-size="18" font-weight="700">B / LOCAL CODE PATH</text>
  <text x="724" y="139" fill="#a2bac3" font-family="Consolas,monospace" font-size="15">Ryzen 7 7700 · Windows · TCP loopback · 3 runs</text>
  <text x="724" y="203" fill="#f2f7f8" font-family="Consolas,monospace" font-size="42" font-weight="700">638 <tspan font-size="22">MB/s</tspan></text>
  <text x="724" y="235" fill="#a2bac3" font-family="Consolas,monospace" font-size="16">median VP1 transfer · 64 KiB writes</text>
  <path d="M724 282H1123" stroke="#36535d" stroke-width="8" stroke-linecap="round"/>
  <path d="M812 282H1089" stroke="#66d5d1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="962" cy="282" r="12" fill="#e8fffb" stroke="#66d5d1" stroke-width="4"/>
  <text x="724" y="322" fill="#a2bac3" font-family="Consolas,monospace" font-size="15">range: 521–702 MB/s · not internet speed</text>
  <text x="724" y="375" fill="#f2f7f8" font-family="Consolas,monospace" font-size="20">No matched competitor measurements</text>
  <text x="724" y="405" fill="#a2bac3" font-family="Consolas,monospace" font-size="16">Same hardware + route required for ranking</text>

  <text x="56" y="478" fill="#819aa5" font-family="Consolas,monospace" font-size="14">Method, raw runs and limitations → docs/performance.md</text>
  <text x="1145" y="478" text-anchor="end" fill="#66d5d1" font-family="Consolas,monospace" font-size="16">M / 02</text>
</svg>
