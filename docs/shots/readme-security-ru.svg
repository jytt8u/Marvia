<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">VP1: защита отдельным слоем</title>
<desc id="desc">Noise проверяет ключ ноды и шифрует данные внутри TLS. Сравнение механизмов, не рейтинг безопасности. Дополнительный слой не доказывает превосходство.</desc>
<rect width="1600" height="1200" fill="#191d22"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="56" y="58" font-size="20" fill="#adb7c3" font-weight="600" text-anchor="start">MARVIA / SECURITY ARCHITECTURE</text>
<text x="56" y="130" font-size="48" fill="#edf1f5" font-weight="650" text-anchor="start">VP1: защита отдельным слоем</text>
<text x="56" y="178" font-size="27" fill="#adb7c3" font-weight="400" text-anchor="start">Noise проверяет ключ ноды и шифрует данные внутри TLS.</text>
<rect x="260" y="226" width="1080" height="208" rx="12" fill="#21272e" stroke="#687684"/>
<text x="292" y="265" font-size="25" fill="#adb7c3" font-weight="400" text-anchor="start">TLS 1.3 · внешний защищённый канал</text>
<rect x="292" y="284" width="1016" height="122" rx="12" fill="#303944" stroke="#a9b6c3"/>
<text x="324" y="327" font-size="28" fill="#edf1f5" font-weight="600" text-anchor="start">Noise IK · ключи клиента и ноды</text>
<text x="324" y="372" font-size="25" fill="#adb7c3" font-weight="400" text-anchor="start">ChaCha20-Poly1305 · данные и контроль целостности</text>
<path d="M185 336H260" fill="none" stroke="#46505b" stroke-width="2"/>
<path d="M1340 336H1415" fill="none" stroke="#46505b" stroke-width="2"/>
<text x="114" y="346" font-size="29" fill="#edf1f5" font-weight="400" text-anchor="middle">Клиент</text>
<text x="1480" y="346" font-size="29" fill="#edf1f5" font-weight="400" text-anchor="middle">Нода</text>
<text x="56" y="483" font-size="24" fill="#adb7c3" font-weight="400" text-anchor="start">Показан участок клиент → нода. Для защиты до сайта нужен HTTPS самого сайта.</text>
<text x="80" y="554" font-size="21" fill="#adb7c3" font-weight="600" text-anchor="start">СТЕК</text>
<text x="442" y="554" font-size="21" fill="#adb7c3" font-weight="600" text-anchor="start">ЗАЩИТА ДАННЫХ</text>
<text x="784" y="554" font-size="21" fill="#adb7c3" font-weight="600" text-anchor="start">ПРОВЕРКА СЕРВЕРА</text>
<text x="1170" y="554" font-size="21" fill="#adb7c3" font-weight="600" text-anchor="start">ДОСТУП КЛИЕНТА</text>
<rect x="56" y="575" width="1488" height="80" rx="8" fill="#303944" stroke="#8795a4"/>
<text x="80" y="624" font-size="28" fill="#edf1f5" font-weight="650" text-anchor="start">VP1 + TLS</text>
<text x="442" y="624" font-size="27" fill="#edf1f5" font-weight="400" text-anchor="start">Noise + TLS</text>
<text x="784" y="609" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">Ключ ноды +</text>
<text x="784" y="639" font-size="23" fill="#adb7c3" font-weight="400" text-anchor="start">TLS-сертификат</text>
<text x="1170" y="609" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">Ключ клиента</text>
<text x="1170" y="639" font-size="23" fill="#adb7c3" font-weight="400" text-anchor="start">X25519</text>
<path d="M56 659H1544" fill="none" stroke="#46505b" stroke-width="2"/>
<text x="80" y="708" font-size="28" fill="#edf1f5" font-weight="500" text-anchor="start">WireGuard</text>
<text x="442" y="708" font-size="27" fill="#edf1f5" font-weight="400" text-anchor="start">Noise IKpsk2</text>
<text x="784" y="693" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">Ключ узла</text>
<text x="784" y="723" font-size="23" fill="#adb7c3" font-weight="400" text-anchor="start">X25519</text>
<text x="1170" y="693" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">Ключ клиента</text>
<text x="1170" y="723" font-size="23" fill="#adb7c3" font-weight="400" text-anchor="start">X25519</text>
<path d="M56 743H1544" fill="none" stroke="#46505b" stroke-width="2"/>
<text x="80" y="792" font-size="28" fill="#edf1f5" font-weight="500" text-anchor="start">VLESS + TLS*</text>
<text x="442" y="792" font-size="27" fill="#edf1f5" font-weight="400" text-anchor="start">TLS</text>
<text x="784" y="792" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">TLS-сертификат</text>
<text x="1170" y="792" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">UUID внутри TLS</text>
<path d="M56 827H1544" fill="none" stroke="#46505b" stroke-width="2"/>
<text x="80" y="876" font-size="28" fill="#edf1f5" font-weight="500" text-anchor="start">VLESS + REALITY*</text>
<text x="442" y="876" font-size="27" fill="#edf1f5" font-weight="400" text-anchor="start">REALITY / TLS</text>
<text x="784" y="876" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">Ключ REALITY</text>
<text x="1170" y="876" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">UUID + shortId</text>
<path d="M56 911H1544" fill="none" stroke="#46505b" stroke-width="2"/>
<text x="80" y="960" font-size="28" fill="#edf1f5" font-weight="500" text-anchor="start">Trojan + TLS</text>
<text x="442" y="960" font-size="27" fill="#edf1f5" font-weight="400" text-anchor="start">TLS</text>
<text x="784" y="960" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">TLS-сертификат</text>
<text x="1170" y="945" font-size="26" fill="#edf1f5" font-weight="400" text-anchor="start">Пароль: SHA-224</text>
<text x="1170" y="975" font-size="23" fill="#adb7c3" font-weight="400" text-anchor="start">внутри TLS</text>
<text x="56" y="1040" font-size="22" fill="#adb7c3" font-weight="400" text-anchor="start">* VLESS показан с encryption=&quot;none&quot;. Режим VLESS Encryption добавляет собственное шифрование.</text>
<text x="56" y="1074" font-size="22" fill="#adb7c3" font-weight="400" text-anchor="start">Предполагаются корректные ключи и проверка TLS-сертификатов. Маскировка не гарантирует обход DPI.</text>
<text x="56" y="1108" font-size="22" fill="#adb7c3" font-weight="400" text-anchor="start">Сравнение механизмов, не рейтинг безопасности. Дополнительный слой не доказывает превосходство.</text>
<path d="M56 1135H1544" fill="none" stroke="#46505b" stroke-width="2"/>
<text x="56" y="1173" font-size="20" fill="#adb7c3" font-weight="400" text-anchor="start">Источники и ограничения: docs/security-comparison.md · 26.09.2026</text>
</g>
</svg>
