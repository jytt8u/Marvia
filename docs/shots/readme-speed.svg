<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img" aria-labelledby="title desc">
  <title id="title">Сравнение прямого VPN-подключения и подключения через CDN</title>
  <desc id="desc">При прямом соединении клиент отправляет трафик ноде. При соединении через CDN появляется дополнительный участок. Панель не участвует в передаче пакетов в обоих случаях.</desc>
  <rect x="1" y="1" width="998" height="343" rx="28" fill="#202326" stroke="#464b50" stroke-width="2"/>
  <text x="42" y="52" fill="#f3f5f7" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Что меняет скорость</text>
  <text x="42" y="82" fill="#b9c2ca" font-family="Segoe UI,Arial,sans-serif" font-size="18">Путь пакетов, транспорт, сеть и сервер — не название панели.</text>
  <rect x="42" y="106" width="916" height="94" rx="18" fill="#30353a" stroke="#5b6269"/>
  <text x="64" y="141" fill="#f3f5f7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">НАПРЯМУЮ</text>
  <text x="261" y="163" fill="#e8edf1" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Клиент</text>
  <path d="M356 155 H477" stroke="#d7dfe7" stroke-width="4"/>
  <path d="M466 146 L480 155 L466 164" fill="none" stroke="#d7dfe7" stroke-width="4"/>
  <text x="501" y="163" fill="#e8edf1" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Нода</text>
  <path d="M574 155 H695" stroke="#d7dfe7" stroke-width="4"/>
  <path d="M684 146 L698 155 L684 164" fill="none" stroke="#d7dfe7" stroke-width="4"/>
  <text x="717" y="163" fill="#e8edf1" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Интернет</text>
  <rect x="42" y="220" width="916" height="94" rx="18" fill="#30353a" stroke="#5b6269"/>
  <text x="64" y="255" fill="#f3f5f7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">ЧЕРЕЗ CDN</text>
  <text x="261" y="277" fill="#e8edf1" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Клиент</text>
