<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Marvia architecture: access control and encrypted data path</title>
  <desc id="desc">The owner configures the panel, the panel synchronizes access to the node, while Android and Windows clients send encrypted traffic directly through the node to the internet.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1b3340" stroke-width="1"/></pattern>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#66d5d1" stroke-width="2"/></marker>
    <marker id="violet-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#ac91f7" stroke-width="2"/></marker>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#211c35"/><stop offset="1" stop-color="#151c2d"/></linearGradient>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#09141b"/>
  <rect width="1200" height="560" rx="18" fill="url(#grid)" opacity=".75"/>
  <rect x="20" y="20" width="1160" height="520" rx="12" fill="none" stroke="#38505c"/>
  <path d="M20 71H1180M20 441H1180" stroke="#38505c"/>
  <circle cx="43" cy="46" r="5" fill="#66d5d1"/><circle cx="60" cy="46" r="5" fill="#526874"/><circle cx="77" cy="46" r="5" fill="#526874"/>
  <text x="102" y="52" fill="#eaf4f5" font-family="Consolas,monospace" font-size="21" font-weight="700">MARVIA / SYSTEM TOPOLOGY</text>
  <text x="1145" y="51" text-anchor="end" fill="#8ea6b0" font-family="Consolas,monospace" font-size="15">CONTROL ≠ DATA</text>

  <text x="56" y="110" fill="#c3aaff" font-family="Consolas,monospace" font-size="16" letter-spacing="2">01 / CONTROL PLANE</text>
  <path d="M225 91H1138" stroke="#38505c" stroke-dasharray="5 6"/>
  <g fill="url(#panel)" stroke="#8069bb" stroke-width="1.5">
    <rect x="55" y="144" width="250" height="118" rx="8"/>
    <rect x="475" y="144" width="250" height="118" rx="8"/>
    <rect x="895" y="144" width="250" height="118" rx="8"/>
  </g>
  <g font-family="Consolas,monospace">
    <text x="77" y="173" fill="#c3aaff" font-size="16">ADMIN / BOT</text><text x="77" y="209" fill="#f2f7f8" font-size="24" font-weight="700">Access policy</text><text x="77" y="239" fill="#a9a6c4" font-size="15">keys · quotas · devices</text>
    <text x="497" y="173" fill="#c3aaff" font-size="16">PANEL / API</text><text x="497" y="209" fill="#f2f7f8" font-size="24" font-weight="700">Entitlements</text><text x="497" y="239" fill="#a9a6c4" font-size="15">sync · audit · updates</text>
    <text x="917" y="173" fill="#c3aaff" font-size="16">NODE / GATE</text><text x="917" y="209" fill="#f2f7f8" font-size="24" font-weight="700">Authorize</text><text x="917" y="239" fill="#a9a6c4" font-size="15">24 h encrypted snapshot</text>
  </g>
  <path d="M307 203H457M727 203H877" stroke="#ac91f7" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#violet-arrow)"/>
  <text x="381" y="192" fill="#d9c9ff" text-anchor="middle" font-family="Consolas,monospace" font-size="14">API</text>
  <text x="802" y="192" fill="#d9c9ff" text-anchor="middle" font-family="Consolas,monospace" font-size="14">SYNC</text>

  <text x="56" y="314" fill="#66d5d1" font-family="Consolas,monospace" font-size="16" letter-spacing="2">02 / DATA PLANE</text>
  <path d="M205 296H1138" stroke="#38505c" stroke-dasharray="5 6"/>
  <path d="M1020 265V336" stroke="#4b6f79" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#0d252c" stroke="#66d5d1" stroke-width="2"><rect x="55" y="344" width="250" height="68" rx="8"/><rect x="475" y="344" width="250" height="68" rx="8"/><rect x="895" y="344" width="250" height="68" rx="8"/></g>
  <g fill="#e9fbfa" font-family="Consolas,monospace" font-size="22" font-weight="700"><text x="180" y="386" text-anchor="middle">Android / Windows</text><text x="600" y="386" text-anchor="middle">VPN node</text><text x="1020" y="386" text-anchor="middle">Internet</text></g>
  <path d="M310 378H457M730 378H877" stroke="#66d5d1" stroke-width="4" marker-end="url(#cyan-arrow)"/>
  <text x="384" y="362" fill="#66d5d1" text-anchor="middle" font-family="Consolas,monospace" font-size="14">VP1 / TLS</text>
  <text x="804" y="362" fill="#66d5d1" text-anchor="middle" font-family="Consolas,monospace" font-size="14">PACKETS</text>

  <text x="56" y="478" fill="#9bb3bc" font-family="Consolas,monospace" font-size="17">The panel grants access. It never forwards VPN packets.</text>
  <text x="56" y="510" fill="#69808b" font-family="Consolas,monospace" font-size="14">Protocol and trust-boundary details → docs/architecture.md</text>
  <text x="1145" y="510" text-anchor="end" fill="#66d5d1" font-family="Consolas,monospace" font-size="16">M / 01</text>
</svg>
