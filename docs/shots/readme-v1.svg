<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">MARVIA 1.0</title>
  <desc id="desc">Graphite release banner with a large 1.0 and a technical route diagram.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#252a31"/>
      <stop offset=".56" stop-color="#171b20"/>
      <stop offset="1" stop-color="#0e1115"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f3f5"/>
      <stop offset=".48" stop-color="#c1cad4"/>
      <stop offset="1" stop-color="#8995a2"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#abb5c0" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="278" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#background)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <path d="M0 36H1200M0 244H1200" stroke="#59636f" stroke-opacity=".48"/>
    <path d="M42 0V280M1158 0V280" stroke="#59636f" stroke-opacity=".22"/>
    <g fill="none" stroke="#aab4c1" stroke-opacity=".19">
      <circle cx="1083" cy="140" r="108"/>
      <circle cx="1083" cy="140" r="77"/>
      <circle cx="1083" cy="140" r="46"/>
    </g>
    <path d="M625 166C680 166 684 102 749 102S814 174 885 174s100-85 198-85" fill="none" stroke="#aeb8c4" stroke-opacity=".42" stroke-width="1.5"/>
    <g fill="#c5ced8">
      <circle cx="625" cy="166" r="4"/><circle cx="749" cy="102" r="4"/>
      <circle cx="885" cy="174" r="4"/><circle cx="1083" cy="89" r="4"/>
    </g>
    <text x="62" y="24" fill="#9ca7b2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="3">MARVIA / RELEASE</text>
    <text x="62" y="188" fill="url(#steel)" font-family="Arial,Helvetica,sans-serif" font-size="144" font-weight="800" letter-spacing="-8">1.0</text>
    <text x="329" y="125" fill="#eef1f4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="-.5">One stack.</text>
    <text x="329" y="163" fill="#eef1f4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="-.5">Your route.</text>
    <text x="64" y="216" fill="#aeb8c3" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.4">ANDROID   /   WINDOWS   /   PANEL   /   NODES</text>
    <text x="1158" y="263" fill="#798592" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2">OPEN SOURCE</text>
  </g>
  <rect x="1" y="1" width="1198" height="278" rx="18" fill="none" stroke="#515c68" stroke-opacity=".7"/>
</svg>
