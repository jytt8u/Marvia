<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvia Partner</title>

<!-- Значок нарисован прямо здесь: единственный внешний адрес в интерфейсе —
     это уже утечка, а ради иконки вкладки её допускать незачем. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c1a11'/%3E%3Cpath d='M8 10l8 14 8-14' fill='none' stroke='%2346e07a' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
  /* Шрифты вшиты в бинарник и отдаются самой панелью. Панель для обхода
     блокировок, которая не открывается без зарубежного CDN, — издевательство,
     плюс каждое открытие сообщало бы стороннему хосту, что её открыли. */
  @font-face { font-family: Onest; src: url(fonts/onest-latin.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Onest; src: url(fonts/onest-cyrillic.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  @font-face { font-family: Unbounded; src: url(fonts/unbounded-latin.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Unbounded; src: url(fonts/unbounded-cyrillic.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  /* Chakra Petch — только латиница: им набрана одна надпись MARVIA PARTNER,
     кириллицы у этого шрифта нет вовсе. */
  @font-face { font-family: 'Chakra Petch'; src: url(fonts/chakra-petch-latin.woff2) format('woff2');
    font-weight: 700; font-display: swap; unicode-range: U+0000-00FF; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Onest, system-ui, sans-serif;
    background: #05100a;
    color: #eaf5ee;
    overflow: hidden;
  }
  [hidden] { display: none !important; }

  /* Вход. Отдельный экран, а не модальное окно поверх панели: пока токен не
     принят, показывать нечего, и рисовать за формой пустую панель — обман. */
  #login {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #login .box {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 30px;
    border-radius: 18px;
    background: #0c1a11;
    border: 1px solid #1c2e21;
  }
  #login .mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #login .mark img { height: 24px; width: auto; display: block; }
  #login .word {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .2em;
    color: #c3ccd6;
  }
  #login p { font-size: 13px; line-height: 1.55; color: #6c8a76; }
  #login input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid #1c2e21;
    background: #05100a;
    color: #eaf5ee;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  #login input:focus { outline: none; border-color: #46e07a; }
  #login button {
    padding: 13px 18px;
    border-radius: 12px;
    border: none;
    background: #46e07a;
    color: #05130b;
    font-family: Onest, system-ui, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #login .err { font-size: 12px; color: #f2a03d; min-height: 16px; }

  /* Переключатель языка на входе: до проверки токена панели ещё нет, а
     прочитать, что от тебя хотят, надо уже здесь. */
  #login .lang {
    margin-left: auto;
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid #1c2e21;
    background: transparent;
    color: #6c8a76;
    font: 600 11px/1 "JetBrains Mono", monospace;
    letter-spacing: .08em;
    cursor: pointer;
  }
  #login .lang:hover { color: #eaf5ee; border-color: #46e07a; }

  #app { height: 100%; }
  #app.busy { opacity: .55; }

  /* Окно поверх панели. Цвета берутся из темы переменными, поэтому оно
     перекрашивается вместе с ней и не выпадает из выбранного вида. */
  #veil {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, .55);
  }
  #veil .sheet {
    width: 100%;
    max-width: 460px;
    max-height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
    border-radius: var(--r, 16px);
    background: var(--surf, #0c1a11);
    border: 1px solid var(--line, #1c2e21);
    color: var(--fg, #eaf5ee);
  }
  #veil h2 { font-size: 18px; font-weight: 700; }
  #veil label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--dim, #6c8a76); }
  #veil input[type=text], #veil input[type=number] {
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line, #1c2e21);
    background: var(--bg, #05100a);
    color: var(--fg, #eaf5ee);
    font-family: Onest, system-ui, sans-serif;
    font-size: 14px;
  }
  #veil input:focus { outline: none; border-color: var(--acc, #46e07a); }
  #veil .kinds { flex-direction: row; gap: 14px; flex-wrap: wrap; }
  #veil .kinds span { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg, #eaf5ee); }
  #veil .row { display: flex; gap: 10px; flex-wrap: wrap; }
  #veil .line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    background: var(--surf2, #1f2824);
  }
  #veil .line button { padding: 6px 10px; font-size: 12px; }
  #veil .note { font-size: 12px; line-height: 1.5; color: var(--dim, #6c8a76); }
  #veil button {
    padding: 11px 16px;
    border-radius: 10px;
    border: none;
    font-family: Onest, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surf2, #1f2824);
    color: var(--fg, #eaf5ee);
  }
  #veil button.go { background: var(--acc, #46e07a); color: var(--accFg, #05130b); }
  #veil button.bad { background: rgba(242, 160, 61, .16); color: #f2a03d; }
  #veil pre {
    margin: 0;
    padding: 11px 12px;
    border-radius: 10px;
    background: var(--bg, #05100a);
    border: 1px solid var(--line, #1c2e21);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--fg, #eaf5ee);
  }

  /* Сообщение о результате. Внизу справа, само уходит: действия здесь
     короткие, и требовать закрывать каждое подтверждение — издевательство. */
  #toast {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 30;
    max-width: 380px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.45;
    background: var(--surf2, #1f2824);
    color: var(--fg, #eaf5ee);
    border: 1px solid var(--line, #1c2e21);
  }
  #toast.bad { background: rgba(242, 160, 61, .16); color: #f2a03d; border-color: #f2a03d; }
</style>
</head>
<body>

<div id="login">
  <form class="box" id="login-form">
    <div class="mark">
      <img src="assets/marvia-mark.png" alt="">
      <div class="word">MARVIA PARTNER</div>
      <button type="button" id="login-lang" class="lang"></button>
    </div>
    <p id="login-hint"></p>
    <input id="login-token" type="password" autocomplete="current-password" spellcheck="false">
    <div class="err" id="login-err"></div>
    <button type="submit" id="login-enter"></button>
  </form>
</div>

<div id="app" hidden></div>

<!--
  Разметка панели перенесена из дизайна (Marvia Seller.dc.html, экран S02)
  как есть, вместе с его же языком шаблонов: sc-for, sc-if и {{ }}. Так правку
  дизайна можно перенести обратной вставкой, а не переписыванием.

  Разделов «Тарифы», «Платежи», «Рассылка», «Логи и аудит» здесь нет намеренно:
  их нет ни в базе, ни в API, а нарисованный раздел — это обещание.
-->
<template id="shell">
  <div style="height: 100%; background: var(--bg, #05100a); display: flex; flex-direction: column; overflow: hidden;">

    <div style="height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid var(--line, #1c2e21); background: var(--surf, #0c1a11);">
      <div style="display: flex; align-items: center; gap: 10px;">
        <img src="assets/marvia-mark.png" alt="" style="height: 22px; width: auto; display: block;">
        <div style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .2em; color: #c3ccd6;">MARVIA PARTNER</div>
        <div style="{{ hostBadge }}">{{ host }}</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="{{ ghostBtn }}" onClick="{{ doLang }}" title="{{ d18.switchTitle }}">{{ d18.switchTo }}</div>
        <div style="{{ ghostBtn }}" onClick="{{ doBackup }}">{{ d18.head.backup }}</div>
        <div style="{{ ghostBtn }}" onClick="{{ doReload }}">{{ reloadLabel }}</div>
        <div style="{{ ghostBtn }}" onClick="{{ doLogout }}">{{ d18.head.logout }}</div>
      </div>
    </div>

    <div style="flex: 1; display: flex; min-height: 0;">
      <div style="width: 224px; flex: none; border-right: 1px solid var(--line, #1c2e21); background: var(--surf, #0c1a11); padding: 16px 12px; display: flex; flex-direction: column; gap: 3px;">
        <sc-for list="{{ nav }}" as="n">
          <div style="{{ n.style }}" onClick="{{ n.onClick }}">
            <div style="{{ n.dot }}"></div>
            <div>{{ n.label }}</div>
          </div>
        </sc-for>
      </div>

      <div style="flex: 1; min-width: 0; padding: 22px 26px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">
        <div style="display: flex; align-items: flex-end; justify-content: space-between;">
          <div>
            <div style="font-size: 25px; font-weight: 700; color: var(--fg, #eaf5ee);">{{ pageTitle }}</div>
            <div style="font-size: 13px; color: var(--dim, #6c8a76); margin-top: 3px;">{{ pageSub }}</div>
          </div>
          <sc-if value="{{ hasCta }}">
            <div style="{{ ctaStyle }}" onClick="{{ doCta }}">{{ pageCta }}</div>
          </sc-if>
        </div>

        <!--
          Поиск. Таблица рисует всех разом, и на трёхстах покупателях глазами
          нужного не найти. Ищем по тому, что продавец помнит: по метке и по
          внешнему номеру, под которым покупатель заведён у бота.
        -->
        <sc-if value="{{ hasSearch }}">
          <input id="q" type="text" style="{{ searchStyle }}" value="{{ q }}"
                 placeholder="{{ d18.search }}" autocomplete="off" spellcheck="false"
                 onInput="{{ doSearch }}">
        </sc-if>

        <sc-if value="{{ hasError }}">
          <div style="{{ errStyle }}">{{ errText }}</div>
        </sc-if>

        <!--
          С чего начать. Показывается, пока путь от пустой панели до первой
          продажи не пройден: нет ноды — продавать нечего, нет покупателя —
          некому, нет ключа — бот не сможет выдавать сам.

          Установщик панели последней строкой обещает «вкладка Ноды →
          Добавить ноду», и до сих пор продавец упирался в то, что этой кнопки
          нет. Здесь она стоит первой.
        -->
        <sc-if value="{{ showStart }}">
          <div style="{{ startBox }}">
            <div style="font-size: 15px; font-weight: 600; color: var(--fg);">{{ d18.start.title }}</div>
            <sc-for list="{{ startSteps }}" as="s">
              <div style="{{ s.row }}" onClick="{{ s.onClick }}">
                <div style="{{ s.mark }}">{{ s.num }}</div>
                <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
                  <div style="font-size: 13px; color: var(--fg);">{{ s.title }}</div>
                  <div style="font-size: 12px; line-height: 1.45; color: var(--dim);">{{ s.note }}</div>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ isDash }}">
          <div style="display: flex; flex-direction: column; gap: var(--gap, 12px); flex: 1; min-height: 0;">
            <div style="display: flex; gap: var(--gap, 12px);">
              <sc-for list="{{ kpis }}" as="k">
                <div style="{{ k.style }}">
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; color: var(--dim, #6c8a76);">{{ k.label }}</div>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: var(--fg, #eaf5ee); margin-top: 7px;">{{ k.value }}</div>
                  <div style="{{ k.deltaStyle }}">{{ k.delta }}</div>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; gap: var(--gap, 12px); height: 210px;">
              <div style="flex: 1.6; min-width: 0; padding: var(--pad, 16px); border-radius: var(--r, 16px); background: var(--surf, #0c1a11); border: 1px solid var(--line, #1c2e21); display: flex; flex-direction: column; gap: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <div style="font-size: 14px; font-weight: 600; color: var(--fg, #eaf5ee);">{{ d18.dash.traffic }}</div>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim, #6c8a76);">{{ totalTraffic }}</div>
                </div>
                <div style="flex: 1; display: flex; align-items: flex-end; gap: 4px; padding-top: 10px;">
                  <sc-for list="{{ lolli }}" as="l">
                    <div style="{{ l.colStyle }}" title="{{ l.title }}">
                      <div style="{{ l.dotStyle }}"></div>
                      <div style="{{ l.stemStyle }}"></div>
                    </div>
                  </sc-for>
                </div>
                <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .12em; color: var(--dim, #6c8a76);"><span>{{ firstDay }}</span><span>{{ lastDay }}</span></div>
              </div>
              <div style="flex: 1; min-width: 0; padding: var(--pad, 16px); border-radius: var(--r, 16px); background: var(--surf, #0c1a11); border: 1px solid var(--line, #1c2e21); display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
                <div style="font-size: 14px; font-weight: 600; color: var(--fg, #eaf5ee);">{{ d18.dash.nodes }}</div>
                <sc-for list="{{ nodes }}" as="n">
                  <div style="{{ n.rowStyle }}">
                    <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
                      <div style="{{ n.dotStyle }}"></div>
                      <div style="font-size: 13px; color: var(--fg, #eaf5ee); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ n.name }}</div>
                    </div>
                    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim, #6c8a76); flex: none;">{{ n.load }}</div>
                  </div>
                </sc-for>
                <sc-if value="{{ noNodes }}">
                  <div style="{{ emptyStyle }}">{{ d18.dash.noNodes }}</div>
                </sc-if>
              </div>
            </div>
            <div style="flex: 1; min-height: 0; padding: var(--pad, 16px); border-radius: var(--r, 16px); background: var(--surf, #0c1a11); border: 1px solid var(--line, #1c2e21); display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 14px; font-weight: 600; color: var(--fg, #eaf5ee);">{{ d18.dash.clients }}</div>
                <div style="{{ allClients }}" onClick="{{ goClients }}">{{ allClientsLabel }}</div>
              </div>
              <div style="{{ dashHead }}">
                <div>{{ d18.col.client }}</div><div>{{ d18.col.key }}</div><div>{{ d18.col.until }}</div><div>{{ d18.col.traffic }}</div><div>{{ d18.col.status }}</div>
              </div>
              <sc-for list="{{ clients }}" as="c">
                <div style="{{ c.rowStyle }}" onClick="{{ c.onClick }}">
                  <div style="font-size: 13px; color: var(--fg, #eaf5ee); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ c.name }}</div>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dim, #6c8a76);">{{ c.key }}</div>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dim, #6c8a76);">{{ c.until }}</div>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--fg, #eaf5ee);">{{ c.traffic }}</div>
                  <div style="{{ c.badgeStyle }}">{{ c.status }}</div>
                </div>
              </sc-for>
              <sc-if value="{{ noClients }}">
                <div style="{{ emptyStyle }}">{{ d18.dash.noClients }}</div>
              </sc-if>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isTable }}">
          <div style="display: flex; flex-direction: column; gap: var(--gap, 12px); flex: 1; min-height: 0;">
            <div style="display: flex; gap: var(--gap, 12px);">
              <sc-for list="{{ pageKpis }}" as="k">
                <div style="{{ k.style }}">
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; color: var(--dim);">{{ k.label }}</div>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: var(--fg); margin-top: 7px;">{{ k.value }}</div>
                  <div style="{{ k.deltaStyle }}">{{ k.delta }}</div>
                </div>
              </sc-for>
            </div>
            <div style="flex: 1; min-height: 0; padding: var(--pad, 16px); border-radius: var(--r, 16px); background: var(--surf); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; overflow: hidden;">
              <div style="{{ tableHead }}">
                <sc-for list="{{ tableCols }}" as="col">
                  <div>{{ col }}</div>
                </sc-for>
              </div>
              <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">
                <sc-for list="{{ tableRows }}" as="row">
                  <div style="{{ row.style }}" onClick="{{ row.onClick }}">
                    <sc-for list="{{ row.cells }}" as="cell">
                      <div style="{{ cell.style }}">{{ cell.text }}</div>
                    </sc-for>
                  </div>
                </sc-for>
                <sc-if value="{{ noTableRows }}">
                  <div style="{{ emptyStyle }}">{{ emptyTable }}</div>
                </sc-if>
              </div>
              <sc-if value="{{ hasPages }}">
                <div style="{{ pagerRow }}">
                  <div style="{{ prevStyle }}" onClick="{{ prevPage }}">{{ d18.table.prev }}</div>
                  <div style="{{ pagerInfo }}">{{ pagerText }}</div>
                  <div style="{{ nextStyle }}" onClick="{{ nextPage }}">{{ d18.table.next }}</div>
                </div>
              </sc-if>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isNodesPage }}">
          <div style="flex: 1; min-height: 0; overflow-y: auto;">
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap, 12px); align-content: start;">
              <sc-for list="{{ nodeCards }}" as="nc">
                <div style="{{ nc.style }}" onClick="{{ nc.onClick }}">
                  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
                    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
                      <div style="font-size: 16px; font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ nc.name }}</div>
                      <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ nc.host }}</div>
                    </div>
                    <div style="{{ nc.badge }}">{{ nc.state }}</div>
                  </div>
                  <div style="display: flex; gap: 18px;">
                    <div style="display: flex; flex-direction: column; gap: 3px;">

<script nonce="%NONCE%">
"use strict";

/* ────────────────────────────────────────────────────────────────────────────
   Маленький отрисовщик шаблона

   Дизайн приходит с холста на своём языке: sc-for, sc-if и {{ путь }}. Его
   родной рантайм собирает логику компонента из строки через new Function, а
   это требует 'unsafe-eval' в политике — на странице, где живёт админский
   токен, такого допускать нельзя. Отсюда свой отрисовщик: он умеет ровно те
   три конструкции, что использует дизайн, и не выполняет ничего, кроме них.

   Выражение в {{ }} — только путь через точку либо true/false. Это не
   ограничение реализации, а решение: как только в шаблон попадает
   произвольное выражение, его снова нужно чем-то вычислять.
   ──────────────────────────────────────────────────────────────────────── */

const BINDING = /\{\{\s*([\w.]+)\s*\}\}/g;
const WHOLE_BINDING = /^\s*\{\{\s*([\w.]+)\s*\}\}\s*$/;

function resolvePath(path, scope) {
  if (path === "true") return true;
  if (path === "false") return false;
  let cur = scope;
  for (const part of path.split(".")) {
    if (cur == null) return undefined;
    cur = cur[part];
  }
  return cur;
}

function interpolate(text, scope) {
  return text.replace(BINDING, (_, path) => {
    const v = resolvePath(path, scope);
    return v == null ? "" : String(v);
  });
}

// buildInto переносит содержимое шаблонного узла в живой, разрешая по дороге
// подстановки. Обработчики вешаются слушателем, а не атрибутом: атрибут с
// кодом строкой политика не пустит, и правильно сделает.
function buildInto(source, target, scope) {
  for (const node of source.childNodes) {
    if (node.nodeType === Node.TEXT_NODE) {
      const text = node.nodeValue;
      if (!text.includes("{{")) {
        target.appendChild(node.cloneNode(false));
        continue;
      }
      target.appendChild(document.createTextNode(interpolate(text, scope)));
      continue;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) continue;

    const tag = node.tagName.toLowerCase();

    if (tag === "sc-for") {
      const list = resolvePath((node.getAttribute("list") || "").replace(/[{}\s]/g, ""), scope);
      const as = node.getAttribute("as") || "item";
      if (!Array.isArray(list)) continue;
      for (const item of list) {
        // Наследуем область через прототип: вложенный цикл видит и внешние
        // имена, но своим присваиванием их не затирает.
        const inner = Object.create(scope);
        inner[as] = item;
        buildInto(node, target, inner);
      }
      continue;
    }

    if (tag === "sc-if") {
      const cond = resolvePath((node.getAttribute("value") || "").replace(/[{}\s]/g, ""), scope);
      if (cond) buildInto(node, target, scope);
      continue;
    }

    const el = document.createElement(tag);
    for (const attr of node.attributes) {
      const name = attr.name;
      const value = attr.value;

      // Любой on* — слушателем. Атрибутом с кодом строкой политика его не
      // пустит, и правильно сделает: страница с админским токеном не должна
      // уметь выполнять то, что попало в разметку.
      const low = name.toLowerCase();
      if (low.startsWith("on")) {
        const m = WHOLE_BINDING.exec(value);
        const fn = m ? resolvePath(m[1], scope) : null;
        if (typeof fn === "function") {
          if (low === "onclick") el.style.cursor = "pointer";
          el.addEventListener(low.slice(2), fn);
        }
        continue;
      }

      const m = WHOLE_BINDING.exec(value);
      if (m) {
        const v = resolvePath(m[1], scope);
        if (v == null || v === "") continue;
        el.setAttribute(name, String(v));
        continue;
      }
      el.setAttribute(name, value.includes("{{") ? interpolate(value, scope) : value);
    }
    buildInto(node, el, scope);
    target.appendChild(el);
  }
}

/* ────────────────────────────────────────────────────────────────────────────
   Разговор с панелью
   ──────────────────────────────────────────────────────────────────────── */

// Ключ тот же, что был у прежней панели: продавец, уже вошедший однажды, не
// должен искать токен заново из-за смены вида.
const TOKEN_KEY = "veil.token";

const state = {
  token: null,
  // Язык ставится до первой отрисовки: словарь спрашивают все, включая
  // экран входа, а он рисуется раньше панели.
  lang: "ru",
  page: "dash",
  preset: "steel",
  acc: null,
  density: "normal",
  users: [],
  nodes: [],
  stats: null,
  keys: [],
  apps: null,
  q: "",
  rowsPage: 1,
  loading: false,
  error: null,

  // Знаем ли мы уже, что в панели. До первого успешного ответа не знаем —
  // и обязаны это говорить, а не рисовать нули. Продавец, открывший панель и
  // увидевший «ни одного клиента», решает, что потерял базу.
  known: false,
};

// Сколько ждём ответа панели.
//
// Без предела запрос, который не вернулся, вешает страницу навсегда: панель
// показывает «Обновляю…» и нули, продавец видит «ни одного клиента» и решает,
// что потерял базу. Так и случилось на живой панели. Полминуты — с запасом на
// медленную ручку и на канал из-за границы.
const API_TIMEOUT = 30000;

async function api(path, method, body) {
  let res;
  try {
    res = await fetch(path, {
      method: method || "GET",
      signal: AbortSignal.timeout(API_TIMEOUT),
      headers: Object.assign(
        { Authorization: "Bearer " + state.token },
        body ? { "Content-Type": "application/json" } : {}
      ),
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (err) {
    // AbortSignal.timeout бросает TimeoutError. Отличать его от обрыва сети
    // важно: это разные беды и чинятся по-разному.
    if (err && err.name === "TimeoutError") {
      throw new Error(L().err.slow(path, Math.round(API_TIMEOUT / 1000)));
    }
    throw new Error(L().err.noPanel(path));
  }
  if (res.status === 401) {
    logout();
    throw new Error(L().err.badToken);
  }
  if (res.status === 204) return null;

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { /* не JSON */ }
  if (!res.ok) throw new Error((data && data.error) || L().err.code(res.status));
  return data;
}

async function loadAll() {
  state.loading = true;
  state.error = null;
  render();
  try {
    const [users, nodes, stats, keys, apps] = await Promise.all([
      api("/api/v1/users"),
      api("/api/v1/nodes"),
      api("/api/v1/stats?days=30"),
      api("/api/v1/keys"),
      api("/api/v1/apps"),
    ]);
    state.users = (users && users.users) || [];
    state.nodes = (nodes && nodes.nodes) || [];
    state.stats = stats || null;
    state.keys = (keys && keys.keys) || [];
    state.apps = apps || null;

    // Теперь мы действительно знаем, что в панели, и можем показывать числа.
    state.known = true;
  } catch (err) {
    state.error = err.message;
  } finally {
    state.loading = false;
    render();
  }
}

function logout() {
  try { localStorage.removeItem(TOKEN_KEY); } catch (_) { /* приватное окно */ }
  state.token = null;
  document.getElementById("app").hidden = true;
  document.getElementById("login").hidden = false;
  document.getElementById("login-token").value = "";
}

/* ────────────────────────────────────────────────────────────────────────────
   Окна и сообщения

   В дизайне их нет: холст рисовал экраны, а не диалоги. Поэтому собраны здесь
   вручную, но целиком на переменных темы — окно перекрашивается вместе с
   панелью и не выпадает из выбранного вида.
   ──────────────────────────────────────────────────────────────────────── */

function el(tag, opts, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(opts || {})) {
    if (k === "text") node.textContent = v;
    else if (k === "cls") node.className = v;
    else if (k === "on") for (const [ev, fn] of Object.entries(v)) node.addEventListener(ev, fn);
    else node.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) node.append(kid);
  return node;
}

let toastTimer = null;
function toast(text, bad) {
  const old = document.getElementById("toast");
  if (old) old.remove();
  clearTimeout(toastTimer);

  const box = el("div", { id: "toast", cls: bad ? "bad" : "", text });
  document.body.append(box);
  toastTimer = setTimeout(() => box.remove(), bad ? 6000 : 3200);
}

// closeSheet и sheet держат ровно одно окно: два наложенных друг на друга —
// верный способ нажать «удалить» не там, где смотришь.
function closeSheet() {
  const old = document.getElementById("veil");
  if (old) old.remove();
}

function sheet(title, body, buttons) {
  closeSheet();

  const box = el("div", { cls: "sheet" }, el("h2", { text: title }));
  for (const part of body) box.append(part);
  if (buttons && buttons.length) {
    const row = el("div", { cls: "row" });
    for (const b of buttons) row.append(b);
    box.append(row);
  }

  const veil = el("div", { id: "veil", on: { click: (e) => { if (e.target === veil) closeSheet(); } } }, box);
  // Тема живёт переменными на #app, а окно лежит выше по дереву — переносим
  // их сюда, иначе оно нарисуется цветами из значений по умолчанию.
  veil.setAttribute("style", document.getElementById("app").getAttribute("style") || "");
  document.body.append(veil);
  const first = box.querySelector("input");
  if (first) first.focus();
  return box;
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

function btn(text, cls, fn) {
  return el("button", { type: "button", cls: cls || "", text, on: { click: fn } });
}

function field(label, id, type, value, hint) {
  return el("label", { text: label },
    el("input", { id, type, value: value == null ? "" : String(value) }),
    hint ? el("span", { cls: "note", text: hint }) : null);
}

function val(id) { return (document.getElementById(id).value || "").trim(); }
function num(id) { return Number(document.getElementById(id).value) || 0; }

// ask — подтверждение своим окном, а не confirm().
//
// Родное окно браузера рисуется системными цветами поверх выбранной темы и,
// главное, не даёт объяснить последствие: «Сменить адрес подписки?» без
// объяснения человек нажимает не думая.
function ask(title, text, danger) {
  return new Promise((resolve) => {
    const done = (v) => { closeSheet(); resolve(v); };
    sheet(title, [el("div", { cls: "note", text })], [
      btn(danger || L().act.yes, "bad", () => done(true)),
      btn(L().act.cancel, "", () => done(false)),
    ]);
  });
}

/* ────────────────────────────────────────────────────────────────────────────
   Действия над подписчиком
   ──────────────────────────────────────────────────────────────────────── */

// showLinks отдаёт то, что надо переслать покупателю.
//
// Приватную часть vp1 панель нигде не хранит — в этом весь смысл: утечка её
// базы не даёт доступа ни к одному покупателю. Значит показать ссылку можно
// ровно один раз, сразу после выдачи, и об этом надо предупредить.
function showLinks(title, links, fresh) {
  const d = L();
  const parts = [];
  const add = (label, text) => {
    parts.push(el("div", { cls: "note", text: label }));
    parts.push(el("pre", { text }));
    parts.push(btn(d.act.copy, "", async () => {
      try {
        await navigator.clipboard.writeText(text);
        toast(d.act.copied);
      } catch (_) {
        toast(d.act.noCopy, true);
      }
    }));
  };

  if (links.account) add(d.links.account, links.account);
  if (links.subscription) add(d.links.subscription, links.subscription);

  // stock приходит плоским списком: по ссылке на каждую пару «нода + вид
  // доступа». Вид достаём из схемы, ноду — из хвоста после решётки: иначе
  // продавец видит несколько одинаковых на вид строк и не знает, какая куда.
  for (const link of links.stock || []) {
    const kind = (link.split("://")[0] || "доступ");
    let where = "";
    const hash = link.indexOf("#");
    if (hash >= 0) {
      try { where = " · " + decodeURIComponent(link.slice(hash + 1)); } catch (_) { /* кривой хвост */ }
    }
    add(d.links.stock(kind, where), link);
  }

  if (fresh) {
    parts.unshift(el("div", { cls: "note", text: d.links.once }));
  }

  // Панель, поднятая без -sub-base, честно ставит в ссылки заглушку вместо
  // своего адреса. Молча отдать такую продавцу — значит дать ему отправить
  // покупателю ссылку в никуда и разбираться потом, почему «не работает».
  if (JSON.stringify(links).includes("ПОДСТАВЬ-АДРЕС-ПАНЕЛИ")) {
    parts.unshift(el("div", { cls: "note", text: d.links.stub }));
  }

  sheet(title, parts, [btn(d.act.close, "go", closeSheet)]);
}

async function act(fn) {
  try {
    await fn();
  } catch (err) {
    toast(err.message, true);
  }
}

function newUserSheet() {
  const d = L();
  const kinds = el("label", { cls: "kinds", text: d.user.kinds });
  for (const kind of ["vp1", "vless", "trojan"]) {
    const input = el("input", { type: "checkbox", value: kind });
    if (kind === "vp1") input.checked = true;
    kinds.append(el("span", {}, input, el("span", { text: kind + " · " + d.user.kindNote[kind] })));
  }

  const box = sheet(d.user.newTitle, [
    field(d.user.newLabel[0], "nu-label", "text", "", d.user.newLabel[1]),
    field(d.user.newDays[0], "nu-days", "number", 30, d.user.newDays[1]),
    field(d.user.newGB[0], "nu-gb", "number", 100, d.user.newGB[1]),
    field(d.user.newIPs[0], "nu-ips", "number", 3, d.user.newIPs[1]),
    kinds,
  ], [
    btn(d.user.create, "go", () => act(async () => {
      const picked = Array.from(box.querySelectorAll(".kinds input:checked")).map((i) => i.value);
      if (!picked.length) { toast(d.user.pickKind, true); return; }

      const body = {
        label: val("nu-label"),
        traffic_limit: Math.round(num("nu-gb") * 1024 * 1024 * 1024),
        max_ips: num("nu-ips"),
        kinds: picked,
      };
      const days = num("nu-days");
      if (days > 0) body.expires_at = new Date(Date.now() + days * 86400000).toISOString();

      const res = await api("/api/v1/users", "POST", body);
      await loadAll();
      showLinks(d.user.issuedTitle, res.links || {}, true);
    })),
    btn(d.act.cancel, "", closeSheet),
  ]);
}

function userSheet(user) {
  const name = user.label || ("#" + user.id);
  const left = daysLeft(user.expires_at);

  const d = L();
  const facts = [
    [d.user.state, user.enabled ? d.user.on : d.user.off],
    [d.user.term, user.expires_at
      ? shortDate(user.expires_at) + (left === null ? "" : d.user.days(left))
      : d.time.forever],
    [d.user.used, bytes(user.used) + (user.traffic_limit ? d.user.of + bytes(user.traffic_limit) : d.user.noLimit)],
    [d.user.devices, user.max_ips ? String(user.max_ips) : d.user.noDeviceLimit],
  ].map(([k, v]) => el("div", { cls: "note", text: k + ": " + v }));

  // Доступы — списком с отзывом поштучно.
  //
  // У одного покупателя их бывает несколько: наш vp1 на телефон и vless на
  // старое приложение, которое он не хочет менять. Отзывать всё разом, когда
  // утёк один, значит наказывать человека за чужую беду.
  const creds = user.credentials || [];
  facts.push(el("div", { cls: "note", text: creds.length ? d.user.creds : d.user.noCreds }));
  for (const c of creds) {
    facts.push(el("div", { cls: "line" },
      el("div", { cls: "note", text: c.kind + d.user.issued + shortDate(c.created_at) }),
      btn(d.key.revoke, "bad", () => act(async () => {
        const [title, text, word] = d.user.askRevoke(c.kind, creds.length === 1);
        if (!await ask(title, text, word)) return;
        await api("/api/v1/credentials/" + c.id, "DELETE");
        closeSheet();
        toast(d.user.credRevoked);
        await loadAll();
      }))));
  }

  // Выдать можно только то, чего ещё нет: второй vp1 у одного покупателя
  // ничего не даёт, а в списке путается с первым.
  const have = new Set(creds.map((c) => c.kind));
  const missing = ["vp1", "vless", "trojan"].filter((k) => !have.has(k));
  if (missing.length) {
    const row = el("div", { cls: "row" });
    for (const kind of missing) {
      row.append(btn("+ " + kind, "", () => act(async () => {
        const res = await api("/api/v1/users/" + user.id + "/credentials", "POST", { kind, label: "" });
        await loadAll();
        showLinks(d.user.issuedKind(kind), res.links || {}, true);
      })));
    }
    facts.push(el("div", { cls: "note", text: d.user.addMore }));
    facts.push(row);
  }

  sheet(name, facts, [
    btn(d.user.extend, "go", () => act(async () => {
      await api("/api/v1/users/" + user.id, "PATCH", { extend_by: "30d", enabled: true });
      closeSheet();
      toast(d.user.extended);
      await loadAll();
    })),
    btn(d.user.links, "", () => act(async () => {
      const links = await api("/api/v1/users/" + user.id + "/links");
      showLinks(name, links, false);
    })),
    btn(user.enabled ? d.user.disable : d.user.enable, "", () => act(async () => {
      await api("/api/v1/users/" + user.id, "PATCH", { enabled: !user.enabled });
      closeSheet();
      await loadAll();
    })),
    btn(d.user.rotate, "bad", () => act(async () => {
      const [title, text, word] = d.user.askRotate;
      if (!await ask(title, text, word)) return;
      await api("/api/v1/users/" + user.id + "/sub-token", "POST");
      const res = await api("/api/v1/users/" + user.id + "/credentials", "POST", { kind: "vp1", label: "" });
      showLinks(d.links.newFor(name), res.links || {}, true);
      await loadAll();
    })),
    btn(d.user.remove, "bad", () => act(async () => {
      const [title, text] = d.user.askRemove(name);
      if (!await ask(title, text, d.user.remove)) return;
      await api("/api/v1/users/" + user.id, "DELETE");
      closeSheet();
      toast(d.user.removed);
      await loadAll();
    })),
    btn(d.act.close, "", closeSheet),
  ]);
}

function nodeSheet(node) {
  const alive = nodeAlive(node);

  const d = L();
  const facts = [
    [d.node.address, node.address],
    [d.node.cover, node.sni || "—"],
    [d.node.state, node.enabled ? (alive ? d.node.online : d.node.silentOn) : d.node.offState],
    [d.node.lastSeen, sinceLabel(node.last_seen)],
  ].map(([k, v]) => el("div", { cls: "note", text: k + ": " + v }));

  // Имя и страну пишет продавец, а не хостер и не панель. Хостер зовёт машину
  // vm-4823917-ubuntu, и ровно это видит покупатель в списке серверов; а адреса
  // у хостеров числятся то в Нидерландах, то в США, так что определять страну
  // по адресу значит врать покупателю, выбравшему Финляндию.
  const form = [
    field(d.node.name[0], "nd-name", "text", node.name || "", d.node.name[1]),
    field(d.node.country[0], "nd-country", "text", node.country || "", d.node.country[1]),
  ];

  sheet(node.name || node.address, facts.concat(form), [
    btn(d.node.save, "go", () => act(async () => {
      await api("/api/v1/nodes/" + node.id, "PATCH", { name: val("nd-name"), country: val("nd-country") });
      closeSheet();
      toast(d.node.saved);
      await loadAll();
    })),
    btn(node.enabled ? d.node.disable : d.node.enable, "", () => act(async () => {
      await api("/api/v1/nodes/" + node.id, "PATCH", { enabled: !node.enabled });
      closeSheet();
      toast(node.enabled ? d.node.disabled : d.node.enabled);
      await loadAll();
    })),
    btn(d.node.remove, "bad", () => act(async () => {
      const [title, text, word] = d.node.askRemove(node.name || node.address);
      if (!await ask(title, text, word)) return;
      await api("/api/v1/nodes/" + node.id, "DELETE");
      closeSheet();
      toast(d.node.removed);
      await loadAll();
    })),
    btn(d.act.close, "", closeSheet),
  ]);
}

// downloadBackup забирает копию базы браузером, а не ссылкой.
//
// Ручка требует админский токен в заголовке, а обычная ссылка его не несёт:
// нажатие на <a href="/api/v1/backup"> получило бы 401. Поэтому качаем сами и
// отдаём файл уже из памяти.
function downloadBackup() {
  act(async () => {
    toast(L().backup.taking);
    const res = await fetch("/api/v1/backup", { headers: { Authorization: "Bearer " + state.token } });
    if (!res.ok) throw new Error(L().backup.failed(res.status));

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0, 10);
    const a = el("a", { href: url, download: "marvia-panel-" + stamp + ".db" });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast(L().backup.done);
  });
}

  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;

// L — словарь текущего языка. Нужен обработчикам окон: они живут вне
// renderVals и своей области видимости не имеют.
function L() { return TEXTS[state.lang] || TEXTS.ru; }

// pickLang выбирает язык при первом заходе.
//
// Спрашивать человека на пустом экране незачем: браузер уже знает, на каком
// языке он читает. Русский берём и для языков бывшего СССР — панель на них не
// переведена, а английский там понимают хуже русского.
function pickLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && TEXTS[saved]) return saved;
  } catch (_) { /* приватное окно */ }

  const want = (navigator.languages || [navigator.language || ""]).join(",").toLowerCase();
  return /\b(ru|be|uk|kk|ky|uz|tg|hy|az)\b/.test(want) ? "ru" : "en";
}

function setLang(lang) {
  if (!TEXTS[lang]) return;
  state.lang = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (_) { /* приватное окно */ }
  document.documentElement.lang = lang;
  paintLogin();
  // Панель перерисовываем только когда она есть: до входа рисовать нечего.
  if (state.token) render();
}

// paintLogin переписывает экран входа: он живёт вне шаблона, потому что до
// проверки токена показывать панель нечего.
function paintLogin() {
  const d = L();
  document.getElementById("login-hint").textContent = d.login.hint;
  document.getElementById("login-token").placeholder = d.login.token;
  document.getElementById("login-enter").textContent = d.login.enter;
  document.getElementById("login-lang").textContent = d.switchTo;
}

/* ────────────────────────────────────────────────────────────────────────────
   Человеческие форматы
   ──────────────────────────────────────────────────────────────────────── */

function bytes(n) {
  const units = L().bytes;
  // Голый «0» рядом с «12.4 ГБ» читается как другая величина, а не как ноль
  // байт. Держим единицу и на нуле, и на языке интерфейса («0 Б» / «0 B»).
  if (!n) return "0 " + units[0];
  let i = 0, v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)) + " " + units[i];
}

// shortDate отдаёт дату так, как её пишут на языке интерфейса.
//
// Своей раскладки не изобретаем: 09.10.2026 и 10/09/2026 — это один и тот же
// день, и человек, привыкший к своей записи, читает чужую с ошибкой ровно там,
// где ошибиться дороже всего — в сроке подписки.
function shortDate(iso) {
  if (!iso) return L().time.forever;
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString(L().lang, { day: "2-digit", month: "2-digit", year: "numeric" });
}

function dayLabel(day) {
  const p = day.split("-");
  if (p.length !== 3) return day;
  // На оси графика год не нужен, а порядок дня и месяца — нужен.
  return L().lang === "en" ? p[1] + "." + p[2] : p[2] + "." + p[1];
}

// sinceLabel — «когда нода последний раз выходила на связь». Панель считает
// ноду живой, если та отмечалась недавно: своего пинга у панели нет, а врать
// зелёным кружком нельзя.
function sinceLabel(iso) {
  // Словарь берём через L(), а не через d18 — и вот почему.
  //
  // d18 — локальная переменная внутри renderVals, снаружи такого имени нет.
  // Обращение к нему отсюда роняло всю отрисовку — но только когда на связь
  // выходила хотя бы одна нода: без нод эта функция не вызывается. На пустой
  // панели всё выглядело здоровым, а у продавца с нодами страница навсегда
  // замирала на «Обновляю…».
  const w = L();
  if (!iso) return w.time.never;
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const mins = Math.floor((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return w.time.now;
  if (mins < 60) return mins + w.time.min;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + w.time.hour;
  return Math.floor(hours / 24) + w.time.day;
}

function nodeAlive(node) {
  if (!node.enabled || !node.last_seen) return false;
  return Date.now() - new Date(node.last_seen).getTime() < 10 * 60 * 1000;
}

function keyShort(user) {
  const cred = (user.credentials || [])[0];
  if (!cred || !cred.secret) return "—";
  return cred.secret.slice(0, 4) + "…" + cred.secret.slice(-4);
}

function daysLeft(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return Math.ceil((d.getTime() - Date.now()) / 86400000);
}

// Разделы: только те, за которыми есть данные. «Тарифы», «Платежи»,
// «Рассылка», «Логи и аудит» в дизайне нарисованы, но панель о них ничего не
// знает — пункта меню, который ведёт в выдуманное, здесь нет.
// Порядок разделов в меню. Названия берутся из словаря по этому же ключу:
// держать их здесь значило бы иметь два места, где они разъезжаются.
const PAGES = ["dash", "clients", "keys", "nodes", "stats", "apps", "look"];

// Сколько строк на странице. Полсотни — столько влезает в экран прокруткой и
// столько человек ещё готов просмотреть глазами, не листая.
const ROWS = 50;

function setState(patch) {
  // Смена раздела или запроса сбрасывает лист. Иначе продавец, стоявший на
  // четвёртой странице, ищет одного человека и видит «никого нет»: найденных
  // трое, а он смотрит на четвёртую полусотню.
  if ("page" in patch || "q" in patch) state.rowsPage = 1;
  Object.assign(state, patch);
  if ("preset" in patch || "acc" in patch || "density" in patch) saveLook();
  render();
}

// CTA — какая кнопка стоит в углу раздела. Разделы без действия остаются без
// кнопки: пустой угол честнее нажимаемой заглушки.
const CTA = {
  clients: () => newUserSheet(),
  nodes: () => newNodeSheet(),
  keys: () => newKeySheet(),
};

function renderVals() {
  const t = theme();
  const d = DENSITY[state.density] || DENSITY.normal;
  const page = state.page;

  // Словарь зовём d18, а не t: t здесь уже занято темой, и перепутать их —
  // значит получить цвет вместо надписи в самом неожиданном месте.
  const d18 = L();

  const vars = Look.vars(t, state.density);

  const card = "flex:1;min-width:0;padding:" + d.pad + "px;border-radius:" + d.r
    + "px;background:" + t.surf + ";border:1px solid " + t.line;

  const users = state.users || [];
  const nodes = state.nodes || [];
  const byDay = (state.stats && state.stats.by_day) || [];
  const byNode = (state.stats && state.stats.by_node) || [];
  const total = (state.stats && state.stats.total) || 0;

  const activeUsers = users.filter((u) => u.enabled).length;
  const expiring = users.filter((u) => {
    const left = daysLeft(u.expires_at);
    return u.enabled && left !== null && left >= 0 && left <= 7;
  }).length;
  const liveNodes = nodes.filter(nodeAlive).length;

  // Показатели считаем по всем: поиск — это способ найти одного, а не
  // основание врать про то, сколько у продавца покупателей.
  const q = state.q.trim().toLowerCase();
  const shown = q
    ? users.filter((u) => ((u.label || "") + " " + (u.external_id || "") + " #" + u.id).toLowerCase().includes(q))
    : users;

  // Пока не знаем, что в панели (первый ответ ещё в полёте) — подзаголовки,
  // считающие клиентов, ноды, трафик и приложения, показали бы нули и
  // «ничего не выложено». Это враньё: данных ещё нет, а не «их ноль». Пока
  // !known говорим честное «пока не знаю», а не рисуем пустоту как факт.
  const subFor = {
    dash: d18.sub.dash,
    clients: state.known ? d18.sub.clients(shown.length, users.length, activeUsers, !!q) : d18.err.unknown,
    keys: d18.sub.keys,
    nodes: state.known ? d18.sub.nodes(nodes.length, liveNodes) : d18.err.unknown,
    stats: state.known ? d18.sub.stats(bytes(total)) : d18.err.unknown,
    apps: !state.known ? d18.err.unknown
      : ((state.apps && state.apps.apps) || []).length === 0 ? d18.sub.appsEmpty : d18.sub.appsSome,
    look: d18.sub.look,
  };

  const nav = PAGES.map((k) => ({
    k, label: d18.nav[k],
    onClick: () => setState({ page: k }),
    style: "display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:" + d.r
      + "px;font-size:13px;cursor:pointer;color:" + (page === k ? t.fg : t.dim)
      + ";background:" + (page === k ? t.surf2 : "transparent"),
    dot: "width:7px;height:7px;border-radius:2px;background:" + (page === k ? t.acc : t.dim),
  }));

  // ── обзор ────────────────────────────────────────────────────────────────
  // Пока не знаем — прочерк, а не ноль.
  //
  // Ноль здесь читается как утверждение: «клиентов нет», «трафика нет». Если
  // панель на самом деле ещё не ответила, это ложь, и ложь дорогая: продавец
  // видит пустую панель и думает, что потерял базу.
  const num = (v) => (state.known ? String(v) : "—");
  const size = (v) => (state.known ? bytes(v) : "—");

  const kpis = [
    [d18.kpi.activeKeys, num(activeUsers), state.known ? d18.kpi.allTotal(users.length) : d18.err.unknown, true],
    [d18.kpi.traffic30, size(total), d18.kpi.byAllNodes, true],
    // При нуле нод «все отвечают» — формально верно и совершенно бесполезно:
    // отвечать некому, и продавать пока нечего.
    [d18.kpi.nodesLive, state.known ? liveNodes + " / " + nodes.length : "—",
      !state.known ? d18.err.unknown
        : nodes.length === 0 ? d18.kpi.noNodes
        : liveNodes === nodes.length ? d18.kpi.allAnswer : d18.kpi.notAllAnswer,
      state.known && nodes.length > 0 && liveNodes === nodes.length],
    [d18.kpi.expiring, num(expiring), d18.kpi.inSevenDays, expiring === 0],
  ].map(([label, value, delta, good]) => ({
    label, value, delta, style: card,
    deltaStyle: "font-size:12px;margin-top:6px;color:" + (good ? t.acc : t.dim),
  }));

  const peak = byDay.reduce((m, x) => Math.max(m, x.up + x.down), 0) || 1;
  const lolli = byDay.map((x) => {
    const sum = x.up + x.down;
    const h = Math.max(4, Math.round((sum / peak) * 100));
    const top = h > 88;
    return {
      title: dayLabel(x.day) + " · " + bytes(sum),
      colStyle: "flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:" + h + "%",
      dotStyle: "width:" + (top ? 8 : 6) + "px;height:" + (top ? 8 : 6) + "px;border-radius:50%;flex:none;background:"
        + (sum === 0 ? "transparent" : top ? t.acc : t.fg) + ";border:1px solid " + (sum === 0 ? t.line : top ? t.acc : t.fg),
      stemStyle: "width:1px;flex:1;background:" + t.line,
    };
  });

  const dashNodes = nodes.slice(0, 5).map((n) => {
    const alive = nodeAlive(n);
    return {
      name: n.name || n.address,
      load: alive ? sinceLabel(n.last_seen) : n.enabled ? d18.nodesPage.silentShort : d18.nodesPage.offShort,
      rowStyle: "display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:" + d.r + "px;background:" + t.surf2,
      dotStyle: "width:8px;height:8px;border-radius:50%;flex:none;background:" + (alive ? t.acc : t.warn),
    };
  });

  const clientRow = "2fr 1.2fr 1fr 1fr 0.9fr";
  const dashHead = "display:grid;grid-template-columns:" + clientRow
    + ";gap:12px;padding:0 12px;font-family:JetBrains Mono,monospace;font-size:10px;letter-spacing:.14em;color:" + t.dim;

  function clientStatus(u) {
    if (!u.enabled) return [d18.status.off, "dim"];
    const left = daysLeft(u.expires_at);
    if (left !== null && left < 0) return [d18.status.expired, "warn"];
    if (left !== null && left <= 7) return [d18.status.expiring, "warn"];
    return [d18.status.active, "ok"];
  }

  const clients = users.slice(0, 4).map((u) => {
    const [status, st] = clientStatus(u);
    return {
      name: u.label || ("#" + u.id),
      key: keyShort(u),
      until: shortDate(u.expires_at),
      traffic: bytes(u.used),
      status,
      onClick: () => userSheet(u),
      rowStyle: "display:grid;grid-template-columns:" + clientRow
        + ";gap:12px;align-items:center;padding:11px 12px;border-radius:" + d.r + "px;background:" + t.surf2,
      badgeStyle: "justify-self:start;padding:4px 9px;border-radius:6px;font-family:JetBrains Mono,monospace;font-size:10px;color:"
        + (st === "ok" ? t.acc : st === "warn" ? t.warn : t.dim) + ";background:"
        + (st === "ok" ? t.accSoft : st === "warn" ? "rgba(242,160,61,.13)" : t.surf),
    };
  });

  // ── таблицы ──────────────────────────────────────────────────────────────
  const TABLES = {
    clients: {
      cols: [d18.col.client, d18.col.key, d18.col.until, d18.col.devices, d18.col.traffic, d18.col.status],
      grid: "2fr 1.4fr 1.2fr 1fr 1fr 0.9fr",
      rows: shown.map((u) => {
        const [status, st] = clientStatus(u);
        return [u.label || ("#" + u.id), keyShort(u), shortDate(u.expires_at),
          String(u.max_ips || "—"), bytes(u.used), status, st];
      }),
      empty: q ? d18.table.noFound : d18.table.noClients,
      // Строка открывает карточку подписчика. Индекс тот же, что у rows:
      // список строится из shown одним проходом.
      onRow: (i) => () => userSheet(shown[i]),
    },
    keys: {
      cols: [d18.col.name, d18.col.rights, d18.col.created, d18.col.lastSeen, d18.col.status],
      grid: "1.6fr 1.4fr 1.2fr 1.2fr 0.9fr",
      rows: ((state.keys || [])).map((k) => [
        k.name, (k.scopes || []).join(", ") || d18.key.allRights, shortDate(k.created_at),
        k.last_used_at ? shortDate(k.last_used_at) : d18.key.never,
        k.revoked_at ? d18.status.revoked : d18.status.active, k.revoked_at ? "dim" : "ok",
      ]),
      empty: d18.table.noKeys,
      onRow: (i) => () => keySheet((state.keys || [])[i]),
    },
  };

  const tbl = TABLES[page] || TABLES.clients;
  const tableCols = tbl.cols;
  const tableHead = "display:grid;grid-template-columns:" + tbl.grid
    + ";gap:12px;padding:0 12px;font-family:JetBrains Mono,monospace;font-size:10px;letter-spacing:.14em;color:" + t.dim;
  // Постраничность. Рисовать тысячу строк разом браузер умеет, но человек их
  // не читает, а прокрутка перестаёт быть навигацией.
  const totalRows = tbl.rows.length;
  const lastPage = Math.max(1, Math.ceil(totalRows / ROWS));
  // Лист мог уехать за конец: покупателя удалили, найденных стало меньше.
  const curPage = Math.min(state.rowsPage, lastPage);
  const from = (curPage - 1) * ROWS;
  const pageRows = tbl.rows.slice(from, from + ROWS);

  const tableRows = pageRows.map((r, i) => {
    const idx = from + i;
    const st = r[r.length - 1], cells = r.slice(0, -1);
    const col = st === "ok" ? t.acc : st === "warn" ? t.warn : t.dim;
    const soft = st === "ok" ? t.accSoft : st === "warn" ? "rgba(242,160,61,.13)" : t.surf;
    return {
      onClick: tbl.onRow ? tbl.onRow(idx) : null,
      style: "display:grid;grid-template-columns:" + tbl.grid
        + ";gap:12px;align-items:center;padding:11px 12px;border-radius:" + d.r + "px;background:" + t.surf2,
      cells: cells.map((text, i) => ({
        text,
        style: i === cells.length - 1
          ? "justify-self:start;padding:4px 9px;border-radius:6px;font-family:JetBrains Mono,monospace;font-size:10px;color:" + col + ";background:" + soft
          : (i === 0 ? "font-size:13px;color:" + t.fg + ";overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
            : "font-family:JetBrains Mono,monospace;font-size:12px;color:" + t.dim),
      })),
    };
  });

  // Те же num()/size(), что на обзоре: пока !known — прочерк, а не голый ноль.
  // Карточка с «0» на разделе клиентов читается как «базу потеряли».
  const KPI = {
    clients: [
      [d18.kpi.total, num(users.length), d18.kpi.ofAll, true],
      [d18.kpi.active, num(activeUsers), users.length ? d18.kpi.share(Math.round((activeUsers / users.length) * 100)) : "—", true],
      [d18.kpi.expiring, num(expiring), d18.kpi.sevenDays, expiring === 0],
    ],
    keys: [
      [d18.kpi.keysCount, num((state.keys || []).length), d18.kpi.forBots, true],
    ],
    stats: [
      [d18.col.traffic, size(total), d18.kpi.forPeriod, true],
      [d18.kpi.nodesWithTraffic, num(byNode.length), state.known ? d18.kpi.outOf(nodes.length) : d18.err.unknown, true],
      [d18.kpi.perDay, size(byDay.length ? total / byDay.length : 0), d18.kpi.onAverage, true],
    ],
  };
  const pageKpis = (KPI[page] || []).map(([label, value, delta, good]) => ({
    label, value, delta, style: card,
    deltaStyle: "font-size:12px;margin-top:6px;color:" + (good ? t.acc : t.dim),
  }));

  // ── ноды ─────────────────────────────────────────────────────────────────
  // Трафик сводим по node_id, а не по имени. Имя ноды по умолчанию — hostname
  // сервера, и у облачных образов оно сплошь одинаковое (ubuntu/vps/localhost):
  // по имени две разные ноды слились бы в одну, и обе карточки показали бы долю
  // последней. Плюс имя вроде «constructor»/«__proto__» в объекте-литерале
  // достало бы поле из прототипа и дало бы «NaN Б» и width:NaN%. Map по
  // идентификатору снимает и совпадение имён, и ловушку прототипа разом.
  const nodeTraffic = new Map();
  for (const x of byNode) nodeTraffic.set(x.node_id, (x.up || 0) + (x.down || 0));
  const nodePeak = [...nodeTraffic.values()].reduce((m, v) => Math.max(m, v), 0) || 1;

  const nodeCards = nodes.map((n) => {
    const alive = nodeAlive(n);
    const st = alive ? "ok" : "warn";
    const traffic = nodeTraffic.get(n.id) || 0;
    const f = traffic / nodePeak;
    return {
      onClick: () => nodeSheet(n),
      name: n.name || n.address,
      host: n.address + (n.country ? " · " + n.country : ""),
      load: bytes(traffic),
      share: total ? Math.round((traffic / total) * 100) + "%" : "0%",
      seen: alive ? sinceLabel(n.last_seen) : n.enabled ? d18.nodesPage.silentShort : d18.nodesPage.offShort,
      state: alive ? d18.nodesPage.online : n.enabled ? d18.nodesPage.silent : d18.nodesPage.off,
      style: "padding:" + d.pad + "px;border-radius:" + d.r + "px;background:" + t.surf
        + ";border:1px solid " + (st === "warn" ? t.warn : t.line) + ";display:flex;flex-direction:column;gap:14px",
      badge: "flex:none;padding:4px 9px;border-radius:6px;font-family:JetBrains Mono,monospace;font-size:10px;color:"
        + (st === "ok" ? t.acc : t.warn) + ";background:" + (st === "ok" ? t.accSoft : "rgba(242,160,61,.13)"),
      track: "height:6px;border-radius:3px;background:" + t.surf2 + ";overflow:hidden",
      fill: "width:" + Math.round(f * 100) + "%;height:100%;background:" + (st === "ok" ? t.acc : t.warn),
    };
  });

  // ── статистика ───────────────────────────────────────────────────────────
  const dayBars = byDay.map((x) => {
    const sum = x.up + x.down;
    const h = Math.max(2, Math.round((sum / peak) * 100));
    return {
      month: dayLabel(x.day).slice(0, 2),
      title: x.day + " · " + bytes(sum),
      col: "flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;height:100%",
      bar: "height:" + h + "%;border-radius:" + Math.min(d.r, 10) + "px " + Math.min(d.r, 10)
        + "px 4px 4px;background:linear-gradient(180deg," + t.acc + "," + mix(t.acc, t.surf, 0.55) + ")",
      label: "font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:.1em;text-align:center;color:" + t.dim,
    };
  });

  const shareRows = byNode.map((x) => {
    const traffic = (x.up || 0) + (x.down || 0);
    const f = total ? traffic / total : 0;
    return {
      name: x.name,
      pct: Math.round(f * 100) + "%",
      track: "height:8px;border-radius:4px;background:" + t.surf2 + ";overflow:hidden",
      fill: "width:" + Math.round(f * 100) + "%;height:100%;border-radius:4px;background:" + t.acc,
    };
  });

  // ── вид ──────────────────────────────────────────────────────────────────
  const accents = Object.values(PRESETS).map((p) => p.acc)
    .filter((c, i, a) => a.indexOf(c) === i)
    .map((c) => ({
      c,
      onClick: () => setState({ acc: c }),
      style: "width:26px;height:26px;border-radius:8px;cursor:pointer;background:" + c
        + ";outline:2px solid " + (state.acc === c ? t.fg : "transparent") + ";outline-offset:2px",
    }));

  const looks = LOOKS.map(([key, dens], i) => {
    const name = d18.themes[i];
    const on = state.preset === key && state.density === dens;
    const lt = theme({ preset: key, acc: null });
    const lr = DENSITY[dens].r;
    return {
      name,
      sub: d18.look[dens],
      onClick: () => setState({ preset: key, acc: null, density: dens }),
      wrap: "min-width:0;display:flex;flex-direction:column;gap:7px;cursor:pointer;padding:4px;border-radius:"
        + (d.r + 4) + "px;border:" + (on ? "2px solid " + t.acc : "1px solid " + t.line)
        + ";background:" + (on ? t.accSoft : "transparent"),
      canvas: "position:relative;height:104px;border-radius:" + Math.max(d.r - 3, 6) + "px;overflow:hidden;background:" + lt.bg,
      side: "position:absolute;left:0;top:0;bottom:0;width:26%;background:" + lt.surf + ";border-right:1px solid " + lt.line,
      navA: "position:absolute;left:5%;top:9%;width:17%;height:5%;border-radius:3px;background:" + lt.acc,
      navB: "position:absolute;left:5%;top:19%;width:15%;height:4%;border-radius:3px;background:" + lt.fg + ";opacity:.35",
      navC: "position:absolute;left:5%;top:27%;width:15%;height:4%;border-radius:3px;background:" + lt.fg + ";opacity:.2",
      kpiA: "position:absolute;left:31%;top:10%;width:20%;height:22%;border-radius:" + Math.round(lr * 0.3) + "px;background:" + lt.surf,
      kpiB: "position:absolute;left:54%;top:10%;width:20%;height:22%;border-radius:" + Math.round(lr * 0.3) + "px;background:" + lt.surf,
      kpiC: "position:absolute;left:77%;top:10%;width:18%;height:22%;border-radius:" + Math.round(lr * 0.3)
        + "px;background:" + lt.accSoft + ";border:1px solid " + lt.acc,
      chart: "position:absolute;left:31%;top:38%;right:5%;bottom:8%;border-radius:" + Math.round(lr * 0.3)
        + "px;background:" + lt.surf2 + ";background-image:linear-gradient(180deg,transparent 62%," + lt.acc + " 62%)",
      label: "display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:0 3px",
      name2: "font-size:12px;color:" + (on ? t.acc : t.fg),
      sub2: "font-family:JetBrains Mono,monospace;font-size:9px;color:" + t.dim,
    };
  });

  const ghostBtn = "padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;color:" + t.dim
    + ";background:" + t.surf2;

  // ── приложения ───────────────────────────────────────────────────────────
  const APP_TITLES = { android: "Android", windows: "Windows" };
  const laid = ((state.apps && state.apps.apps) || []);
  const appCards = laid.map((ap) => ({
    title: APP_TITLES[ap.name] || ap.name,
    file: ap.file,
    size: bytes(ap.size),
    // Половины отпечатка хватает, чтобы сверить с тем, что скачивал, и она
    // влезает в строку. Целиком он всё равно нечитаем глазами.
    sum: (ap.sha256 || "").slice(0, 16) + "…",
    state: d18.appsPage.laid,
    style: "padding:" + d.pad + "px;border-radius:" + d.r + "px;background:" + t.surf
      + ";border:1px solid " + t.line + ";display:flex;flex-direction:column;gap:12px",
    badge: "flex:none;padding:4px 9px;border-radius:6px;font-family:JetBrains Mono,monospace;font-size:10px;color:"
      + t.acc + ";background:" + t.accSoft,
  }));

  // ── с чего начать ────────────────────────────────────────────────────────
  //
  // Путь от пустой панели до первой продажи — три шага, и до сих пор нигде не
  // было сказано, в каком порядке. Показываем, пока хоть один не пройден, и
  // убираем сам собой, когда пройдены все: постоянная подсказка на рабочем
  // экране быстро становится мусором.
  const steps = [
    [nodes.length > 0, ...d18.start.node, () => setState({ page: "nodes" })],
    [users.length > 0, ...d18.start.client, () => setState({ page: "clients" })],
    [(state.keys || []).length > 0, ...d18.start.key, () => setState({ page: "keys" })],
  ];
  const startSteps = steps.map(([done, title, note, onClick], i) => ({
    num: done ? "✓" : String(i + 1),
    title, note,
    onClick: done ? null : onClick,
    row: "display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:" + d.r
      + "px;background:" + t.surf2 + (done ? ";opacity:.55" : ";cursor:pointer"),
    mark: "flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;"
      + "justify-content:center;font-family:JetBrains Mono,monospace;font-size:11px;background:"
      + (done ? t.acc : t.surf) + ";color:" + (done ? t.accFg : t.dim),
  }));

  return {
    vars,
    // Словарь целиком: шаблон достаёт из него надписи путём через точку.
    d18,
    host: location.host,
    hostBadge: "padding:3px 9px;border-radius:6px;background:" + t.accSoft
      + ";font-family:JetBrains Mono,monospace;font-size:10px;color:" + t.acc,
    ghostBtn,
    reloadLabel: state.loading ? d18.head.reloading : d18.head.reload,
    doReload: () => { if (!state.loading) loadAll(); },
    doLang: () => setLang(state.lang === "ru" ? "en" : "ru"),
    doLogout: logout,
    doBackup: downloadBackup,

    nav,
    pageTitle: d18.nav[page],
    pageSub: subFor[page] || "",

    // Кнопка действия есть только там, где действие вправду работает.
    // Нарисованная кнопка — это обещание, и «Скачать журнал» на разделе,
    // которого нет, стоит дороже пустого угла.
    // Подсказку «с чего начать» показываем только когда точно знаем, что
    // шаг не пройден. До первого ответа ноды/клиенты/ключи ещё пусты не
    // потому что их нет, а потому что мы их не загрузили — развернуть на
    // весь обзор «заведи первую ноду» у продавца с полной базой значит
    // соврать. Поэтому state.known впереди.
    showStart: state.known && page === "dash" && steps.some(([done]) => !done),
    startSteps,
    startBox: "display:flex;flex-direction:column;gap:8px;padding:" + d.pad + "px;border-radius:"
      + d.r + "px;background:" + t.surf + ";border:1px solid " + t.acc,

    hasCta: !!CTA[page],
    pageCta: d18.cta[page] || "",
    doCta: CTA[page] || null,
    ctaStyle: "height:40px;padding:0 18px;border-radius:" + d.r + "px;background:" + t.acc
      + ";color:" + t.accFg + ";display:flex;align-items:center;font-size:13px;font-weight:600;cursor:pointer",

    hasError: !!state.error,
    errText: state.error || "",
    errStyle: "padding:12px 14px;border-radius:" + d.r + "px;font-size:13px;color:" + t.warn
      + ";background:rgba(242,160,61,.13);border:1px solid " + t.warn,
    emptyStyle: "padding:14px 12px;font-size:13px;color:" + t.dim,

    isDash: page === "dash",
    isTable: page === "clients" || page === "keys",
    isNodesPage: page === "nodes",
    isStatsPage: page === "stats",
    isAppsPage: page === "apps",
    isLook: page === "look",

    // Поиск нужен там, где список длинный и растёт. У нод и ключей их
    // единицы — поле поиска над тремя строками только мешает.
    hasSearch: page === "clients",
    q: state.q,
    doSearch: (e) => setState({ q: e.target.value }),
    searchStyle: "width:100%;padding:10px 12px;border-radius:" + d.r + "px;background:" + t.surf
      + ";border:1px solid " + t.line + ";color:" + t.fg
      + ";font-family:Onest,system-ui,sans-serif;font-size:13px;outline:none",

    appCards,
    // «Ничего не выложено» — утверждение, и до первого ответа оно ложно:
    // список приложений ещё не пришёл. Пока !known держим подсказку скрытой.
    appsHint: state.known && laid.length === 0,
    appsHintText: (state.apps && state.apps.hint)
      || d18.appsPage.empty,
    hintBox: "padding:" + d.pad + "px;border-radius:" + d.r + "px;background:" + t.surf
      + ";border:1px solid " + t.line + ";font-size:13px;line-height:1.5;color:" + t.dim,

    kpis, lolli, nodes: dashNodes, clients, dashHead,
    totalTraffic: bytes(total),
    firstDay: byDay.length ? dayLabel(byDay[0].day) : "",
    lastDay: byDay.length ? dayLabel(byDay[byDay.length - 1].day) : "",
    // «Ни одной ноды» говорим только когда действительно знаем. Иначе пусто —
    // пусть лучше будет пустое место, чем неверное утверждение.
    noNodes: state.known && nodes.length === 0,
    noClients: state.known && users.length === 0,
    allClients: "font-size:12px;cursor:pointer;color:" + t.acc,
    allClientsLabel: state.known ? d18.dash.allClients(users.length) : "",
    goClients: () => setState({ page: "clients" }),

    pageKpis, tableCols, tableHead, tableRows,
    noTableRows: state.known && tableRows.length === 0,
    emptyTable: tbl.empty,

    hasPages: totalRows > ROWS,
    pagerText: d18.table.range(from + 1, Math.min(from + ROWS, totalRows), totalRows),
    prevPage: curPage > 1 ? () => setState({ rowsPage: curPage - 1 }) : null,
    nextPage: curPage < lastPage ? () => setState({ rowsPage: curPage + 1 }) : null,
    pagerRow: "display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px",
    pagerInfo: "font-family:JetBrains Mono,monospace;font-size:11px;color:" + t.dim,
    prevStyle: "padding:7px 14px;border-radius:" + d.r + "px;font-size:12px;background:" + t.surf2
      + ";color:" + (curPage > 1 ? t.fg : t.dim) + (curPage > 1 ? ";cursor:pointer" : ";opacity:.45"),
    nextStyle: "padding:7px 14px;border-radius:" + d.r + "px;font-size:12px;background:" + t.surf2
      + ";color:" + (curPage < lastPage ? t.fg : t.dim) + (curPage < lastPage ? ";cursor:pointer" : ";opacity:.45"),

    nodeCards,
    dayBars, shareRows,
    noShare: shareRows.length === 0,
    accents, looks,
  };
}

/* ────────────────────────────────────────────────────────────────────────────
   Отрисовка
   ──────────────────────────────────────────────────────────────────────── */

const shell = document.getElementById("shell");

function render() {
  const app = document.getElementById("app");
  const vals = renderVals();

  app.setAttribute("style", vals.vars + ";height:100%");
  app.classList.toggle("busy", state.loading);
  document.body.style.background = theme().bg;

  // Перерисовка собирает разметку заново, а значит поле поиска — уже другой
  // элемент, и набор текста терял бы фокус на каждой букве. Запоминаем, где
  // стоял курсор, и возвращаем его в новое поле.
  const old = document.getElementById("q");
  const hadFocus = old && document.activeElement === old;
  const caret = hadFocus ? old.selectionStart : null;

  const frag = document.createDocumentFragment();
  buildInto(shell.content, frag, vals);
  app.replaceChildren(frag);

  if (hadFocus) {
    const next = document.getElementById("q");
    if (next) {
      next.focus();
      const at = caret == null ? next.value.length : caret;
      next.setSelectionRange(at, at);
    }
  }
}

/* ────────────────────────────────────────────────────────────────────────────
   Вход
   ──────────────────────────────────────────────────────────────────────── */

function enter(token) {
  state.token = token;
  document.getElementById("login").hidden = true;
  document.getElementById("app").hidden = false;
  loadAll();
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("login-err");
  const token = document.getElementById("login-token").value.trim();
  if (!token) { err.textContent = L().login.empty; return; }

  err.textContent = L().login.checking;
  state.token = token;
  try {
    // Проверяем токен самой дешёвой ручкой: узнать версию может только тот,
    // кто уже вошёл, так что отказ здесь — это отказ везде.
    await api("/api/v1/version");
    try { localStorage.setItem(TOKEN_KEY, token); } catch (_) { /* приватное окно */ }
    err.textContent = "";
    enter(token);
  } catch (e2) {
    state.token = null;
    err.textContent = e2.message === L().err.badToken ? L().login.wrong : e2.message;
  }
});

state.lang = pickLang();
document.documentElement.lang = state.lang;
document.getElementById("login-lang").addEventListener("click",
  () => setLang(state.lang === "ru" ? "en" : "ru"));
paintLogin();

loadLook();

let saved = null;
try { saved = localStorage.getItem(TOKEN_KEY); } catch (_) { /* приватное окно */ }
if (saved) enter(saved);
</script>
