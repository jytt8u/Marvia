<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvia Partner</title>

<!-- Тот же нейтральный знак, вшитый в бинарник; внешних запросов нет. -->
<link rel="icon" type="image/png" href="assets/marvia-mark.png">
<meta name="description" content="Marvia Partner — управление доступом, клиентами и нодами.">

<style>
  /* Шрифты вшиты в бинарник и отдаются самой панелью. Панель для обхода
     блокировок, которая не открывается без зарубежного CDN, — издевательство,
     плюс каждое открытие сообщало бы стороннему хосту, что её открыли. */
  @font-face { font-family: Onest; src: url(fonts/onest-latin.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Onest; src: url(fonts/onest-cyrillic.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  @font-face { font-family: Unbounded; src: url(fonts/unbounded-latin.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Unbounded; src: url(fonts/unbounded-cyrillic.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  /* Chakra Petch — только латиница: им набрана одна надпись MARVIA PARTNER,
     кириллицы у этого шрифта нет вовсе. */
  @font-face { font-family: 'Chakra Petch'; src: url(fonts/chakra-petch-latin.woff2) format('woff2');
    font-weight: 700; font-display: swap; unicode-range: U+0000-00FF; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Onest, system-ui, sans-serif;
    background: #0c0e11;
    color: #f1f4f7;
    overflow: hidden;
  }
  [hidden] { display: none !important; }

  /* Вход. Отдельный экран, а не модальное окно поверх панели: пока токен не
     принят, показывать нечего, и рисовать за формой пустую панель — обман. */
  #login {
    height: 100%; overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #login .box {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 36px;
    border-radius: 22px;
    background: #181b20;
    border: 1px solid #343940;
  }
  #login .mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /*
    Знак — та самая объёмная лента-«M», и красится она темой, оставаясь
    металлом. Два слоя: нижний — сам знак, обесцвеченный в нейтральный металл
    (grayscale); верхний — заливка акцентом со смешением mix-blend-mode: color,
    которое берёт из акцента тон и насыщенность, а свет и тень — у металла
    снизу. Серый металл + любой акцент = тот же знак в этом цвете, с бликом и
    складкой на месте. Без --acc (экран входа) верхний слой прозрачен и знак
    остаётся серым: бренд начинается с нейтрального холста.

    isolation держит смешение внутри знака — иначе цвет пролился бы на фон.
  */
  :root { --mark-img: url("assets/marvia-mark.png"); }
  .logo { position: relative; display: inline-block; flex: none; isolation: isolate; }
  .logo::before, .logo::after { content: ""; position: absolute; inset: 0; }
  .logo::before {
    background: var(--mark-img) center / contain no-repeat;
    filter: grayscale(1) contrast(1.03) brightness(1.02);
  }
  .logo::after {
    background: var(--acc, transparent);
    mix-blend-mode: color;
    -webkit-mask: var(--mark-img) center / contain no-repeat;
            mask: var(--mark-img) center / contain no-repeat;
    -webkit-mask-size: contain; mask-size: contain;
  }
  /*
    Надпись MARVIA — не шрифт, а форма: «A» без перекладины и с точкой, такой
    буквы нет ни в одном вшитом шрифте. Идёт маской и заливается currentColor,
    поэтому подчиняется цвету текста рядом, как если бы была набрана.
  */
  :root { --word-img: url("assets/marvia-word.svg"); }
  .wordmark {
    display: block; height: 13px; aspect-ratio: 610 / 136; background: currentColor;
    -webkit-mask: var(--word-img) center / contain no-repeat;
            mask: var(--word-img) center / contain no-repeat;
  }
  #login .word {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .2em;
    color: #c3ccd6;
  }
  #login .word .wordmark { height: 15px; }
  #login h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.04em; font-weight: 600; margin-top: 18px; }
  #login p { font-size: 14px; line-height: 1.6; color: #aab1bb; }
  #login label { font-size: 12px; color: #c3ccd6; margin-bottom: -10px; }
  #login .brand-note { border-top: 1px solid #343940; padding-top: 18px; font-size: 12px; }
  #login input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid #343940;
    background: #0c0e11;
    color: #f1f4f7;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  #login input:focus { outline: 2px solid #c3ccd6; outline-offset: 3px; }
  #login button {
    padding: 13px 18px;
    border-radius: 12px;
    border: none;
    background: #c3ccd6;
    color: #0c0e11;
    font-family: Onest, system-ui, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #login .err { font-size: 12px; color: #f2a03d; min-height: 16px; }

  /* Переключатель языка на входе: до проверки токена панели ещё нет, а
     прочитать, что от тебя хотят, надо уже здесь. */
  #login .lang {
    margin-left: auto;
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid #343940;
    background: transparent;
    color: #aab1bb;
    font: 600 11px/1 "JetBrains Mono", monospace;
    letter-spacing: .08em;
    cursor: pointer;
  }
  #login .lang:hover { color: #f1f4f7; border-color: #c3ccd6; }
  #login button:disabled { opacity: .55; cursor: wait; }
  button, [role=button] { transition: filter .18s, transform .18s; }
  button:hover:not(:disabled), [role=button]:hover { filter: brightness(1.1); }
  button:active:not(:disabled), [role=button]:active { transform: translateY(1px); }
  :focus-visible { outline: 2px solid var(--fg, #f1f4f7) !important; outline-offset: 3px; }
  .look-intro { display: flex; align-items: center; gap: 18px; padding: 20px 24px;
    background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); }
  .look-intro .logo { width: 54px; height: 54px; }
  .look-intro h2 { font-size: 19px; font-weight: 600; letter-spacing: -.03em; margin-bottom: 5px; }
  .look-intro p { max-width: 64ch; color: var(--dim); font-size: 13px; line-height: 1.55; }
  .look-intro button { margin-left: auto; flex: none; padding: 10px 14px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surf2); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  #app { height: 100%; color: var(--fg, #f1f4f7); }
  #app.busy { opacity: .55; }

  /* Окно поверх панели. Цвета берутся из темы переменными, поэтому оно
     перекрашивается вместе с ней и не выпадает из выбранного вида. */
  #veil {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, .55);
  }
  #veil .sheet {
    width: 100%;
    max-width: 460px;
    max-height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
    border-radius: var(--r, 16px);
    background: var(--surf, #0c1a11);
    border: 1px solid var(--line, #1c2e21);
    color: var(--fg, #eaf5ee);
  }
  #veil h2 { font-size: 18px; font-weight: 700; }
  #veil label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--dim, #6c8a76); }
  #veil input[type=text], #veil input[type=number], #veil select {
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line, #1c2e21);
    background: var(--bg, #05100a);
    color: var(--fg, #eaf5ee);
    font-family: Onest, system-ui, sans-serif;
    font-size: 14px;
  }
  #veil input:focus { outline: none; border-color: var(--acc, #46e07a); }
  #veil .kinds { display: flex; border: 0; flex-direction: row; gap: 14px; flex-wrap: wrap; }
  #veil .kinds legend { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
  #veil .kinds label { flex-direction: row; align-items: center; cursor: pointer; }
  #veil .kinds span { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg, #eaf5ee); }
  #veil .row { display: flex; gap: 10px; flex-wrap: wrap; }
  #veil .line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    background: var(--surf2, #1f2824);
  }
  #veil .line button { padding: 6px 10px; font-size: 12px; }
  #veil .note { font-size: 12px; line-height: 1.5; color: var(--dim, #6c8a76); }
  #veil button {
    padding: 11px 16px;
    border-radius: 10px;
    border: none;
    font-family: Onest, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surf2, #1f2824);
    color: var(--fg, #eaf5ee);
  }
  #veil button.go { background: var(--acc, #46e07a); color: var(--accFg, #05130b); }
  #veil button.bad { background: rgba(242, 160, 61, .16); color: #f2a03d; }
  /* QR-код — на белом всегда: тёмная тема вокруг не должна сбивать камеру. */
  #veil img.qr {
    align-self: center;
    width: 220px;
    height: 220px;
    image-rendering: pixelated;
    background: #fff;
    border-radius: 10px;
  }
  #veil .own { display: flex; flex-direction: column; gap: 16px; }
  #veil .wizard, #veil .wizard-help { display: flex; flex-direction: column; gap: 8px; }
  #veil .step { font-size: 13px; color: var(--dim, #6c8a76); }
  #veil .step.done { color: var(--acc, #46e07a); font-weight: 600; }
  #veil [hidden] { display: none; }
  #veil .plan {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 11px 12px;
    border-radius: 10px;
    background: var(--surf2, #1f2824);
    text-align: left;
    cursor: pointer;
  }
  #veil .plan b { font-size: 14px; color: var(--fg, #eaf5ee); }
  #veil .plan span { font-size: 12px; font-weight: 400; color: var(--dim, #6c8a76); }
  #veil .plan[aria-pressed="true"] { outline: 2px solid var(--acc, #46e07a); }
  #veil pre {
    margin: 0;
    padding: 11px 12px;
    border-radius: 10px;
    background: var(--bg, #05100a);
    border: 1px solid var(--line, #1c2e21);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--fg, #eaf5ee);
  }

  /* Сообщение о результате. Внизу справа, само уходит: действия здесь
     короткие, и требовать закрывать каждое подтверждение — издевательство. */
  #toast {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 30;
    max-width: 380px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.45;
    background: var(--surf2, #1f2824);
    color: var(--fg, #eaf5ee);
    border: 1px solid var(--line, #1c2e21);
  }
  #toast.bad { background: rgba(242, 160, 61, .16); color: #f2a03d; border-color: #f2a03d; }
</style>
</head>
<body>

<div id="login">
  <form class="box" id="login-form">
    <div class="mark">
      <span class="logo" style="width: 26px; height: 26px;" aria-hidden="true"></span>
      <div class="word"><span class="wordmark" role="img" aria-label="Marvia"></span><span>PARTNER</span></div>
      <button type="button" id="login-lang" class="lang"></button>
    </div>
    <h1 id="login-title"></h1>
    <p id="login-hint"></p>
    <label id="login-label" for="login-token"></label>
    <input id="login-token" type="password" autocomplete="current-password" spellcheck="false" aria-describedby="login-err">
    <div class="err" id="login-err" role="status" aria-live="polite"></div>
    <button type="submit" id="login-enter"></button>
    <p class="brand-note" id="login-brand"></p>
  </form>
</div>

<!--
  Фон из файла. Лежит вне #app намеренно: перерисовка собирает #app заново,
  и видео начиналось бы с начала на каждое нажатие в панели.
-->
<div id="bg-layer" hidden style="position: fixed; inset: 0; z-index: -2; overflow: hidden;"></div>
<div id="bg-veil" hidden style="position: fixed; inset: 0; z-index: -1;"></div>

<div id="app" hidden></div>

<!--
  Разметка панели перенесена из дизайна (Marvia Seller.dc.html, экран S02)
  как есть, вместе с его же языком шаблонов: sc-for, sc-if и {{ }}. Так правку
  дизайна можно перенести обратной вставкой, а не переписыванием.

  Разделов «Платежи» и «Рассылка» здесь нет намеренно: их нет ни в базе, ни в
  API, а нарисованный раздел — это обещание. Тарифы — кнопка на странице
  клиентов, журнал — раздел расширенного режима.
-->
<template id="shell">
  <div style="height: 100%; background: var(--bgcss, var(--bg, #05100a)); display: flex; flex-direction: column; overflow: hidden;">

    <div style="height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid var(--line, #1c2e21); background: var(--surf, #0c1a11);">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="logo" style="width: 22px; height: 22px;" aria-hidden="true"></span>
        <div style="display: flex; align-items: center; gap: 8px; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .2em; color: var(--fg);"><span class="wordmark" role="img" aria-label="Marvia"></span><span>PARTNER</span></div>
        <div style="{{ hostBadge }}">{{ host }}</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="{{ ghostBtn }}" onClick="{{ doLang }}" title="{{ d18.switchTitle }}">{{ d18.switchTo }}</div>
        <sc-if value="{{ isAdmin }}">
          <div style="{{ ghostBtn }}" onClick="{{ doBackup }}">{{ d18.head.backup }}</div>
        </sc-if>
        <div style="{{ ghostBtn }}" onClick="{{ doReload }}">{{ reloadLabel }}</div>
        <div style="{{ ghostBtn }}" onClick="{{ doLogout }}">{{ d18.head.logout }}</div>
      </div>
    </div>

    <div style="flex: 1; display: flex; min-height: 0;">
      <div style="width: 224px; flex: none; border-right: 1px solid var(--line, #1c2e21); background: var(--surf, #0c1a11); padding: 16px 12px; display: flex; flex-direction: column; gap: 3px;">
        <sc-for list="{{ nav }}" as="n">
          <div style="{{ n.style }}" data-focus="nav-{{ n.k }}" aria-current="{{ n.current }}" onClick="{{ n.onClick }}">
            <div style="{{ n.dot }}"></div>
            <div>{{ n.label }}</div>
          </div>
        </sc-for>
        <!--
          Простой режим по умолчанию: четыре раздела, с которыми продают.
          Ключи ботов, журнал, обновления, статистика и вид — в расширенном.
          Переключатель внизу меню и запоминается.
        -->
        <div style="flex: 1;"></div>
        <div style="{{ modeStyle }}" data-focus="nav-mode" role="switch" aria-checked="{{ modeOn }}" onClick="{{ doMode }}">
          <div style="{{ modeKnob }}"></div>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <div style="font-size: 12px; color: var(--fg);">{{ d18.mode.label }}</div>
            <div style="font-size: 11px; line-height: 1.35; color: var(--dim);">{{ modeNote }}</div>
          </div>
        </div>
      </div>

      <div style="flex: 1; min-width: 0; padding: 22px 26px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">
        <div style="display: flex; align-items: flex-end; justify-content: space-between;">
          <div>
            <div style="font-size: 25px; font-weight: 700; color: var(--fg, #eaf5ee);">{{ pageTitle }}</div>
            <div style="font-size: 13px; color: var(--dim, #6c8a76); margin-top: 3px;">{{ pageSub }}</div>
          </div>
          <div style="display: flex; gap: 10px; align-items: center;">
            <sc-if value="{{ hasCta2 }}">
              <div style="{{ cta2Style }}" data-focus="page-action-2" onClick="{{ doCta2 }}">{{ pageCta2 }}</div>
            </sc-if>
            <sc-if value="{{ hasCta }}">
              <div style="{{ ctaStyle }}" data-focus="page-action" onClick="{{ doCta }}">{{ pageCta }}</div>
            </sc-if>
          </div>
        </div>

        <!--
          Поиск. Таблица рисует всех разом, и на трёхстах покупателях глазами
          нужного не найти. Ищем по тому, что продавец помнит: по метке и по
          внешнему номеру, под которым покупатель заведён у бота.
        -->
        <sc-if value="{{ hasSearch }}">
          <input id="q" type="text" style="{{ searchStyle }}" value="{{ q }}"
                 placeholder="{{ d18.search }}" aria-label="{{ d18.search }}" autocomplete="off" spellcheck="false"
                 onInput="{{ doSearch }}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px;" role="group" aria-label="{{ d18.filters.label }}">
            <sc-for list="{{ filterChips }}" as="f">
              <div style="{{ f.style }}" role="button" tabindex="0" aria-pressed="{{ f.pressed }}" onClick="{{ f.onClick }}">{{ f.label }}</div>
            </sc-for>
            <sc-if value="{{ hasBulk }}">
              <div style="{{ bulkStyle }}" data-focus="bulk" onClick="{{ doBulk }}">{{ bulkLabel }}</div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{ hasError }}">
          <div style="{{ errStyle }}">{{ errText }}</div>
        </sc-if>

        <!--
          С чего начать. Показывается, пока путь от пустой панели до первой
          продажи не пройден: нет ноды — продавать нечего, нет покупателя —
          некому, нет ключа — бот не сможет выдавать сам.

          Установщик панели последней строкой обещает «вкладка Ноды →
          Добавить ноду», и до сих пор продавец упирался в то, что этой кнопки
          нет. Здесь она стоит первой.
        -->
        <sc-if value="{{ showStart }}">
          <div style="{{ startBox }}">
            <div style="font-size: 15px; font-weight: 600; color: var(--fg);">{{ d18.start.title }}</div>
            <sc-for list="{{ startSteps }}" as="s">
              <div style="{{ s.row }}" onClick="{{ s.onClick }}">
                <div style="{{ s.mark }}">{{ s.num }}</div>
                <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
                  <div style="font-size: 13px; color: var(--fg);">{{ s.title }}</div>
                  <div style="font-size: 12px; line-height: 1.45; color: var(--dim);">{{ s.note }}</div>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ isDash }}">
          <div style="display: flex; flex-direction: column; gap: var(--gap, 12px); flex: 1; min-height: 0;">
            <div style="display: flex; gap: var(--gap, 12px);">
              <sc-for list="{{ kpis }}" as="k">
                <div style="{{ k.style }}">
                  <div style="font-size: 13px; color: var(--dim, #6c8a76);">{{ k.label }}</div>

<script nonce="%NONCE%">
"use strict";

/* ────────────────────────────────────────────────────────────────────────────
   Маленький отрисовщик шаблона

   Дизайн приходит с холста на своём языке: sc-for, sc-if и {{ путь }}. Его
   родной рантайм собирает логику компонента из строки через new Function, а
   это требует 'unsafe-eval' в политике — на странице, где живёт админский
   токен, такого допускать нельзя. Отсюда свой отрисовщик: он умеет ровно те
   три конструкции, что использует дизайн, и не выполняет ничего, кроме них.

   Выражение в {{ }} — только путь через точку либо true/false. Это не
   ограничение реализации, а решение: как только в шаблон попадает
   произвольное выражение, его снова нужно чем-то вычислять.
   ──────────────────────────────────────────────────────────────────────── */

const BINDING = /\{\{\s*([\w.]+)\s*\}\}/g;
const WHOLE_BINDING = /^\s*\{\{\s*([\w.]+)\s*\}\}\s*$/;

function resolvePath(path, scope) {
  if (path === "true") return true;
  if (path === "false") return false;
  let cur = scope;
  for (const part of path.split(".")) {
    if (cur == null) return undefined;
    cur = cur[part];
  }
  return cur;
}

function interpolate(text, scope) {
  return text.replace(BINDING, (_, path) => {
    const v = resolvePath(path, scope);
    return v == null ? "" : String(v);
  });
}

// buildInto переносит содержимое шаблонного узла в живой, разрешая по дороге
// подстановки. Обработчики вешаются слушателем, а не атрибутом: атрибут с
// кодом строкой политика не пустит, и правильно сделает.
function buildInto(source, target, scope) {
  for (const node of source.childNodes) {
    if (node.nodeType === Node.TEXT_NODE) {
      const text = node.nodeValue;
      if (!text.includes("{{")) {
        target.appendChild(node.cloneNode(false));
        continue;
      }
      target.appendChild(document.createTextNode(interpolate(text, scope)));
      continue;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) continue;

    const tag = node.tagName.toLowerCase();

    if (tag === "sc-for") {
      const list = resolvePath((node.getAttribute("list") || "").replace(/[{}\s]/g, ""), scope);
      const as = node.getAttribute("as") || "item";
      if (!Array.isArray(list)) continue;
      for (const item of list) {
        // Наследуем область через прототип: вложенный цикл видит и внешние
        // имена, но своим присваиванием их не затирает.
        const inner = Object.create(scope);
        inner[as] = item;
        buildInto(node, target, inner);
      }
      continue;
    }

    if (tag === "sc-if") {
      const cond = resolvePath((node.getAttribute("value") || "").replace(/[{}\s]/g, ""), scope);
      if (cond) buildInto(node, target, scope);
      continue;
    }

    const el = document.createElement(tag);
    let clickable = false;
    for (const attr of node.attributes) {
      const name = attr.name;
      const value = attr.value;

      // Любой on* — слушателем. Атрибутом с кодом строкой политика его не
      // пустит, и правильно сделает: страница с админским токеном не должна
      // уметь выполнять то, что попало в разметку.
      const low = name.toLowerCase();
      if (low.startsWith("on")) {
        const m = WHOLE_BINDING.exec(value);
        const fn = m ? resolvePath(m[1], scope) : null;
        if (typeof fn === "function") {
          if (low === "onclick") { el.style.cursor = "pointer"; clickable = true; }
          el.addEventListener(low.slice(2), fn);
        }
        continue;
      }

      const m = WHOLE_BINDING.exec(value);
      if (m) {
        const v = resolvePath(m[1], scope);
        if (v == null || v === "") continue;
        el.setAttribute(name, String(v));
        continue;
      }
      el.setAttribute(name, value.includes("{{") ? interpolate(value, scope) : value);
    }
    buildInto(node, el, scope);
    // Макет использует div для действий. Делаем их доступными с клавиатуры,
    // сохраняя нативное поведение настоящих кнопок и полей.
    if (clickable && !["button", "a", "input", "select", "textarea"].includes(tag)) {
      el.setAttribute("role", "button");
      el.tabIndex = 0;
      el.addEventListener("keydown", (e) => {
        if (e.target === el && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          if (!e.repeat) el.click();
        }
      });
    }
    target.appendChild(el);
  }
}

/* ────────────────────────────────────────────────────────────────────────────
   Разговор с панелью
   ──────────────────────────────────────────────────────────────────────── */

// Ключ тот же, что был у прежней панели: продавец, уже вошедший однажды, не
// должен искать токен заново из-за смены вида.
const TOKEN_KEY = "veil.token";

const state = {
  token: null,
  // Язык ставится до первой отрисовки: словарь спрашивают все, включая
  // экран входа, а он рисуется раньше панели.
  lang: "ru",
  page: "dash",
  preset: "steel",
  acc: null,
  density: "normal",
  users: [],
  nodes: [],
  stats: null,
  keys: [],
  plans: [],
  // Фон: ручки живут отдельно от вида, файл — в IndexedDB и только там.
  // null до загрузки: Look объявлен ниже по файлу, и обратиться к нему
  // отсюда нельзя. Полный набор ручек приезжает из loadBackdrop.
  backdrop: null,
  backdropKind: "",
  backdropName: "",
  backdropBad: "",
  q: "",
  // Фильтр клиентов: all, expiring, traffic, idle, off или plan:<номер>.
  // Помним между заходами: продавец обычно смотрит одно и то же — кто
  // истекает, — и выбирать это заново каждый раз незачем.
  filter: (() => { try { return localStorage.getItem("marvia-filter") || "all"; } catch (_) { return "all"; } })(),
  // Расширенный режим — все разделы и тонкие настройки. Выключен, пока его
  // не включили: панель встречает простой, а профи включает один раз.
  advanced: (() => { try { return localStorage.getItem("marvia-advanced") === "1"; } catch (_) { return false; } })(),
  rowsPage: 1,
  loading: false,
  error: null,

  // Знаем ли мы уже, что в панели. До первого успешного ответа не знаем —
  // и обязаны это говорить, а не рисовать нули. Продавец, открывший панель и
  // увидевший «ни одного клиента», решает, что потерял базу.
  known: false,
};

// Сколько ждём ответа панели.
//
// Без предела запрос, который не вернулся, вешает страницу навсегда: панель
// показывает «Обновляю…» и нули, продавец видит «ни одного клиента» и решает,
// что потерял базу. Так и случилось на живой панели. Полминуты — с запасом на
// медленную ручку и на канал из-за границы.
const API_TIMEOUT = 30000;

async function api(path, method, body, extraHeaders) {
  let res;
  try {
    res = await fetch(path, {
      method: method || "GET",
      signal: AbortSignal.timeout(API_TIMEOUT),
      headers: Object.assign(
        { Authorization: "Bearer " + state.token },
        body ? { "Content-Type": "application/json" } : {},
        extraHeaders || {}
      ),
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (err) {
    // AbortSignal.timeout бросает TimeoutError. Отличать его от обрыва сети
    // важно: это разные беды и чинятся по-разному.
    if (err && err.name === "TimeoutError") {
      throw new Error(L().err.slow(path, Math.round(API_TIMEOUT / 1000)));
    }
    throw new Error(L().err.noPanel(path));
  }
  if (res.status === 401) {
    logout();
    throw new Error(L().err.badToken);
  }
  if (res.status === 204) return null;

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { /* не JSON */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || L().err.code(res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

// loadAlerts забирает настройки оповещений отдельно от остального.
//
// Отдельно, потому что их отдаёт только админский токен: там лежит признак
// «токен бота задан», и ключу бота с правом read его видеть незачем.
// loadJournal забирает журнал. Отдельно и только при открытии страницы: он
// длинный, нужен редко, и отдаёт его только админский токен.
async function loadJournal() {
  try {
    const res = await api("/api/v1/events?limit=200");
    state.journal = (res && res.events) || [];
  } catch (_) {
    state.journal = [];
  }
  render();
}

// journalWhen — когда это было, коротко: время для сегодняшнего, дата для
// остального. Полная дата на каждой строке съедает ширину и не читается.
function journalWhen(iso) {
  const at = new Date(iso);
  if (isNaN(at)) return "—";
  const today = new Date().toDateString() === at.toDateString();
  const hh = String(at.getHours()).padStart(2, "0");
  const mm = String(at.getMinutes()).padStart(2, "0");
  if (today) return hh + ":" + mm;
  return shortDate(iso) + " " + hh + ":" + mm;
}

// loadUpdates забирает страницу «Обновления» и, пока что-то в пути, спрашивает
// снова. Пока панель перезапускается на новой версии, запросы не проходят —
// это не ошибка, а ожидаемые секунды; страница ждёт и говорит об этом.
async function loadUpdates() {
  clearTimeout(state.updTimer);
  try {
    state.updates = await api("/api/v1/updates");
    state.updRestarting = false;
  } catch (_) {
    state.updRestarting = !!state.updWaiting;
  }
  const u = state.updates;
  const busy = state.updRestarting || (u && (u.panel.updater.pending || u.panel.updater.state === "running"
    || (u.nodes || []).some((n) => n.upgrade_to)));
  if (!busy) state.updWaiting = false;
  if (state.page === "updates" && (busy || state.updWaiting)) {
    state.updTimer = setTimeout(loadUpdates, 4000);
  }
  render();
}

async function loadAlerts() {
  try {
    state.alerts = await api("/api/v1/alerts");
  } catch (_) {
    // Не отдались — страница покажет выключенные оповещения. Продавец задаст
    // их заново, а падать из-за этого панель не должна.
    state.alerts = null;
  }
  try {
    state.scheduledBackups = await api("/api/v1/backups");
  } catch (_) {
    state.scheduledBackups = null;
  }
  try {
    state.webhooks = await api("/api/v1/webhooks");
  } catch (_) {
    state.webhooks = null;
  }
  // Связь с покупателем живёт на той же странице: это тоже настройки
  // продавца, и тоже только для админа.
  try {
    state.seller = await api("/api/v1/seller");
  } catch (_) {
    state.seller = null;
  }
  render();
  fillAlerts();
}

// fillAlerts проставляет значения в поля: разметка пересобирается на каждую
// отрисовку, и то, что человек видит, должно пережить её.
function fillAlerts() {
  const cfg = state.alerts || {};
  const on = document.getElementById("al-on");
  if (!on) return;
  on.checked = !!cfg.enabled;
  document.getElementById("al-chat").value = cfg.chat_id || "";
  document.getElementById("al-token").placeholder = cfg.has_token ? L().alerts.tokenSaved : L().alerts.tokenHint;
  const bk = state.scheduledBackups || {};
  const s3 = bk.s3 || {};
  document.getElementById("bk-on").checked = !!bk.enabled;
  document.getElementById("bk-telegram").checked = !!bk.telegram;
  document.getElementById("bk-s3").checked = !!s3.enabled;
  document.getElementById("bk-time").value = bk.time || "03:00";
  document.getElementById("bk-keep").value = bk.keep || 7;
  document.getElementById("bk-password").placeholder = bk.has_password ? L().bk.passwordSet : L().bk.passwordNeeded;
  document.getElementById("bk-secret").placeholder = bk.has_s3_secret ? L().bk.secretSet : L().bk.secretPh;
  document.getElementById("bk-session").placeholder = bk.has_s3_session ? L().bk.sessionSet : L().bk.optional;
  for (const field of ["endpoint", "region", "bucket", "prefix"]) {
    document.getElementById("bk-" + field).value = s3[field] || "";
  }
  document.getElementById("bk-access").value = s3.access_key || "";
  const wh = state.webhooks || {};
  document.getElementById("wh-on").checked = !!wh.enabled;
  document.getElementById("wh-urls").value = (wh.urls || []).join("\n");
  document.getElementById("wh-secret").placeholder = wh.has_secret ? L().wh.secretSet : L().wh.secretNeeded;
  const sl = state.seller || {};
  document.getElementById("sl-support").value = sl.support_url || "";
  document.getElementById("sl-renew").value = sl.renew_url || "";
  document.getElementById("sl-announce").value = sl.announce || "";
}

async function loadAll() {
  state.loading = true;
  state.error = null;
  render();
  try {
    // Ключи — только админу. Вошедший ключом бота получает на них 403, и
    // это не ошибка загрузки, а ответ «кто ты»: разделы админа ему не
    // показываем, а остальное грузим как обычно.
    const [users, nodes, stats, keys, plans] = await Promise.all([
      api("/api/v1/users"),
      api("/api/v1/nodes"),
      api("/api/v1/stats?days=30"),
      api("/api/v1/keys").catch((err) => {
        if (err.status === 403) return { denied: true };
        throw err;
      }),
      api("/api/v1/plans"),
    ]);
    state.admin = !(keys && keys.denied);
    state.users = (users && users.users) || [];
    state.nodes = (nodes && nodes.nodes) || [];
    state.stats = stats || null;
    state.keys = (keys && keys.keys) || [];
    state.plans = (plans && plans.plans) || [];

    // Теперь мы действительно знаем, что в панели, и можем показывать числа.
    state.known = true;
  } catch (err) {
    state.error = err.message;
  } finally {
    state.loading = false;
    render();
  }
}

function logout() {
  try { localStorage.removeItem(TOKEN_KEY); } catch (_) { /* приватное окно */ }
  state.token = null;
  document.getElementById("app").hidden = true;
  document.getElementById("login").hidden = false;
  document.getElementById("login-token").value = "";
}

/* ────────────────────────────────────────────────────────────────────────────
   Окна и сообщения

   В дизайне их нет: холст рисовал экраны, а не диалоги. Поэтому собраны здесь
   вручную, но целиком на переменных темы — окно перекрашивается вместе с
   панелью и не выпадает из выбранного вида.
   ──────────────────────────────────────────────────────────────────────── */

function el(tag, opts, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(opts || {})) {
    if (k === "text") node.textContent = v;
    else if (k === "cls") node.className = v;
    else if (k === "on") for (const [ev, fn] of Object.entries(v)) node.addEventListener(ev, fn);
    else node.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) node.append(kid);
  return node;
}

let toastTimer = null;
function toast(text, bad) {
  const old = document.getElementById("toast");
  if (old) old.remove();
  clearTimeout(toastTimer);

  const box = el("div", { id: "toast", cls: bad ? "bad" : "", role: "status", "aria-live": "polite", text });
  box.setAttribute("style", Look.vars(theme()));
  document.body.append(box);
  toastTimer = setTimeout(() => box.remove(), bad ? 6000 : 3200);
}

// closeSheet и sheet держат ровно одно окно: два наложенных друг на друга —
// верный способ нажать «удалить» не там, где смотришь.
let sheetOrigin = null;
let sheetOnClose = null;
function closeSheet() {
  const old = document.getElementById("veil");
  if (!old) return;
  old.remove();
  const onClose = sheetOnClose;
  sheetOnClose = null;
  document.getElementById("app").inert = false;
  if (sheetOrigin && sheetOrigin.isConnected) sheetOrigin.focus({ preventScroll: true });
  else {
    const current = document.querySelector('#app [aria-current="page"]');
    if (current) current.focus({ preventScroll: true });
  }
  sheetOrigin = null;
  if (onClose) onClose();
}

function sheet(title, body, buttons, onClose) {
  closeSheet();
  sheetOrigin = document.activeElement;
  sheetOnClose = onClose || null;

  const box = el("div", { cls: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "sheet-title", tabindex: "-1" }, el("h2", { id: "sheet-title", text: title }));
  for (const part of body) box.append(part);
  if (buttons && buttons.length) {
    const row = el("div", { cls: "row" });
    for (const b of buttons) row.append(b);
    box.append(row);
  }

  const veil = el("div", { id: "veil", on: { click: (e) => { if (e.target === veil) closeSheet(); } } }, box);
  // Тема живёт переменными на #app, а окно лежит выше по дереву — переносим
  // их сюда, иначе оно нарисуется цветами из значений по умолчанию.
  veil.setAttribute("style", document.getElementById("app").getAttribute("style") || "");
  document.body.append(veil);
  document.getElementById("app").inert = true;
  const first = box.querySelector("input:not([disabled]), button:not([disabled])");
  (first || box).focus();
  return box;
}

document.addEventListener("keydown", (e) => {
  const dialog = document.querySelector('#veil [role="dialog"]');
  if (!dialog) return;
  if (e.key === "Escape") { e.preventDefault(); closeSheet(); return; }
  if (e.key !== "Tab") return;
  const controls = Array.from(dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex="0"]'))
    .filter((node) => node.getClientRects().length > 0);
  const first = controls[0], last = controls[controls.length - 1];
  if (!first) { e.preventDefault(); dialog.focus(); }
  else if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog)) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && (document.activeElement === last || document.activeElement === dialog)) {
    e.preventDefault(); first.focus();
  }
});

function btn(text, cls, fn) {
  return el("button", { type: "button", cls: cls || "", text, on: { click: fn } });
}

function field(label, id, type, value, hint) {
  return el("label", { text: label },
    el("input", { id, type, value: value == null ? "" : String(value) }),
    hint ? el("span", { cls: "note", text: hint }) : null);
}

function val(id) { return (document.getElementById(id).value || "").trim(); }
function num(id) { return Number(document.getElementById(id).value) || 0; }

// ask — подтверждение своим окном, а не confirm().
//
// Родное окно браузера рисуется системными цветами поверх выбранной темы и,
// главное, не даёт объяснить последствие: «Сменить адрес подписки?» без
// объяснения человек нажимает не думая.
function ask(title, text, danger) {
  return new Promise((resolve) => {
    const done = (v) => { resolve(v); closeSheet(); };
    sheet(title, [el("div", { cls: "note", text })], [
      btn(danger || L().act.yes, "bad", () => done(true)),
      btn(L().act.cancel, "", () => done(false)),
    ], () => resolve(false));
  });
}

/* ────────────────────────────────────────────────────────────────────────────
   Действия над подписчиком
   ──────────────────────────────────────────────────────────────────────── */

// showLinks отдаёт то, что надо переслать покупателю.
//
// Приватную часть vp1 панель нигде не хранит — в этом весь смысл: утечка её
// базы не даёт доступа ни к одному покупателю. Значит показать ссылку можно
// ровно один раз, сразу после выдачи, и об этом надо предупредить.
function showLinks(title, links, fresh) {
  const d = L();
  const parts = [];
  const copy = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      toast(d.act.copied);
    } catch (_) {
      toast(d.act.noCopy, true);
    }
  };
  const add = (label, text) => {
    parts.push(el("div", { cls: "note", text: label }));
    parts.push(el("pre", { text }));
    // QR — по нажатию, на месте кнопки: продавцу он нужен у одной ссылки из
    // нескольких, и рисовать все сразу — лишние картинки с доступом на экране.
    const row = el("div", { cls: "row" });
    const qr = btn(d.links.qr, "", () => act(async () => {
      const img = await qrImage(text);
      row.replaceWith(img);
    }));
    row.append(btn(d.act.copy, "", () => copy(text)), qr);
    parts.push(row);
  };

  // Главная ссылка — та, которую покупатель вставит первой: ключ для нашего
  // приложения, если он есть, иначе подписка. С ней — три строки, что делать:
  // продавцу не придётся каждый раз объяснять это своими словами.
  const main = links.account || links.subscription;
  if (main) {
    parts.push(btn(d.links.telegram, "go", () => copy(d.links.telegramText(main))));
  }

  if (links.account) add(d.links.account, links.account);
  if (links.subscription) add(d.links.subscription, links.subscription);
  // Готовые профили для приложений, которым ссылок мало (formats.go). Только
  // когда есть VLESS или Trojan: VP1 эти приложения не знают, и профиль без
  // них панель всё равно не отдаст.
  if (links.subscription && (links.stock || []).length) {
    add(d.links.singbox, links.subscription + "?format=singbox");
    add(d.links.clash, links.subscription + "?format=clash");
  }

  // stock приходит плоским списком: по ссылке на каждую пару «нода + вид
  // доступа». Вид достаём из схемы, ноду — из хвоста после решётки: иначе
  // продавец видит несколько одинаковых на вид строк и не знает, какая куда.
  for (const link of links.stock || []) {
    const kind = (link.split("://")[0] || "доступ");
    let where = "";
    const hash = link.indexOf("#");
    if (hash >= 0) {
      try { where = " · " + decodeURIComponent(link.slice(hash + 1)); } catch (_) { /* кривой хвост */ }
    }
    add(d.links.stock(kind, where), link);
  }

  if (fresh) {
    parts.unshift(el("div", { cls: "note", text: d.links.once }));
  }

  // Панель, поднятая без -sub-base, честно ставит в ссылки заглушку вместо
  // своего адреса. Молча отдать такую продавцу — значит дать ему отправить
  // покупателю ссылку в никуда и разбираться потом, почему «не работает».
  if (JSON.stringify(links).includes("ПОДСТАВЬ-АДРЕС-ПАНЕЛИ")) {
    parts.unshift(el("div", { cls: "note", text: d.links.stub }));
  }

  sheet(title, parts, [btn(d.act.close, "go", closeSheet)]);
}

async function act(fn) {
  try {
    await fn();
  } catch (err) {
    toast(err.message, true);
  }
}

/* ────────────────────────────────────────────────────────────────────────────
   Тарифы
   ──────────────────────────────────────────────────────────────────────── */

// planLine — тариф одной строкой: «30 дней · 50 ГБ · 2 устройства».
function planLine(plan) {
  const d = L();
  return [
    plan.days ? d.plan.days(plan.days) : d.time.forever,
    plan.traffic_limit ? bytes(plan.traffic_limit) : d.plan.noTraffic,
    plan.max_ips ? d.plan.devices(plan.max_ips) : d.plan.noDevices,
    plan.speed_limit ? Math.round(plan.speed_limit / 125000) + d.user.mbit : "",
    plan.note || "",
  ].filter(Boolean).join(" · ");
}

// planPicker — тарифы кнопками, выбранный подсвечен. Кнопки, а не список:
// тарифов у продавца два-четыре, и видеть их все сразу проще, чем раскрывать.
function planPicker(plans, chosen, onPick) {
  const box = el("div", { cls: "row", role: "group" });
  const items = [];
  const pick = (id) => {
    for (const [b, p] of items) b.setAttribute("aria-pressed", String(p === id));
    onPick(id);
  };
  for (const p of plans) {
    const b = el("button", { type: "button", cls: "plan", "aria-pressed": "false", on: { click: () => pick(p.id) } },
      el("b", { text: p.name }), el("span", { text: planLine(p) }));
    items.push([b, p.id]);
    box.append(b);
  }
  if (chosen !== undefined) pick(chosen);
  return box;
}

function plansSheet() {
  const d = L();
  const parts = [el("div", { cls: "note", text: state.plans.length ? d.plan.intro : d.plan.empty })];
  for (const p of state.plans) {
    parts.push(el("button", { type: "button", cls: "plan", on: { click: () => planSheet(p) } },
      el("b", { text: p.name }), el("span", { text: planLine(p) })));
  }
  sheet(d.plan.title, parts, [
    btn(d.plan.add, "go", () => planSheet(null)),
    btn(d.act.close, "", closeSheet),
  ]);
}

function planSheet(plan) {
  const d = L();
  const p = plan || { name: "", days: 30, traffic_limit: 50 * 1024 ** 3, max_ips: 2, speed_limit: 0, note: "" };
  const save = () => act(async () => {
    const body = {
      name: val("pl-name"),
      days: num("pl-days"),
      traffic_limit: Math.round(num("pl-gb") * 1024 ** 3),
      max_ips: num("pl-ips"),
      speed_limit: Math.round(num("pl-speed") * 125000),
      note: val("pl-note"),
    };
    if (plan) await api("/api/v1/plans/" + plan.id, "PATCH", body);
    else await api("/api/v1/plans", "POST", body);
    await loadAll();
    toast(d.plan.saved);
    plansSheet();
  });
  const buttons = [btn(d.plan.save, "go", save)];
  if (plan) {
    buttons.push(btn(d.user.remove, "bad", () => act(async () => {
      const [title, text] = d.plan.askRemove(plan.name);
      if (!await ask(title, text, d.user.remove)) return;
      await api("/api/v1/plans/" + plan.id, "DELETE");
      await loadAll();
      plansSheet();
    })));
  }
  buttons.push(btn(d.act.cancel, "", plansSheet));
  sheet(plan ? plan.name : d.plan.newTitle, [
    field(d.plan.name[0], "pl-name", "text", p.name, d.plan.name[1]),
    field(d.user.newDays[0], "pl-days", "number", p.days, d.user.newDays[1]),
    field(d.user.newGB[0], "pl-gb", "number", Math.round(p.traffic_limit / 1024 ** 3 * 10) / 10, d.user.newGB[1]),
    field(d.user.newIPs[0], "pl-ips", "number", p.max_ips, d.user.newIPs[1]),
    field(d.user.newSpeed[0], "pl-speed", "number", Math.round(p.speed_limit / 125000), d.user.newSpeed[1]),
    field(d.plan.note[0], "pl-note", "text", p.note || "", d.plan.note[1]),
  ], buttons);
}

function newUserSheet() {
  const d = L();
  const kinds = el("fieldset", { cls: "kinds" }, el("legend", { text: d.user.kinds }));
  for (const kind of ["vp1", "vless", "trojan"]) {
    const input = el("input", { type: "checkbox", value: kind });
    if (kind === "vp1") input.checked = true;
    kinds.append(el("label", {}, input, el("span", { text: kind + " · " + d.user.kindNote[kind] })));
  }

  // По тарифу — по умолчанию, если тарифы есть: это и быстрее, и без
  // опечаток. «Свои значения» открывают прежние поля для особого случая.
  let planID = state.plans.length ? state.plans[0].id : null;
  const own = el("div", { cls: "own" },
    field(d.user.newDays[0], "nu-days", "number", 30, d.user.newDays[1]),
    field(d.user.newGB[0], "nu-gb", "number", 100, d.user.newGB[1]),
    field(d.user.newIPs[0], "nu-ips", "number", 3, d.user.newIPs[1]),
    field(d.user.newSpeed[0], "nu-speed", "number", 0, d.user.newSpeed[1]));
  const ownToggle = btn(d.plan.own, "", () => {
    planID = null;
    for (const b of picker.querySelectorAll(".plan")) b.setAttribute("aria-pressed", "false");
    own.hidden = false;
    ownToggle.hidden = true;
  });
  const picker = planPicker(state.plans, planID === null ? undefined : planID, (id) => {
    planID = id;
    own.hidden = true;
    ownToggle.hidden = false;
  });
  own.hidden = planID !== null;
  ownToggle.hidden = planID === null;

  const parts = [field(d.user.newLabel[0], "nu-label", "text", "", d.user.newLabel[1])];
  if (state.plans.length) parts.push(el("div", { cls: "note", text: d.plan.pick }), picker, ownToggle);
  else if (state.admin) parts.push(el("div", { cls: "note", text: d.plan.hint }));
  parts.push(own, kinds);

  const box = sheet(d.user.newTitle, parts, [
    btn(d.user.create, "go", () => act(async () => {
      const picked = Array.from(box.querySelectorAll(".kinds input:checked")).map((i) => i.value);
      if (!picked.length) { toast(d.user.pickKind, true); return; }

      const body = { label: val("nu-label"), kinds: picked };
      if (planID !== null) {
        body.plan_id = planID;
      } else {
        body.traffic_limit = Math.round(num("nu-gb") * 1024 * 1024 * 1024);
        body.max_ips = num("nu-ips");
        // Продавец думает мегабитами, нода считает байтами. 1 Мбит/с — ровно
        // 125 000 Б/с, так что обратный пересчёт в панели не округляет.
        body.speed_limit = Math.round(num("nu-speed") * 125000);
        const days = num("nu-days");
        if (days > 0) body.expires_at = new Date(Date.now() + days * 86400000).toISOString();
      }

      const res = await api("/api/v1/users", "POST", body);
      await loadAll();
      showLinks(d.user.issuedTitle, res.links || {}, true);
    })),
    btn(d.act.cancel, "", closeSheet),
  ]);
}

// renewSheet — продление по тарифу. Тариф покупателя выбран заранее: чаще
// всего продлевают тем же, чем купили.
function renewSheet(user) {
  const d = L();
  const known = state.plans.some((p) => p.id === user.plan_id);
  let planID = known ? user.plan_id : state.plans[0].id;
  sheet(d.plan.renewTitle(user.label || "#" + user.id), [
    el("div", { cls: "note", text: d.plan.renewNote }),
    planPicker(state.plans, planID, (id) => { planID = id; }),
  ], [
    btn(d.plan.renew, "go", () => act(async () => {
      await api("/api/v1/users/" + user.id + "/renew", "POST", { plan_id: planID });
      closeSheet();
      toast(d.plan.renewed);
      await loadAll();
    })),
    btn(d.act.cancel, "", closeSheet),
  ]);
}

// qrImage — QR-код ссылки картинкой. Рисует панель: ссылку с доступом не
// отдаём ни в какой внешний сервис, а скрипты со стороны CSP не пускает.
async function qrImage(text) {
  const res = await fetch("/api/v1/qr", {
    method: "POST",
    signal: AbortSignal.timeout(API_TIMEOUT),
    headers: { Authorization: "Bearer " + state.token, "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  if (!res.ok) throw new Error(L().err.code(res.status));
  const url = URL.createObjectURL(await res.blob());
  return el("img", { cls: "qr", src: url, alt: L().links.qrAlt });
}

function userSheet(user) {
  const name = user.label || ("#" + user.id);
  const left = daysLeft(user.expires_at);

  const d = L();
  const facts = [
    [d.user.state, user.enabled ? d.user.on : d.user.off],
    [d.user.term, user.expires_at
      ? shortDate(user.expires_at) + (left === null ? "" : d.user.days(left))
      : d.time.forever],
    [d.user.used, bytes(user.used) + (user.traffic_limit ? d.user.of + bytes(user.traffic_limit) : d.user.noLimit)],
    [d.user.devices, user.max_ips ? String(user.max_ips) : d.user.noDeviceLimit],
    // Срез, а не журнал: соединений сейчас, устройств из лимита (адреса нода
    // считает только тем, у кого лимит есть) и когда был в последний раз.
    [d.user.presence, user.online
      ? d.user.online(user.online) + (user.max_ips ? " · " + d.user.onlineOf(user.devices, user.max_ips) : "")
      : (user.last_seen ? d.user.offline + d.user.seen + sinceLabel(user.last_seen) : d.user.never)],
    [d.user.speed, user.speed_limit ? Math.round(user.speed_limit / 125000) + d.user.mbit : d.user.noSpeedLimit],
  ].map(([k, v]) => el("div", { cls: "note", text: k + ": " + v }));

  // Доступы — списком с отзывом поштучно.
  //
  // У одного покупателя их бывает несколько: наш vp1 на телефон и vless на
  // старое приложение, которое он не хочет менять. Отзывать всё разом, когда
  // утёк один, значит наказывать человека за чужую беду.
  const creds = user.credentials || [];
  facts.push(el("div", { cls: "note", text: creds.length ? d.user.creds : d.user.noCreds }));
  for (const c of creds) {
    facts.push(el("div", { cls: "line" },
      el("div", { cls: "note", text: c.kind + d.user.issued + shortDate(c.created_at) }),
      // Смена ключа — не то же, что отзыв. Отзыв оставляет покупателя без
      // доступа, пока ему не выдадут новый; смена отдаёт новую ссылку сразу,
      // а старый ключ перестаёт работать. Это ответ на «ключ утёк», а не на
      // «человек больше не платит».
      btn(d.user.rotateKey, "", () => act(async () => {
        if (!await ask(d.user.askRotateKeyTitle, d.user.askRotateKeyText(c.kind), d.user.rotateKey)) return;
        const res = await api("/api/v1/credentials/" + c.id + "/rotate", "POST");
        closeSheet();
        await loadAll();
        showLinks(d.user.keyRotated, res.links || {}, true);
      })),
      btn(d.key.revoke, "bad", () => act(async () => {
        const [title, text, word] = d.user.askRevoke(c.kind, creds.length === 1);
        if (!await ask(title, text, word)) return;
        await api("/api/v1/credentials/" + c.id, "DELETE");
        closeSheet();
        toast(d.user.credRevoked);
        await loadAll();
      }))));
  }

  // Выдать можно только то, чего ещё нет: второй vp1 у одного покупателя
  // ничего не даёт, а в списке путается с первым.
  const have = new Set(creds.map((c) => c.kind));
  const missing = ["vp1", "vless", "trojan"].filter((k) => !have.has(k));
  if (missing.length) {
    const row = el("div", { cls: "row" });
    for (const kind of missing) {
      row.append(btn("+ " + kind, "", () => act(async () => {
        const res = await api("/api/v1/users/" + user.id + "/credentials", "POST", { kind, label: "" });
        await loadAll();
        showLinks(d.user.issuedKind(kind), res.links || {}, true);
      })));
    }
    facts.push(el("div", { cls: "note", text: d.user.addMore }));
    facts.push(row);
  }

  const plan = state.plans.find((p) => p.id === user.plan_id);
  if (plan) facts.splice(1, 0, el("div", { cls: "note", text: d.plan.of + ": " + plan.name }));

  // Обнулить расход — подарить трафик или исправить ошибку, не трогая срок.
  // Только если лимит есть: без лимита обнулять нечего, кнопка была бы пустой.
  if (user.traffic_limit && user.used) {
    facts.push(el("div", { cls: "row" }, btn(d.plan.reset, "", () => act(async () => {
      const [title, text, word] = d.plan.askReset(bytes(user.used));
      if (!await ask(title, text, word)) return;
      await api("/api/v1/users/" + user.id + "/reset-traffic", "POST");
      closeSheet();
      toast(d.plan.wasReset);
      await loadAll();
    }))));
  }

  sheet(name, facts, [
    // С тарифами продление — по тарифу: срок, лимиты и новый период расхода
    // разом. Без тарифов — как раньше, +30 дней к сроку.
    state.plans.length
      ? btn(d.plan.renew, "go", () => renewSheet(user))
      : btn(d.user.extend, "go", () => act(async () => {
        await api("/api/v1/users/" + user.id, "PATCH", { extend_by: "30d", enabled: true });
        closeSheet();
        toast(d.user.extended);
        await loadAll();
      })),
    btn(d.user.links, "", () => act(async () => {
      const links = await api("/api/v1/users/" + user.id + "/links");
      showLinks(name, links, false);
    })),
    btn(user.enabled ? d.user.disable : d.user.enable, "", () => act(async () => {
      await api("/api/v1/users/" + user.id, "PATCH", { enabled: !user.enabled });
      closeSheet();
      await loadAll();
    })),
    btn(d.user.rotate, "bad", () => act(async () => {
      const [title, text, word] = d.user.askRotate;
      if (!await ask(title, text, word)) return;
      await api("/api/v1/users/" + user.id + "/sub-token", "POST");
      const res = await api("/api/v1/users/" + user.id + "/credentials", "POST", { kind: "vp1", label: "" });
      showLinks(d.links.newFor(name), res.links || {}, true);
      await loadAll();
    })),
    btn(d.user.remove, "bad", () => act(async () => {
      const [title, text] = d.user.askRemove(name);
      if (!await ask(title, text, d.user.remove)) return;
      await api("/api/v1/users/" + user.id, "DELETE");
      closeSheet();
      toast(d.user.removed);
      await loadAll();
    })),
    btn(d.act.close, "", closeSheet),
  ]);
}

// newNodeSheet — то, о чём установщик панели говорит последней строкой:
// «открой панель, вкладка Ноды → Добавить ноду». До сих пор этой кнопки не
// было, и продавец на первом же шаге упирался в curl.
//
// Панель отдаёт не инструкцию, а готовую строку: приглашение уже внутри,
// бинарники нода возьмёт у самой панели. На чистом сервере не нужно ни
// флагов, ни файлов для правки.
function newNodeSheet() {
  act(async () => {
    const res = await api("/api/v1/nodes/invite", "POST", { label: "" });
    const cmd = res.command;

    const d = L();
    const before = new Set((state.nodes || []).map((n) => n.id));
    const steps = el("div", { cls: "wizard" });
    const help = el("div", { cls: "wizard-help" });
    help.hidden = true;
    sheet(d.node.newTitle, [
      el("div", { cls: "note", text: d.node.paste }),
      el("pre", { text: cmd }),
      btn(d.act.copy, "go", async () => {
        try {
          await navigator.clipboard.writeText(cmd);
          toast(d.act.copied);
        } catch (_) {
          toast(d.act.noCopy, true);
        }
      }),
      steps,
      help,
      el("div", { cls: "note", text: d.node.invite }),
      el("div", { cls: "note", text: d.node.vars }),
    ], [btn(d.act.done, "", () => { closeSheet(); loadAll(); })]);
    watchNewNode(steps, help, before);
  });
}

// watchNewNode ведёт продавца по шагам, пока нода ставится: строка вставлена →
// нода зарегистрировалась → на связи.
//
// Раньше окно показывало строку и молчало, и продавец не знал, ждать ли ещё
// или что-то сломалось. Больше всего теряются именно здесь: порт 443 занят,
// файрвол, сервер не видит панель. Если за четыре минуты нода не появилась,
// окно само показывает, что проверить и какой командой.
function watchNewNode(steps, help, before) {
  const d = L();
  const started = Date.now();
  const draw = (registered, online, node) => {
    const mark = (done) => (done ? "✓ " : "… ");
    steps.replaceChildren(
      el("div", { cls: "step" + (registered ? " done" : "") }, el("span", { text: mark(registered) + d.node.wizRegistered }),
        node ? el("span", { cls: "note", text: " · " + (node.name || node.address) }) : null),
      el("div", { cls: "step" + (online ? " done" : "") }, el("span", { text: mark(online) + d.node.wizOnline })),
    );
    if (online) steps.append(el("div", { cls: "note", text: d.node.wizDone }));
  };
  const showHelp = () => {
    if (!help.hidden) return;
    const origin = location.origin;
    const parts = [el("div", { cls: "note", text: d.node.wizSlow })];
    for (const [what, command] of d.node.wizChecks(origin)) {
      parts.push(el("div", { cls: "note", text: what }), el("pre", { text: command }));
    }
    help.replaceChildren(...parts);
    help.hidden = false;
  };
  draw(false, false, null);

  const tick = async () => {
    if (!steps.isConnected) return; // окно закрыли — перестаём спрашивать панель
    try {
      const res = await api("/api/v1/nodes");
      const fresh = ((res && res.nodes) || []).find((n) => !before.has(n.id));
      const online = !!fresh && nodeAlive(fresh);
      draw(!!fresh, online, fresh || null);
      if (online) { loadAll(); return; }
    } catch (_) { /* панель на миг недоступна — спросим ещё раз */ }
    if (Date.now() - started > 4 * 60 * 1000) showHelp();
    setTimeout(tick, 4000);
  };
  setTimeout(tick, 4000);
}

function nodeSheet(node) {
  const alive = nodeAlive(node);

  const d = L();
  const facts = [
    [d.node.address, node.address],
    [d.node.cover, node.sni || "—"],
    [d.node.state, node.enabled ? (alive ? d.node.online : d.node.silentOn) : d.node.offState],
    [d.node.lastSeen, sinceLabel(node.last_seen)],
  ].map(([k, v]) => el("div", { cls: "note", text: k + ": " + v }));

  // Имя и страну пишет продавец, а не хостер и не панель. Хостер зовёт машину
  // vm-4823917-ubuntu, и ровно это видит покупатель в списке серверов; а адреса
  // у хостеров числятся то в Нидерландах, то в США, так что определять страну
  // по адресу значит врать покупателю, выбравшему Финляндию.
  const form = [
    field(d.node.name[0], "nd-name", "text", node.name || "", d.node.name[1]),
    field(d.node.country[0], "nd-country", "text", node.country || "", d.node.country[1]),
  ];

  // Отпечаток TLS выбирает продавец, а не клиент. Перебирать его самому
  // клиенту нельзя: по наблюдениям 2026 года смена отпечатка сразу после
  // заморозки адреса её удлиняет. Пусто — Chrome, как было до выбора.
  const fp = el("select", { id: "nd-fp" });
  for (const name of ["", ...FINGERPRINTS.filter((n) => n !== "chrome")]) {
    const option = el("option", { value: name, text: name || d.node.fpDefault });
    if ((node.fingerprint || "").replace("chrome", "") === name) option.setAttribute("selected", "");
    fp.append(option);
  }
  // Отпечаток — тонкая настройка: в простом режиме поле не показываем, а
  // сохраняем то, что уже выбрано, — fp.value берётся из списка и без него.
  if (state.advanced) form.push(el("label", { text: d.node.fp[0] }, fp, el("span", { cls: "note", text: d.node.fp[1] })));

  // Запасные имена прикрытия — только под REALITY: там ноду подтверждает её
  // ключ, а не сертификат, и в SNI годится любое принимаемое имя. При обычном
  // TLS и за CDN имя обязано совпадать с сертификатом, и поля здесь нет —
  // нарисованное, оно обещало бы то, чего не будет.
  // Имена прикрытия нода сообщает сама, вместе с расходом. Поэтому здесь
  // они показаны, а не редактируются: поле для правки означало бы, что
  // вписанное сюда переживёт следующий отчёт ноды, — а оно не переживёт.
  // Менять их надо там, где они заданы: флагом -reality-sni на самой ноде.
  if (node.reality_public_key) {
    const names = (node.sni_extra || []);
    facts.push(el("div", { cls: "note", text: d.node.sniExtra + ": " + (names.length ? names.join(", ") : "—") }));
  }

  sheet(node.name || node.address, facts.concat(form), [
    btn(d.node.save, "go", () => act(async () => {
      await api("/api/v1/nodes/" + node.id, "PATCH", { name: val("nd-name"), country: val("nd-country"), fingerprint: fp.value });
      closeSheet();
      toast(d.node.saved);
      await loadAll();
    })),
    btn(node.enabled ? d.node.disable : d.node.enable, "", () => act(async () => {
      await api("/api/v1/nodes/" + node.id, "PATCH", { enabled: !node.enabled });
      closeSheet();
      toast(node.enabled ? d.node.disabled : d.node.enabled);
      await loadAll();
    })),
    btn(d.node.remove, "bad", () => act(async () => {
      const [title, text, word] = d.node.askRemove(node.name || node.address);
      if (!await ask(title, text, word)) return;
      await api("/api/v1/nodes/" + node.id, "DELETE");
      closeSheet();
      toast(d.node.removed);
      await loadAll();
    })),
    btn(d.act.close, "", closeSheet),
  ]);
}

            await navigator.clipboard.writeText(secret);
            toast(d.act.copied);
          } catch (_) {
            toast(d.act.noCopy, true);
          }
        }),
      ], [btn(d.act.done, "", closeSheet)]);
    })),
    btn(d.act.cancel, "", closeSheet),
  ]);
}

function keySheet(key) {

// downloadBackup забирает копию базы браузером, а не ссылкой.
//
// Ручка требует админский токен в заголовке, а обычная ссылка его не несёт:
// нажатие на <a href="/api/v1/backup"> получило бы 401. Поэтому качаем сами и
// отдаём файл уже из памяти.
function downloadBackup() {
  act(async () => {
    toast(L().backup.taking);
    const res = await fetch("/api/v1/backup", { headers: { Authorization: "Bearer " + state.token } });
    if (!res.ok) throw new Error(L().backup.failed(res.status));

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0, 10);
    const a = el("a", { href: url, download: "marvia-panel-" + stamp + ".db" });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast(L().backup.done);
  });
}

// bulkSheet — одно действие над теми, кого сейчас показывает список: отбери
// фильтром «Истекают» и продли всех разом. Удаления здесь нет: стереть сотню
// одной кнопкой — слишком дорогая ошибка, а отключение обратимо.
function bulkSheet(list) {
  const d = L();
  const ids = list.map((u) => u.id);
  // Ключ повтора на окно: двойное нажатие или переотправка не продлят дважды.
  const key = "bulk-" + Date.now() + "-" + Math.random().toString(36).slice(2);
  const run = (title, body) => act(async () => {
    if (!await ask(title, d.bulk.confirm(ids.length), d.bulk.go)) return;
    const res = await api("/api/v1/users/bulk", "POST", Object.assign({ ids }, body), { "Idempotency-Key": key + "-" + body.action });
    await loadAll();
    toast(d.bulk.result(res.done, (res.failed || []).length));
  });

  const parts = [el("div", { cls: "note", text: d.bulk.intro(ids.length) })];
  if (state.plans.length) {
    let planID = state.plans[0].id;
    parts.push(planPicker(state.plans, planID, (id) => { planID = id; }));
    parts.push(btn(d.bulk.renew, "go", () => run(d.bulk.renew, { action: "renew", plan_id: planID })));
  } else {
    parts.push(btn(d.bulk.extend, "go", () => run(d.bulk.extend, { action: "extend", extend_by: "30d" })));
  }
  parts.push(el("div", { cls: "row" },
    btn(d.bulk.enable, "", () => run(d.bulk.enable, { action: "enable" })),
    btn(d.bulk.disable, "bad", () => run(d.bulk.disable, { action: "disable" })),
    btn(d.bulk.reset, "", () => run(d.bulk.reset, { action: "reset" }))));
  parts.push(el("div", { cls: "note", text: d.bulk.csvNote }));
  parts.push(btn(d.bulk.csv, "", () => downloadCSV()));
  sheet(d.bulk.title, parts, [btn(d.act.close, "", closeSheet)]);
}

// downloadCSV — все клиенты таблицей, без токенов и ключей.
function downloadCSV() {
  act(async () => {
    const res = await fetch("/api/v1/users.csv", { headers: { Authorization: "Bearer " + state.token } });
    if (!res.ok) throw new Error(L().err.code(res.status));
    const url = URL.createObjectURL(await res.blob());
    const a = el("a", { href: url, download: "marvia-clients-" + new Date().toISOString().slice(0, 10) + ".csv" });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  });
}

/*%LOOK%*/

const { PRESETS, DENSITY, LOOKS, mix, lum, bestOn } = Look;

function theme(ov) {
  const st = ov ? Object.assign({}, state, ov) : state;
  return Look.theme(st);
}

function saveLook() { Look.save(state); }
function loadLook() { Object.assign(state, Look.load()); }

// Фон из файла.
//
// Файл никуда не уходит: ни на сервер панели, ни в код темы. Он лежит в
// IndexedDB того браузера, где его выбрали, и панель к нему обращается по
// blob-адресу. Отдельный слой вне #app — потому что перерисовка собирает
// #app заново, и видео дёргалось бы с начала на каждое нажатие.
let backdropURL = null;

function paintBackdrop() {
  const layer = document.getElementById("bg-layer");
  const veil = document.getElementById("bg-veil");
  const on = !!backdropURL;
  layer.hidden = !on;
  veil.hidden = !on;
  if (!on) { layer.replaceChildren(); return; }

  const t = theme();
  const css = Look.backdropCss(state.backdrop, t);
  // Под «вписать целиком» остаются поля — их закрывает фон темы, а не
  // чёрный: иначе светлая тема получает чёрную рамку по краям экрана.
  layer.style.background = t.bg;
  veil.style.background = css.veil;

  const tag = state.backdropKind === "video" ? "video" : "img";
  let media = layer.firstElementChild;
  if (!media || media.tagName.toLowerCase() !== tag || media.src !== backdropURL) {
    media = document.createElement(tag);
    if (tag === "video") {
      // Звук выключен и включить его нечем. Панель, которая начинает
      // говорить, когда её открыли, — это не фон, это происшествие.
      media.muted = true;
      media.autoplay = true;
      media.loop = true;
      media.setAttribute("playsinline", "");
    }
    media.src = backdropURL;
    layer.replaceChildren(media);
  }
  media.setAttribute("style", css.media);
}

// useBackdropFile принимает выбранный файл: адрес прежнего отзываем, иначе
// каждая замена фона оставляет в памяти вкладки ещё одно видео.
function useBackdropFile(file) {
  if (backdropURL) URL.revokeObjectURL(backdropURL);
  backdropURL = null;
  state.backdropKind = "";
  state.backdropName = "";
  if (file) {
    backdropURL = URL.createObjectURL(file);
    state.backdropKind = String(file.type || "").startsWith("video") ? "video" : "image";
    state.backdropName = file.name || "";
  }
  paintBackdrop();
}

async function loadBackdrop() {
  Object.assign(state, { backdrop: Look.loadBackdrop() });
  let file = null;
  try { file = await Look.getBackdropFile(); } catch (_) { return; /* приватное окно: фон просто не запомнился */ }
  useBackdropFile(file);
  if (state.token) render();
}

// L — словарь текущего языка. Нужен обработчикам окон: они живут вне
// renderVals и своей области видимости не имеют.
function L() { return TEXTS[state.lang] || TEXTS.ru; }

// pickLang выбирает язык при первом заходе.
//
// Спрашивать человека на пустом экране незачем: браузер уже знает, на каком
// языке он читает. Русский берём и для языков бывшего СССР — панель на них не
// переведена, а английский там понимают хуже русского.
function pickLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && TEXTS[saved]) return saved;
  } catch (_) { /* приватное окно */ }

  const want = (navigator.languages || [navigator.language || ""]).join(",").toLowerCase();
  return /\b(ru|be|uk|kk|ky|uz|tg|hy|az)\b/.test(want) ? "ru" : "en";
}

function setLang(lang) {
  if (!TEXTS[lang]) return;
  state.lang = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (_) { /* приватное окно */ }
  document.documentElement.lang = lang;
  paintLogin();
  // Панель перерисовываем только когда она есть: до входа рисовать нечего.
  if (state.token) render();
}

// paintLogin переписывает экран входа: он живёт вне шаблона, потому что до
// проверки токена показывать панель нечего.
function paintLogin() {
  const d = L();
  document.getElementById("login-title").textContent = d.login.title;
  document.getElementById("login-brand").textContent = d.login.brand;
  document.getElementById("login-label").textContent = d.login.token;
  document.getElementById("login-hint").textContent = d.login.hint;
  document.getElementById("login-token").placeholder = d.login.token;
  document.getElementById("login-enter").textContent = d.login.enter;
  document.getElementById("login-lang").textContent = d.switchTo;
  document.getElementById("login-lang").setAttribute("aria-label", d.switchTitle);
}

/* ────────────────────────────────────────────────────────────────────────────
   Человеческие форматы
   ──────────────────────────────────────────────────────────────────────── */

function bytes(n) {
  const units = L().bytes;
  // Голый «0» рядом с «12.4 ГБ» читается как другая величина, а не как ноль
  // байт. Держим единицу и на нуле, и на языке интерфейса («0 Б» / «0 B»).
  if (!n) return "0 " + units[0];
  let i = 0, v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  // Целое пишем без «.0»: тариф «50 ГБ» в списке не должен выглядеть как
  // «50.0 ГБ», будто это замер, а не круглое число.
  const shown = v >= 100 || i === 0 || Number.isInteger(v) ? String(Math.round(v)) : v.toFixed(1);
  return shown + " " + units[i];
}

// shortDate отдаёт дату так, как её пишут на языке интерфейса.
//
// Своей раскладки не изобретаем: 09.10.2026 и 10/09/2026 — это один и тот же
// день, и человек, привыкший к своей записи, читает чужую с ошибкой ровно там,
// где ошибиться дороже всего — в сроке подписки.
function shortDate(iso) {
  if (!iso) return L().time.forever;
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString(L().lang, { day: "2-digit", month: "2-digit", year: "numeric" });
}

function dayLabel(day) {
  const p = day.split("-");
  if (p.length !== 3) return day;
  // На оси графика год не нужен, а порядок дня и месяца — нужен.
  return L().lang === "en" ? p[1] + "." + p[2] : p[2] + "." + p[1];
}

// sinceLabel — «когда нода последний раз выходила на связь». Панель считает
// ноду живой, если та отмечалась недавно: своего пинга у панели нет, а врать
// зелёным кружком нельзя.
function sinceLabel(iso) {
  // Словарь берём через L(), а не через d18 — и вот почему.
  //
  // d18 — локальная переменная внутри renderVals, снаружи такого имени нет.
  // Обращение к нему отсюда роняло всю отрисовку — но только когда на связь
  // выходила хотя бы одна нода: без нод эта функция не вызывается. На пустой
  // панели всё выглядело здоровым, а у продавца с нодами страница навсегда
  // замирала на «Обновляю…».
  const w = L();
  if (!iso) return w.time.never;
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const mins = Math.floor((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return w.time.now;
  if (mins < 60) return mins + w.time.min;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + w.time.hour;
  return Math.floor(hours / 24) + w.time.day;
}

function nodeAlive(node) {
  if (!node.enabled || !node.last_seen) return false;
  return Date.now() - new Date(node.last_seen).getTime() < 10 * 60 * 1000;
}

function keyShort(user) {
  const cred = (user.credentials || [])[0];
  if (!cred || !cred.secret) return "—";
  return cred.secret.slice(0, 4) + "…" + cred.secret.slice(-4);
}

function daysLeft(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return Math.ceil((d.getTime() - Date.now()) / 86400000);
}

// пугают больше, чем помогают; остальные — в расширенном режиме.
